# ゆくすいえ：1つの Worker で、画面（静的アセット）と /api/* を担う
name = "yukusuie"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# プレイの記録（再生コード用）と、回数・費用の数え上げ
[[kv_namespaces]]
binding = "STORE"
id = "b6f160f4e88842288624a13eec26058a"

[vars]
# 役割ごとのモデル（環境変数で切り替え可能）
MODEL_TOP = "claude-sonnet-5-5"
MODEL_MID = "claude-sonnet-5-5"
MODEL_LIGHT = "claude-haiku-5-5"
# パートナー（ひとりプレイの妻）と、設計担当（間取りの骨組み）
MODEL_PARTNER = "claude-sonnet-5-5"
MODEL_PLANNER = "claude-opus-5-5"
# 回数制限と費用の上限
PLAYS_PER_IP_PER_DAY = "6"
CALLS_PER_IP_PER_DAY = "120"
CALLS_GLOBAL_PER_DAY = "4000"
EMERGENCY_STOP = "0"
# 費用の上限（ドル）。超えたらClaudeを呼ばず、代わりの文で返す
DAILY_BUDGET_USD = "25"
TOTAL_BUDGET_USD = "150"
# live＝Claudeを呼ぶ／mock＝呼ばずに代わりの処理（開発中のテストはこちら）
AI_MODE = "live"
# スマホ連携の受け付け（P1）。1 で、PHONE_FROM〜PHONE_UNTIL のあいだだけ開く（審査期間）
PHONE_LINK = "1"
PHONE_FROM = "2026-11-08T20:00:00+09:00"
PHONE_UNTIL = "2026-11-10T23:59:59+09:00"
# 実機の確認のための一時的な受け付け（この時刻を過ぎると自動で閉じる）
PHONE_TEST_UNTIL = "2026-11-04T16:03:00+09:00"

# プロンプト（prompts/*.md）を文字列として読み込む
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# スマホ連携の受け渡し（Durable Objects。セッションの間だけ保存し、30分で自動削除）
[[durable_objects.bindings]]
name = "LINK"
class_name = "PhoneLink"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PhoneLink"]
