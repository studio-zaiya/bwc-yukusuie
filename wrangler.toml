# ゆくすいえ：1つの Worker で、画面（静的アセット）と /api/* を担う
name = "yukusuie"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# プレイの記録（再生コード用）と回数の数え上げ。id は `wrangler kv namespace create YUKU_STORE` の結果で埋める
# [[kv_namespaces]]
# binding = "STORE"
# id = ""

[vars]
# 役割ごとのモデル（環境変数で切り替え可能）
MODEL_TOP = "claude-sonnet-5-5"
MODEL_MID = "claude-sonnet-5-5"
MODEL_LIGHT = "claude-haiku-5-5"
# 回数制限と費用の上限
PLAYS_PER_IP_PER_DAY = "6"
CALLS_PER_IP_PER_DAY = "120"
CALLS_GLOBAL_PER_DAY = "4000"
EMERGENCY_STOP = "0"
# スマホ連携の受け付け（P1）
PHONE_LINK = "0"

# プロンプト（prompts/*.md）を文字列として読み込む
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
