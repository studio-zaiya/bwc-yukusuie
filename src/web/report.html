<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ゆくすいえ　1年後のレポート（印刷用）</title>
<style>
/* レポート v2（docs/REPORT_v2.md）：A4縦・4ページ。余白18mm、本文9.5pt以上、本文は墨、金額は万円 */
@page{size:A4;margin:0}
:root{--paper:#FFFAF0;--sheet:#FFFFFF;--ink:#1E2B36;--ink2:#4E5660;--line:rgba(30,43,54,.18);
  --kazu:#E8701F;--yuu:#1C8DCC;--gold:#F2C230;--goldT:#8C6A00;
  --f:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic",sans-serif;--fr:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#DDD5C6}
body{font-family:var(--f);color:var(--ink);font-size:9.5pt;line-height:1.6;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-variant-numeric:tabular-nums}
.page{width:210mm;height:297mm;margin:8mm auto;background:var(--paper);padding:18mm 18mm 16mm;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4mm}
@media print{html{background:none}.page{margin:0;break-after:page}.page:last-of-type{break-after:auto}}
.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.5mm solid var(--ink);padding-bottom:2mm}
.logo{font-family:var(--fr);font-weight:900;font-size:14pt;letter-spacing:.05em}
.meta{font-size:8pt;color:var(--ink2);text-align:right;line-height:1.5}
h2{font-family:var(--fr);font-size:14pt;font-weight:900;margin:0 0 1.6mm}
h3{font-size:10.5pt;font-weight:700;margin:0 0 1.2mm}
.sub{font-size:8pt;color:var(--ink2)}
.box{background:var(--sheet);border:.3mm solid var(--line);border-radius:2.4mm;padding:3.4mm 4mm}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
ul{list-style:none}li{margin:.6mm 0}
.sq::before{content:"■";color:var(--kazu);margin-right:1.2mm}.ci::before{content:"●";color:var(--yuu);margin-right:1.2mm}.bo::before{content:"■●";margin-right:1.2mm;background:linear-gradient(90deg,var(--kazu) 50%,var(--yuu) 50%);-webkit-background-clip:text;color:transparent}
table{width:100%;border-collapse:collapse}
td,th{padding:1.2mm 1.4mm;border-bottom:.25mm solid var(--line);text-align:left;vertical-align:top}
th{font-size:8pt;color:var(--ink2);font-weight:700}
td.n{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:8pt;border:.25mm solid var(--ink);border-radius:99mm;padding:0 1.8mm;margin-right:1.2mm;white-space:nowrap}
.foot{margin-top:auto;font-size:8pt;color:var(--ink2);line-height:1.5;border-top:.25mm solid var(--line);padding-top:1.6mm;display:flex;justify-content:space-between;gap:6mm}
/* 表紙 */
.cover{align-items:center;text-align:center}
.cv-logo{height:70mm;margin-top:2mm}
.cv-k{font-size:11pt;color:var(--ink2);letter-spacing:.2em;margin-top:3mm}
.cv-title{font-family:var(--fr);font-weight:900;font-size:28pt;line-height:1.3;margin:2mm 0 3mm}
.cv-wc{width:174mm;height:100mm;border:none;display:block}
.cv-meta{font-size:11pt;margin-top:3mm}.cv-date{font-size:9pt;color:var(--ink2)}
/* 2ページ目 */
.p2top{display:grid;grid-template-columns:82mm 1fr;gap:4mm}
.zone svg{width:100%;height:auto;display:block}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:.6mm 3mm;margin-top:2mm}dl.facts dt{color:var(--ink2);font-size:8.5pt}dl.facts dd{font-weight:700}
.dec{padding:1.3mm 0;border-bottom:.25mm dashed var(--line)}.dec:last-child{border-bottom:none}
.dec .q{font-size:8pt;color:var(--ink2)}.dec b{display:block}.dec .why{font-size:9pt}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:2mm;margin-top:2mm}.money div{border:.25mm solid var(--line);border-radius:1.6mm;padding:1.4mm 2mm;background:#fff}
.money span{display:block;font-size:8pt;color:var(--ink2)}.money b{font-size:12pt}
.wtab td.st{white-space:nowrap;font-weight:700}
.alt{margin-top:1.6mm;font-size:9.5pt;border-left:1mm solid var(--gold);padding-left:2.4mm}
/* 3ページ目 */
.cut{border-top:.4mm dashed var(--ink);position:relative;margin-top:-4mm;padding-top:2mm;font-size:8pt;color:var(--ink2)}
.cut svg{position:absolute;left:-1mm;top:-2.6mm;background:var(--paper)}
ol.ask{list-style:none;counter-reset:a}ol.ask li{counter-increment:a;padding-left:6mm;position:relative}ol.ask li::before{content:counter(a);position:absolute;left:0;top:.2mm;width:4.2mm;height:4.2mm;border-radius:50%;background:var(--ink);color:var(--paper);font-size:7.5pt;display:grid;place-items:center}
ul.chk li{padding-left:5.5mm;position:relative}ul.chk li::before{content:"";position:absolute;left:0;top:1.2mm;width:3mm;height:3mm;border:.3mm solid var(--ink);border-radius:.6mm}
/* 4ページ目 */
.near{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.wc{background:#fff;border:.3mm solid var(--line);border-radius:2.4mm;padding:2.6mm 3mm;display:grid;grid-template-columns:24mm 1fr;gap:2.4mm}
.wc .no{font-family:var(--fr);font-weight:900;font-size:16pt;line-height:1}
.wc svg{width:24mm;height:18mm}
.wc .fk{font-size:8pt;color:var(--ink2)}.wc .dl{font-size:9pt}.wc .ln{font-size:9pt;margin-top:.8mm;border-top:.25mm dashed var(--line);padding-top:.8mm}
.map{display:grid;grid-template-columns:1fr 48mm;gap:4mm;align-items:center}.map svg{width:100%;height:auto;max-height:100mm}
.foot span:last-child{white-space:nowrap}
.catch{text-align:center;font-family:var(--fr);font-weight:900;font-size:14pt;display:flex;align-items:center;justify-content:center;gap:3mm}
.catch img{height:9mm}
</style>
</head>
<body>
<div id="root"></div>
<script src="/lib/iso.js"></script>
<script type="module">
// 印刷用のレポート v2（A4・4ページ）。数字はエンジン、言葉はClaude（レポートの役割）と、根拠のある記録だけ。データはプレイ画面から localStorage で受け取る
import * as Y from '/engine/engine.js';
import * as P from '/parts.js';
import { zoningSVG } from '/scenes.js';
import { differsOf } from '/memory.js';
import { protectedReasons } from '/reasons.js';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let D = null; try { D = JSON.parse(localStorage.getItem('yuku-report') || 'null'); } catch { }
const root = document.getElementById('root');
if (!D || !D.player) { root.innerHTML = '<p style="padding:20mm;font-size:14pt">プレイ画面の「印刷用（PDF）」から開いてください。</p>'; throw new Error('no data'); }
const NA = D.names?.a || '夫', NB = D.names?.b || '妻';
const man = n => Math.round(Number(n)).toLocaleString('ja-JP');
const man1 = n => (Math.round(Number(n) * 10) / 10).toLocaleString('ja-JP', { maximumFractionDigits: 1 });
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + man(Math.abs(n));
const R = D.report || { title: '', balance: [], memories: [], tellFirst: [], closing: '' };
const me = Y.outcome(D.player), all = [D.player, ...(D.others || [])].map(w => ({ w, o: Y.outcome(w) }));
// 表示の番号：あなたの世界はいつも07（画面と同じ並べ替え）
const PN = me.no, DN = o => o.no === PN ? 7 : o.no === 7 ? PN : o.no;
const pad = n => String(n).padStart(2, '0');
const monthly = o => Y.payment(o.principal, Y.RATE.variable);
const fam = `${esc(NA)} と ${esc(NB)}`;
const date = new Date(D.date || Date.now()); const ds = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
const head = `<div class="top"><div class="logo">ゆくす<span style="color:#E8701F">い</span>え</div><div class="meta">${fam} の家づくり<br>入居から1年後のレポート</div></div>`;
const NOTICE = '本作の制度・手続き・金額・期間などの設定は、体験のために簡略化しています。実際の家づくりは、地域・金融機関・住宅会社によって異なります。登場する住宅会社・人物・団体はすべて架空です。';
// 注記は2行。単語の途中で折り返さないよう、文の切れ目（「簡略化しています。」のあと）で改行する
const NOTICE2 = NOTICE.replace('簡略化しています。', '簡略化しています。<br>');
const foot = n => `<div class="foot"><span>${NOTICE2}</span><span>${n} / 4</span></div>`;

// ---- 1ページ目 表紙：わが家の水彩は、選んだ案の屋根・外壁の色・外構・1年後の庭木から ----
const w = D.player, f = w.finish || {};
const wall = Y.FINISH.wall.find(x => x.id === f.wall) || Y.FINISH.wall[0], wallCol = (wall.colors[f.color || 0] || wall.colors[0]);
const floor = Y.FINISH.floor.find(x => x.id === f.floor) || Y.FINISH.floor[0];
const ROOF_WC = { gable: '切妻', hip: '寄棟', mane: '片流れ', cube: '陸屋根', flat: '陸屋根' };
const wcq = new URLSearchParams({ roof: ROOF_WC[w.spec.roof] || '陸屋根', form: P.formOf(w) === 'partial' ? '1階が大きい' : '総二階', finish: f.wall === 'galva' ? 'ガルバリウム' : '塗り壁', wall: wallCol[1], time: me.warmth.level >= 3 ? '夕方' : '昼', season: '春', carport: '2', tree: w.spec.exterior === 'full' ? '落葉樹' : 'なし', seed: '7' });
const p1 = `<div class="page cover"><img class="cv-logo" src="/brand/lockup-vertical.svg" alt="ゆくすいえ">
  <div class="cv-k">わが家の、ちょうどいいバランス</div><div class="cv-title">${esc(R.title || 'わが家の1年後')}</div>
  <iframe class="cv-wc" id="wc" src="/watercolor.html?${wcq}" title="わが家の水彩"></iframe>
  <div class="cv-meta">${fam} の家づくり　入居から1年後のレポート</div><div class="cv-date">${ds}に遊んだ記録から</div>
  <div class="foot" style="width:100%;text-align:left"><span>${NOTICE2}</span><span>1 / 4</span></div></div>`;

// ---- 2ページ目 わが家の答え ----
const zone = w.plan ? zoningSVG(w.plan, { stack: true }) : '';
const facts = [['延床', `${w.spec.tsubo}坪`], ['形と屋根', `${P.formLabel(w)}・${Y.ROOF_JA[w.spec.roof] || ''}`], ['外壁', `${wall.label.replace('（標準）', '')}（${wallCol[0]}）`], ['床', floor.label.replace('（標準）', '')], ['外構', w.spec.exterior === 'full' ? '入居の時に、外まわりまで整えた' : '最小限（あとから少しずつ）']];
// 守ろうとしたもの：根拠（自由回答・アンケート・選んだ札）のあるものだけ。作り話の理由は書かない
const sib = i => all.find(x => x.o.bits.length === me.bits.length && x.o.bits.every((b, k) => k === i ? b !== me.bits[k] : b === me.bits[k]))?.o;
const PR = protectedReasons(D.player, D.others, D.memory), protectedOf = i => PR[i];
const decs = me.labels.map((l, i) => { const p = protectedOf(i); return `<div class="dec"><span class="q">${Y.FORKS[i]}　${esc(Y.DECISIONS[i].q)}</span><b>${esc(l)}</b><span class="why">守ろうとしたもの：${esc(p.t)}　<span class="tag">${p.by}</span></span></div>`; }).join('');
// 希望と、1年後の結果（16区画のカードと同じ outcome の値から）
const rows = [];
for (const x of D.wishes || []) {
  if (x.kind === 'totalMax') { const d = me.total - x.value; rows.push({ k: 'total', label: `総額 ${man(x.value)}万円以内`, res: `${man(me.total)}万円`, ok: d <= 0, st: d <= 0 ? '守れた' : `守れなかった（${sgn(d)}万円）`, test: o => o.total <= x.value }); }
  if (x.kind === 'monthlyMax') { const m = monthly(me), d = m - x.value; rows.push({ k: 'monthly', label: `月々 ${x.value}万円以内`, res: `約${man1(m)}万円`, ok: d <= 0, st: d <= 0 ? '守れた' : `守れなかった（+${man1(d)}万円）`, test: o => monthly(o) <= x.value }); }
}
if (D.memory?.limits?.warmPriority) { const top = D.memory.limits.warmPriority === 'top'; const ok = me.warmth.level >= 2; rows.push({ k: 'warm', label: `冬の暖かさ${top ? '（いちばん大事）' : ''}`, res: me.warmth.label, ok, st: ok ? '守れた' : top ? '一部' : 'ふつう', test: o => o.warmth.level >= 2 }); }
const ldkJo = D.memory?.limits?.ldkJo, ldk = w.plan?.rooms?.find(r => /LDK/.test(r.name));
if (ldkJo && ldk) { const ok = ldk.size >= ldkJo - 2; rows.push({ k: 'ldk', label: `LDK ${ldkJo}帖くらい`, res: `${ldk.size}帖`, ok, st: ok ? '守れた' : '少し小さい', test: null }); }
// 守れなかった希望を守れた道：いちばん近い4つの世界のうち、その希望を守れた世界（エンジンが選ぶ）
const alts = rows.filter(r => !r.ok && r.test).map(r => { const cand = [0, 1, 2, 3].map(i => ({ i, o: sib(i) })).filter(x => x.o && !x.o.unbuilt && r.test(x.o)).sort((a, b) => a.o.total - b.o.total)[0]; return cand ? `「${r.label}」は、${Y.FORKS[cand.i]}で「${cand.o.labels[cand.i]}」を選んでいれば、総額 ${man(cand.o.total)}万円・月々 約${man1(monthly(cand.o))}万円で守れた（${pad(DN(cand.o))}の世界）。` : `「${r.label}」は、分岐点を一つ変えただけでは守れなかった。` });
const p2 = `<div class="page">${head}
  <h2>わが家の答え</h2>
  <div class="p2top">
    <div class="box"><h3>間取りの骨組みと、家の要点</h3><div class="zone">${zone || '<p class="sub">間取りの記録はありません</p>'}</div><dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
    <div style="display:flex;flex-direction:column;gap:4mm">
      <div class="box"><h3>4つの分岐点で選んだこと</h3>${decs}</div>
      <div class="box"><h3>お金（1年後）</h3><div class="money"><div><span>土地と建物の総額</span><b>${man(me.total)}</b>万円</div><div><span>借入</span><b>${man(me.principal)}</b>万円</div><div><span>月々の返済（変動）</span><b>約${man1(monthly(me))}</b>万円</div></div></div>
    </div>
  </div>
  <div class="box"><h3>希望と、1年後の結果</h3>
    <table class="wtab"><tr><th>希望</th><th>1年後</th><th></th></tr>${rows.map(r => `<tr><td>${esc(r.label)}</td><td class="n">${esc(r.res)}</td><td class="st">${esc(r.st)}</td></tr>`).join('') || '<tr><td colspan="3">希望の上限は、記録されていません</td></tr>'}</table>
    ${alts.map(t => `<p class="alt">${esc(t)}</p>`).join('')}
  </div>
  ${foot(2)}</div>`;

// ---- 3ページ目 担当者に渡す1枚 ----
const items = (D.memory?.items || []);
const whoOf = t => { const n = String(t); let best = null, sc = 0; for (const it of items) { const a = it.text.replace(/[、。・\s]/g, ''); let k = 0; for (let i = 0; i < a.length - 1; i++) if (n.includes(a.slice(i, i + 2))) k++; if (k > sc) { sc = k; best = it; } } return sc >= 2 ? best.who : 'both'; };
const WHOC = { p1: 'sq', p2: 'ci', both: 'bo' };
const GENERIC = /^(いちばん大切にしたいこと|予算の上限と、その理由|後から変えにくいところ)/;
const tell = [...new Set((R.tellFirst || []).map(t => String(t).trim()).filter(t => t && !GENERIC.test(t)))].slice(0, 7);
const memTell = items.filter(x => !/^(総額|月々)/.test(x.text)).sort((a, b) => (b.priority === 'must') - (a.priority === 'must') || (b.who === 'both') - (a.who === 'both') || (b.sources.length - a.sources.length)).slice(0, 7).map(x => x.text);
const tellList = tell.length >= 4 ? tell : [...tell, ...memTell.filter(t => !tell.includes(t))].slice(0, 7);
const SV = D.survey;
const splits = SV && D.memory ? differsOf(SV, D.memory).filter(q => !q.multi).slice(0, 3).map(q => { const lab = ids => [].concat(ids || []).map(id => q.choices.find(c => c.id === id)?.label).filter(Boolean).join('・') || 'こだわらない'; const s0 = D.memory.survey[q.id]; const short = q.text.replace(/[？?].*$/, '').replace(/（.*?）/g, ''); const res = q.id === 'roof' ? `${Y.ROOF_JA[w.spec.roof]}にした` : 'これから相談'; return `<li><b>${esc(short)}</b>：<span class="sq">${esc(lab(s0.p1))}</span>　<span class="ci">${esc(lab(s0.p2))}</span> → ${esc(res)}</li>`; }) : [];
const ASK = ['地盤の調査は、契約の前ですか、後ですか。改良が要るときの費用の目安は', '見積の「別途」の項目を、全部教えてください', '標準の仕様と、オプションの境目はどこですか', '契約のあと、担当の方は替わりますか', '引渡しの時期の目安と、遅れたときの扱いは'];
const mine = new Set(me.events), other = [...new Set(all.filter(x => x.o.no !== me.no).flatMap(x => x.o.events))].filter(e => !mine.has(e));
const care = [...me.events.slice(0, 3).map(e => `<li><span class="tag">この世界で起きた</span>${esc(e)}</li>`), ...other.slice(0, 3).map(e => `<li><span class="tag">別の世界で起きた</span>${esc(e)}</li>`)].join('');
const p3 = `<div class="page">${head}
  <div class="cut"><svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="#1E2B36" stroke-width="1.2"><circle cx="3" cy="2.6" r="2"/><circle cx="3" cy="7.4" r="2"/><path d="M4.6 3.6 15 8.6M4.6 6.4 15 1.4"/></svg>切り取って、担当者に渡せます</div>
  <h2>${fam} の家づくり　はじめに伝えたいこと</h2>
  <p>ゲーム「ゆくすいえ」で、16の世界の家づくりを体験しました。わたしたちが大切にしたいことを、先にお伝えします。<span class="sq">${esc(NA)}</span>　<span class="ci">${esc(NB)}</span>　<span class="bo">ふたり</span></p>
  <div class="box"><h3>先に伝えておきたいこと</h3><ul>${tellList.map(t => `<li class="${WHOC[whoOf(t)] || 'bo'}">${esc(t)}</li>`).join('')}</ul></div>
  ${splits.length ? `<div class="box"><h3>ふたりの意見が分かれたこと</h3><ul>${splits.join('')}</ul></div>` : ''}
  <div class="g2">
    <div class="box"><h3>打ち合わせで、聞きたいこと</h3><ol class="ask">${ASK.map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>
    <div class="box"><h3>気をつけたいこと</h3><ul>${care || '<li>大きな出来事はなかった</li>'}</ul></div>
  </div>
  <div class="box"><h3>悩んだら、これを優先する</h3><ul class="chk">${(R.balance || []).slice(0, 3).map((b, i) => `<li>${i + 1}．${esc(b)}</li>`).join('')}</ul></div>
  ${foot(3)}</div>`;

// ---- 4ページ目 選ばなかった世界線から ----
const short40 = t => { const s = String(t || '').replace(/(この)?[0-9一１]年、?/g, m => m).replace(/(本当に)?(お疲れ|おつかれ)さま(でした)?。?/g, '').replace(/^[0-9一１]年、?$/, '').trim(); if (s.length < 8) return ''; if (s.length <= 40) return s; const cut = s.slice(0, 40); const k = Math.max(cut.lastIndexOf('。'), cut.lastIndexOf('、')); return (k > 20 ? cut.slice(0, k) : cut.slice(0, 39)) + '。'; };
const line = no => D.staff16?.lines?.find(l => l.no === no)?.line;
const near = [0, 1, 2, 3].map(i => ({ i, o: sib(i) })).filter(x => x.o).map(({ i, o }) => {
  const x = all.find(a => a.o.no === o.no); const th = P.thumb({ w: { ...x.w, no: DN(o) }, stage: o.unbuilt ? 0 : 4, ghost: 0 });
  const dc = o.choiceTotal - me.choiceTotal, de = o.increase - me.increase;
  const st = line(o.no);
  return `<div class="wc"><div><div class="no">${pad(DN(o))}</div>${th}</div><div><b>${Y.COMPANIES[o.company].name}　${esc(Y.worldName(o))}</b><div class="fk">${Y.FORKS[i]}だけ違う：「${esc(o.labels[i])}」</div>
    <div class="dl">${o.unbuilt ? '家は建ちませんでした' : `総額 ${man(o.total)}万円（わが家と ${sgn(Math.round(o.total) - Math.round(me.total))}万円：選択の差 ${sgn(dc)}／出来事の差 ${sgn(de)}）`}</div>
    <div class="dl">${esc(Y.worldLesson(o, me))}</div>${st && short40(st) ? `<div class="ln">${P.coTag(o.company, 12)} ${esc(short40(st))}</div>` : ''}</div></div>`;
}).join('');
P.setYou(7);
const WS = all.map(x => x.o).sort((a, b) => DN(a) - DN(b));
const WM = { 'とても暖かい': '◎', '暖かい': '○', 'ふつう': '△', 'やや寒い': '▽' };
const list = WS.map(o => { const x = all.find(a => a.o.no === o.no); return { w: { ...x.w, no: DN(o) }, stage: o.unbuilt ? 0 : 4, ghost: 0, note: o.unbuilt ? '建たず' : `${man(o.total)}${WM[o.warmth.label] || ''}` }; });
const map = P.estate2(list, { notes: true, noteFs: 22, anim: false });
const p4 = `<div class="page">${head}
  <h2>選ばなかった世界線から</h2>
  <p>同じ家族、同じ土地で、分岐点を一つだけ違えた4つの世界です。どちらがよいかは決めません。</p>
  <div class="near">${near}</div>
  <div class="box"><h3>16の区画の1年後</h3><div class="map">${map}<div><p class="sub">区画の数字：総額（万円）。冬の朝は ◎とても暖かい ○暖かい △ふつう ▽やや寒い。橙の区画が、わが家（07）です。</p><p style="margin-top:2mm">${esc(R.closing || '')}</p></div></div></div>
  <div class="catch"><img src="/brand/mark.svg" alt="" onerror="this.remove()">16回目の、マイホームへ。</div>
  ${foot(4)}</div>`;

root.innerHTML = p1 + p2 + p3 + p4;
// 中身が紙の高さを超えるページは、注記（下の帯）以外を少しずつ縮めて、1枚に収める（記録によって文の長さが違うため。最小0.8倍）
const fitPages = () => document.querySelectorAll('.page').forEach(pg => {
  const kids = [...pg.children].filter(el => !el.classList.contains('foot'));
  kids.forEach(el => { el.style.zoom = ''; });
  for (let z = 1; pg.scrollHeight > pg.clientHeight + 1 && z > 0.8;) { z = +(z - 0.02).toFixed(2); kids.forEach(el => { el.style.zoom = z; }); }
});
fitPages();
const fitted = (document.fonts ? document.fonts.ready : Promise.resolve()).then(fitPages);
const wc = document.getElementById('wc');
wc.addEventListener('load', () => { const t0 = Date.now(); const iv = setInterval(() => { try { if (wc.contentWindow.READY || Date.now() - t0 > 8000) { clearInterval(iv); fitted.then(() => { window.READY = true; }); } } catch { clearInterval(iv); fitted.then(() => { window.READY = true; }); } }, 200); });
</script>
</body>
