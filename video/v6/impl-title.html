<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>実装について</title>
<!-- 章の扉【人間の指示 11/6】：大きく「実装について」、小さく「毛布のなかからこんにちは（ハイフンなし・レビュー7）」。決定論的：render(t) -->
<style>body{margin:0;width:1920px;height:1080px;background:#FFFAF0;color:#1E2B36;font-family:"Hiragino Sans","BIZ UDPGothic",sans-serif;overflow:hidden}
body{background-image:linear-gradient(rgba(28,141,204,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(28,141,204,.06) 1px,transparent 1px);background-size:32px 32px}
#w{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
h1{margin:0;font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;font-size:132px;font-weight:900;letter-spacing:.06em}
p{margin:34px 0 0;font-size:44px;font-weight:700;color:#3F4A52;letter-spacing:.06em}</style></head><body>
<div id="w"><h1 id="a">実装について</h1><p id="b">毛布のなかからこんにちは</p></div>
<script>const cl=v=>Math.max(0,Math.min(1,v)),eo=v=>1-Math.pow(1-cl(v),3);window.DUR=3;
const f=(el,a)=>{el.style.opacity=a;el.style.transform=`translateY(${(1-a)*14}px)`};
window.render=t=>{f(document.getElementById('a'),eo((t-.1)/.5));f(document.getElementById('b'),eo((t-.6)/.5))};
render(+(new URLSearchParams(location.search).get('t')||2));window.READY=true;</script></body></html>
