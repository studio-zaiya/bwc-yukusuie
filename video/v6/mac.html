     添付ファイル名が写る右側の領域は切り落とした。決定論的：render(t) -->

<script>const cl=v=>Math.max(0,Math.min(1,v)),eo=v=>1-Math.pow(1-cl(v),3);window.DUR=6;
const I=[0,1,2,3].map(i=>document.getElementById('i'+i));
window.render=t=>{I.forEach((im,i)=>{const a=eo((t-.1-i*.25)/.5);im.style.opacity=a;im.style.transform=`translateY(${(1-a)*24}px)`;im.style.objectPosition=`left ${(cl(t/6)*(i?8:14)).toFixed(1)}%`})};
Promise.all(I.map(i=>i.decode().catch(()=>{}))).then(()=>{render(+(new URLSearchParams(location.search).get('t')||5));window.READY=true});</script></body></html>
