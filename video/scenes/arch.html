<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゆくすいえ しくみ 案C 分解図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
html,body{margin:0;height:100%;background:#EEF3F6;color:#1E2B36;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans CJK JP",sans-serif}
#wrap{position:fixed;inset:0 0 56px 0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;box-shadow:0 10px 40px rgba(30,43,54,.14)}
canvas{display:block;width:1920px;height:1080px}
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-top:1px solid #E1DACB;font-size:14px}
#bar button{font:inherit;font-weight:700;border:1px solid #E1DACB;background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer}
#bar input{flex:1}
#time{font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div></div>
<div id="bar"><button id="play" type="button">一時停止</button><input id="seek" type="range" min="0" step="0.01" value="0" aria-label="再生位置"><span id="time">0.0 秒</span></div>
<script>
const W=1920,H=1080,DUR=12.5;window.DUR=DUR;
const cv=document.getElementById('c'),X=cv.getContext('2d');
const F='"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans CJK JP",sans-serif';
const FD='"Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans","BIZ UDPGothic",sans-serif';
const K={ink:'#1E2B36',ink2:'#6B6358',kazu:'#E8701F',yuu:'#1C8DCC',gold:'#F2C230',goldT:'#8C6A00',ground:'#F3E7CF',side1:'#E7DCC8',side2:'#D6C8AE'};
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,u)=>a+(b-a)*u;
const eo=x=>1-Math.pow(1-cl(x),3),eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const fr=x=>x-Math.floor(x);

// ---------- 投影 ----------
// 層の番号：0＝いちばん上（16の敷地）… 4＝いちばん下（ふたりの一言）
const S=34,COS=Math.cos(Math.PI/6),OX=760,OY=600,NL=4;
let gk=1,ge=1,gy=0;
function zOf(i){return lerp((NL-1-i)*0.3,(NL-1-i)*4.0,ge)}
function iso(u,v,z){const x=10*u,y=10*v;return [OX+(x-y)*COS*S, OY+gy+(x+y)*0.5*S-z*S]}
function front(u,v){return [360+1200*u,202+675*v]}
function M(i,u,v,h){h=h||0;if(i===0&&gk<1){const f=front(u,v),p=iso(u,v,zOf(0)+h*gk);return [lerp(f[0],p[0],gk),lerp(f[1],p[1],gk)]}return iso(u,v,zOf(i)+h)}
function path(pts,close){X.beginPath();pts.forEach((p,k)=>k?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));if(close)X.closePath()}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function txt(s,x,y,size,o){o=o||{};X.save();X.globalAlpha*=(o.a==null?1:o.a);X.fillStyle=o.c||K.ink;X.font=`${o.w||700} ${size}px ${o.f||F}`;X.textAlign=o.al||'left';X.textBaseline='alphabetic';X.fillText(s,x,y);const w=X.measureText(s).width;X.restore();return w}
function chip(s,x,y,kind,a){X.save();X.globalAlpha*=a;X.font=`700 20px ${F}`;const w=X.measureText(s).width+28,h=34;rr(x,y-h+8,w,h,17);
 if(kind==='claude'){X.fillStyle=K.ink;X.fill();X.fillStyle='#fff'}else{X.lineWidth=2;X.strokeStyle=K.ink;X.setLineDash([5,4]);X.stroke();X.setLineDash([]);X.fillStyle=K.ink}
 X.textBaseline='middle';X.fillText(s,x+14,y-h/2+9);X.restore();return w}
function diamond(p,r,fill){X.beginPath();X.moveTo(p[0],p[1]-r);X.lineTo(p[0]+r,p[1]);X.lineTo(p[0],p[1]+r);X.lineTo(p[0]-r,p[1]);X.closePath();X.fillStyle=fill||K.gold;X.fill();X.strokeStyle=K.ink;X.lineWidth=2;X.stroke()}
let LATE=[];

// ---------- 板 ----------
const TOPS=['#FFFFFF','#F6F2EA','#F3F9FD',K.ground];
function plate(i,a){
 const z=zOf(i),th=0.22;X.save();X.globalAlpha=a*(i>0&&i<3?lerp(1,.7,ge):1);
 const c=[[0,0],[1,0],[1,1],[0,1]].map(q=>M(i,q[0],q[1]));
 if(!(i===0&&gk<1)){
  const b=[[1,0],[1,1],[0,1]].map(q=>iso(q[0],q[1],z-th));
  path([c[1],c[2],b[1],b[0]],true);X.fillStyle=K.side2;X.fill();
  path([c[2],c[3],b[2],b[1]],true);X.fillStyle=K.side1;X.fill();
  X.strokeStyle=K.ink;X.lineWidth=1.6;path([c[1],b[0],b[1],b[2],c[3]]);X.stroke();X.beginPath();X.moveTo(c[2][0],c[2][1]);X.lineTo(b[1][0],b[1][1]);X.stroke();
 }else{X.shadowColor='rgba(30,43,54,.18)';X.shadowBlur=30;X.shadowOffsetY=12}
 path(c,true);X.fillStyle=TOPS[i];X.fill();X.shadowColor='transparent';X.lineWidth=2.2;X.strokeStyle=K.ink;X.stroke();X.restore();
}

// ---------- 中身の座標 ----------
const LOT=[];for(let r=0;r<4;r++)for(let q=0;q<4;q++)LOT.push({u:.46+q*.11,v:.10+r*.17,w:.09});
const DETAIL=[5,6,9,10];
const ROOF=['#E8701F','#1C8DCC','#7FB069','#C9785C','#E8701F','#1C8DCC','#B9A07A','#5C8DB0','#E0A458','#6E9F8F','#D4876B','#4F7CAC','#A98F6A','#E8701F','#7AA0C4','#C98F4E'];
const LOT17=LOT[6];                       // 07（あなたの世界）
// 世界樹：手前（v大）の帯に横向きに描く
const TRX=[.05,.13,.21,.29,.38];
const TR=(()=>{const n=[[{u:TRX[0],v:.47}]];for(let L=1;L<=4;L++){const m=1<<L,a=[];for(let k=0;k<m;k++)a.push({u:TRX[L],v:.08+.78*((k+.5)/m)});n.push(a)}return n})();
const N17=TR[4][6];                       // 07の葉（16のまま。17本目は作らない）
const FROM17=TR[3][3];                    // 分かれ道3の節

// 家（箱＋屋根）を描く。grow:0..1 で 基礎→壁→屋根
function house(i,u,v,w,hh,roof,a,grow){
 const g=grow==null?1:grow;if(g<=0)return;const hu=u+w*.25,hv=v+w*.25,hw=w*.5;
 const sq=[[hu,hv],[hu+hw,hv],[hu+hw,hv+hw],[hu,hv+hw]],H=hh*cl(g/.75);
 const base=sq.map(p=>M(i,p[0],p[1],0)),top=sq.map(p=>M(i,p[0],p[1],H));
 X.save();X.globalAlpha=a;
 path([base[1],base[2],top[2],top[1]],true);X.fillStyle='#E9E4DA';X.fill();
 path([base[2],base[3],top[3],top[2]],true);X.fillStyle='#F7F4EE';X.fill();
 path(top,true);X.fillStyle=g>.75?roof:'#FFFFFF';X.fill();
 X.lineWidth=1.2;X.strokeStyle=K.ink;path([base[1],base[2],base[3],top[3],top[0],top[1]],true);X.stroke();X.beginPath();X.moveTo(base[2][0],base[2][1]);X.lineTo(top[2][0],top[2][1]);X.stroke();X.restore();
}

// ---------- 最上段：世界樹（左）と16の敷地（右） ----------
function drawTop(t,a){
 const i=0;X.save();X.globalAlpha=a;X.lineCap='round';
 // 敷地の地面
 path([M(i,.43,.06),M(i,.98,.06),M(i,.98,.95),M(i,.43,.95)],true);X.fillStyle=K.ground;X.fill();
 // 葉から敷地へ、細い道
 TR[4].forEach((n,k)=>{const L=LOT[k],A=M(i,n.u,n.v),B=M(i,L.u,L.v+L.w/2);X.strokeStyle='rgba(30,43,54,.16)';X.lineWidth=1.2;X.setLineDash([3,5]);X.beginPath();X.moveTo(A[0],A[1]);X.lineTo(B[0],B[1]);X.stroke();X.setLineDash([])});
 // 世界樹
 for(let L=1;L<=4;L++)TR[L].forEach((n,k)=>{const p=TR[L-1][k>>1],A=M(i,p.u,p.v),B=M(i,n.u,n.v);X.strokeStyle=k%2?K.yuu:K.kazu;X.lineWidth=6-L*.9;X.beginPath();X.moveTo(A[0],A[1]);X.lineTo(B[0],B[1]);X.stroke()});
 {const R=M(i,TR[0][0].u,TR[0][0].v);X.fillStyle=K.ink;X.beginPath();X.arc(R[0],R[1],7,0,7);X.fill()}
 TR[4].forEach((n,k)=>{const P=M(i,n.u,n.v);X.fillStyle=k%2?K.yuu:K.kazu;X.beginPath();if(k%2)X.arc(P[0],P[1],5,0,7);else X.rect(P[0]-4.5,P[1]-4.5,9,9);X.fill()});
 // 16の敷地と家
 LOT.forEach((L,k)=>{const det=DETAIL.includes(k);path([M(i,L.u,L.v),M(i,L.u+L.w,L.v),M(i,L.u+L.w,L.v+L.w),M(i,L.u,L.v+L.w)],true);X.fillStyle=det?'#CFE9B8':'#E6EEDA';X.fill();house(i,L.u,L.v,L.w,det?.9:.6,ROOF[k],det?1:.6)});
 // 正面のときだけ：アプリの見出し
 if(gk<1){const ha=1-cl(gk*2.5);txt('ゆくすいえ',380,240,30,{f:FD,w:900,a:ha});txt('16 unbuilt futures',560,240,22,{w:400,c:K.ink2,a:ha})}
 // 17本目の枝（金の破線）
 const g=eo((t-6.9)/.7);
 if(g>0){const A=M(i,FROM17.u,FROM17.v),B=M(i,N17.u,N17.v);X.setLineDash([11,7]);X.strokeStyle=K.gold;X.lineWidth=6;X.beginPath();X.moveTo(A[0],A[1]);X.lineTo(lerp(A[0],B[0],g),lerp(A[1],B[1],g));X.stroke();X.setLineDash([]);
  if(g>=1)diamond(B,9);
  if(t>7.4)LATE.push(()=>{const P=M(i,N17.u,N17.v);txt('ふたりで出した答え',P[0]-18,P[1]-14,22,{al:'right',c:K.goldT,a:eo((t-7.4)/.4)})})}
 // 17番目の敷地
 const s17=eo((t-7.7)/.5);
 if(s17>0){const L=LOT17;const A=M(i,N17.u,N17.v),B=M(i,L.u,L.v+L.w/2);X.save();X.globalAlpha=a*s17;X.setLineDash([7,5]);X.lineWidth=3;X.strokeStyle=K.goldT;X.beginPath();X.moveTo(A[0],A[1]);X.lineTo(B[0],B[1]);X.stroke();
  path([M(i,L.u,L.v),M(i,L.u+L.w,L.v),M(i,L.u+L.w,L.v+L.w),M(i,L.u,L.v+L.w)],true);X.fillStyle='rgba(242,194,48,.32)';X.fill();X.stroke();X.restore();
  house(i,L.u,L.v,L.w,.9,K.gold,a,.76+.24*cl((t-8.4)/1.1));}
 X.restore();
}
// ---------- 層1：計算エンジン ----------
const BLK=[{u:.28,label:'台帳'},{u:.50,label:'時計'},{u:.72,label:'判定'}];
function drawEngine(t,a){
 const i=1;X.save();X.globalAlpha=a;
 BLK.forEach((b,m)=>{const u0=b.u,v0=.78,w=.12,h=.75;
  const g=[[u0,v0],[u0+w,v0],[u0+w,v0+w],[u0,v0+w]],base=g.map(p=>M(i,p[0],p[1],0)),top=g.map(p=>M(i,p[0],p[1],h));
  path([base[1],base[2],top[2],top[1]],true);X.fillStyle='#D9D2C4';X.fill();
  path([base[2],base[3],top[3],top[2]],true);X.fillStyle='#ECE6DA';X.fill();
  path(top,true);X.fillStyle='#fff';X.fill();X.strokeStyle=K.ink;X.lineWidth=1.8;path([base[1],base[2],base[3],top[3],top[0],top[1]],true);X.stroke();X.beginPath();X.moveTo(base[2][0],base[2][1]);X.lineTo(top[2][0],top[2][1]);X.stroke();
  X.lineWidth=2;
  if(m===0)for(let r=0;r<3;r++){const A=M(i,u0+.025,v0+.035+r*.03,h),B=M(i,u0+.025+.08*(.5+.5*Math.sin(t*2+r)),v0+.035+r*.03,h);X.beginPath();X.moveTo(A[0],A[1]);X.lineTo(B[0],B[1]);X.stroke()}
  if(m===1){const C=M(i,u0+w/2,v0+w/2,h);X.beginPath();X.ellipse(C[0],C[1],24,14,0,0,7);X.stroke();X.beginPath();X.moveTo(C[0],C[1]);X.lineTo(C[0]+Math.cos(t*3)*19,C[1]+Math.sin(t*3)*11);X.stroke()}
  if(m===2)for(let q=1;q<3;q++){let A=M(i,u0+q*w/3,v0+.02,h),B=M(i,u0+q*w/3,v0+w-.02,h);X.beginPath();X.moveTo(A[0],A[1]);X.lineTo(B[0],B[1]);X.stroke();A=M(i,u0+.02,v0+q*w/3,h);B=M(i,u0+w-.02,v0+q*w/3,h);X.beginPath();X.moveTo(A[0],A[1]);X.lineTo(B[0],B[1]);X.stroke()}
 });
 LATE.push(()=>BLK.forEach(b=>{const L=M(i,b.u+.06,.84,.75);X.font=`700 22px ${F}`;const tw=X.measureText(b.label).width;rr(L[0]-tw/2-10,L[1]-56,tw+20,34,8);X.fillStyle='rgba(255,255,255,.96)';X.fill();X.strokeStyle=K.ink;X.lineWidth=1.5;X.stroke();txt(b.label,L[0],L[1]-32,22,{al:'center'})}));
 // 計算の結果：この層でだけ出る
 const r=eo((t-6.1)/.4)*(1-eo((t-9.6)/.6));
 if(r>0)LATE.push(()=>{const P=M(i,.97,.86,.2);X.save();X.globalAlpha=r;X.font=`900 30px ${F}`;const s1='＋58万円',s2='＋7日（再審査）';const w=Math.max(X.measureText(s1).width,X.measureText(s2).width)+36;
  rr(P[0]+18,P[1]-62,w,96,14);X.fillStyle='#fff';X.fill();X.lineWidth=3;X.strokeStyle=K.ink;X.stroke();X.restore();
  txt('＋58万円',P[0]+36,P[1]-22,30,{w:900,a:r});txt('＋7日（再審査）',P[0]+36,P[1]+18,26,{w:700,a:r})});
 X.restore();
}
// ---------- 層3：Claude ----------
const CN={read:{u:.12,v:.80,l:'読み替える'},gen:{u:.47,v:.88,l:'2択を書く'},rev:{u:.90,v:.72,l:'確かめる'}};
function drawClaude(t,a){
 const i=2;X.save();X.globalAlpha=a;
 const G=M(i,CN.gen.u,CN.gen.v),R=M(i,CN.rev.u,CN.rev.v),Rd=M(i,CN.read.u,CN.read.v);
 X.lineWidth=3;X.strokeStyle=K.ink;
 for(const d of [-1,1]){const cx=(G[0]+R[0])/2+d*20,cy=(G[1]+R[1])/2+d*28;X.beginPath();X.moveTo(G[0],G[1]);X.quadraticCurveTo(cx,cy,R[0],R[1]);X.stroke()}
 for(const d of [0,1]){const u=fr(t*.9+d*.5),p0=d?R:G,p1=d?G:R,cx=(G[0]+R[0])/2+(d?20:-20),cy=(G[1]+R[1])/2+(d?28:-28);
  const x=(1-u)*(1-u)*p0[0]+2*(1-u)*u*cx+u*u*p1[0],y=(1-u)*(1-u)*p0[1]+2*(1-u)*u*cy+u*u*p1[1];X.fillStyle=K.ink;X.beginPath();X.arc(x,y,6,0,7);X.fill()}
 X.setLineDash([6,5]);X.lineWidth=2;X.beginPath();X.moveTo(Rd[0],Rd[1]);X.lineTo(G[0],G[1]);X.stroke();X.setLineDash([]);
 [[Rd,CN.read],[G,CN.gen],[R,CN.rev]].forEach(([P,n])=>{X.fillStyle='#fff';X.strokeStyle=n===CN.read?K.goldT:K.ink;X.lineWidth=4;X.beginPath();X.arc(P[0],P[1],24,0,7);X.fill();X.stroke();
  LATE.push(()=>txt(n.l,P[0]+34,P[1]+8,22,{}))});
 X.restore();
}
// ---------- 層4：ふたりの一言（地面） ----------
function person(P,col,shape,a){X.save();X.globalAlpha=a;X.fillStyle=col;X.beginPath();X.arc(P[0],P[1]-46,11,0,7);X.fill();X.beginPath();X.moveTo(P[0]-13,P[1]);X.lineTo(P[0]-9,P[1]-32);X.lineTo(P[0]+9,P[1]-32);X.lineTo(P[0]+13,P[1]);X.closePath();X.fill();
 X.fillStyle='#fff';if(shape==='sq')X.fillRect(P[0]-4,P[1]-22,8,8);else{X.beginPath();X.arc(P[0],P[1]-18,4.5,0,7);X.fill()}X.restore()}
const PEOPLE=[{u:.07,v:.93,c:K.kazu,s:'sq'},{u:.15,v:.95,c:K.yuu,s:'ci'}];
function drawGround(t,a){
 const i=3;X.save();X.globalAlpha=a;
 for(let k=0;k<26;k++){const u=fr(k*.618+.13),v=fr(k*.371+.41),P=M(i,u,v);X.fillStyle='rgba(155,210,122,.55)';X.beginPath();X.ellipse(P[0],P[1],12,5,0,0,7);X.fill()}
 X.restore();
 const pa=eo((t-3.7)/.4);if(pa>0)LATE.push(()=>PEOPLE.forEach(q=>person(M(i,q.u,q.v),q.c,q.s,pa)));
 const ba=eo((t-4.2)/.5);
 if(ba>0)LATE.push(()=>{const T=M(i,.11,.94),x=96,y=852;X.save();X.globalAlpha=ba;rr(x,y,330,92,20);X.fillStyle='#fff';X.fill();X.lineWidth=3;X.strokeStyle=K.goldT;X.stroke();
  X.beginPath();X.moveTo(x+250,y);X.lineTo(T[0]-10,T[1]+6);X.lineTo(x+290,y);X.closePath();X.fillStyle='#fff';X.fill();X.stroke();X.fillStyle='#fff';X.fillRect(x+252,y-1,36,5);X.restore();
  txt('ふたりの一言',x+20,y+32,20,{c:K.goldT,a:ba});txt('「窓だけトリプルにしたい」',x+20,y+70,24,{a:ba})});
}
// ---------- 記録の背骨（左に1本） ----------
function spineX(){return 220}
function layerY(i){return iso(0,1,zOf(i))[1]}
const NOTCH=[[3,4.6,'ふたりの一言'],[2,5.4,'読み替え・2択'],[1,6.3,'＋58万円／＋7日'],[0,9.4,'07の枝と家']];
function drawSpine(t){
 const a=eo((t-3.4)/.6);if(a<=0)return;const x=spineX(),y0=layerY(3)+40,y1=layerY(0)-60;
 X.save();X.globalAlpha=a;X.fillStyle='#fff';X.strokeStyle=K.ink;X.lineWidth=2;rr(x-9,y1,18,y0-y1,9);X.fill();X.stroke();
 for(let i=0;i<NL;i++){const y=layerY(i),L=iso(0,1,zOf(i));X.setLineDash([4,4]);X.lineWidth=1.4;X.beginPath();X.moveTo(x+9,y);X.lineTo(L[0],L[1]);X.stroke();X.setLineDash([])}
 X.restore();
 txt('記録',x,y1-46,30,{al:'center',a});chip('コード',x-44,y1-10,'code',a);
 // 15世界が刻む小さな目盛り（絶えず増える）
 X.save();X.globalAlpha=a*.7;const n=Math.floor(cl((t-3.6)*6,0,60));for(let k=0;k<n;k++){const y=lerp(y0-10,y1+10,fr(k*.6180339));X.fillStyle='#9AA6AF';X.fillRect(x-6,y-1,12,2)}X.restore();
 NOTCH.forEach(([i,t0,s])=>{const g=eo((t-t0)/.4);if(g<=0)return;const y=layerY(i);X.save();X.globalAlpha=g;X.fillStyle=K.gold;X.strokeStyle=K.ink;X.lineWidth=2;X.beginPath();X.moveTo(x,y-10);X.lineTo(x+10,y);X.lineTo(x,y+10);X.lineTo(x-10,y);X.closePath();X.fill();X.stroke();X.restore();
  txt(s,x-22,y+8,20,{al:'right',c:K.goldT,a:g})});
}
// ---------- 縦の線と、15世界の点 ----------
function threads(t,a){
 if(a<=0)return;X.save();X.globalAlpha=a;
 LOT.forEach((L,k)=>{const cu=L.u+L.w/2,cv=L.v+L.w/2,top=M(0,cu,cv),bot=M(3,cu,cv),det=DETAIL.includes(k);
