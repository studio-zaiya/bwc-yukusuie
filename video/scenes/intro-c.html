<script>
(function(){
const W=1920,H=1080,DUR=44;
window.DUR=DUR;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Zen Kaku Gothic New","Noto Sans CJK JP",sans-serif';
const C={paper:'#fbf7ee',ink:'#2a2620',mute:'#8a8070',or:'#ef7a3b',te:'#16a093',pk:'#e4589a',bl:'#3d7be0',vi:'#7a62d9',sun:'#f2b632'};
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function circlePts(cx,cy,r,a0,n){const p=[];for(let i=0;i<=n;i++){const a=a0+i/n*Math.PI*2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p}
function house(x0,base,w,h,roof){return [[x0,base],[x0,base-h],[x0+w/2,base-h-roof],[x0+w,base-h],[x0+w,base]]}
function cum(pts){const L=[0];for(let i=1;i<pts.length;i++){L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}return L}
function strokePart(pts,p,color,alpha,lw){ // draw polyline up to fraction p; returns tip
  if(p<=0||pts.length<2)return null;
  const L=cum(pts),tot=L[L.length-1],target=tot*clamp(p);
  ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=lw||6;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  let tip=pts[0];
  for(let i=1;i<pts.length;i++){
    if(L[i]<=target){ctx.lineTo(pts[i][0],pts[i][1]);tip=pts[i]}
    else{const k=(target-L[i-1])/(L[i]-L[i-1]||1);tip=[lerp(pts[i-1][0],pts[i][0],k),lerp(pts[i-1][1],pts[i][1],k)];ctx.lineTo(tip[0],tip[1]);break}
  }
  ctx.stroke();ctx.restore();return tip;
}
function penTip(tip,color){if(!tip)return;ctx.save();const g=ctx.createRadialGradient(tip[0],tip[1],0,tip[0],tip[1],26);g.addColorStop(0,color);g.addColorStop(.35,color+'99');g.addColorStop(1,color+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(tip[0],tip[1],26,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tip[0],tip[1],4,0,7);ctx.fill();ctx.restore()}
function txt(t,t0,s,x,y,size,o){o=o||{};const a=eo((t-t0)/.45);if(a<=0)return;ctx.save();ctx.globalAlpha=a*(o.alpha==null?1:o.alpha);ctx.fillStyle=o.color||C.ink;ctx.font=`${o.weight||500} ${size}px ${FONT}`;ctx.textAlign=o.align||'left';ctx.textBaseline='alphabetic';ctx.fillText(s,x,y+(1-a)*14);ctx.restore()}
function tag(t,t0,kind,x,y,alpha){const a=eo((t-t0)/.45);if(a<=0)return;const label=kind==='stat'?'統計':'現場の実感';ctx.save();ctx.globalAlpha=a*(alpha==null?1:alpha);ctx.font=`700 22px ${FONT}`;const w=ctx.measureText(label).width+28,h=36;
  const r=18;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();

const grain=document.createElement('canvas');grain.width=W;grain.height=H;(function(){const g=grain.getContext('2d');g.fillStyle=C.paper;g.fillRect(0,0,W,H);const r=rng(7);for(let i=0;i<9000;i++){g.fillStyle=r()<.5?'rgba(120,95,60,0.05)':'rgba(255,255,255,0.35)';g.fillRect(r()*W,r()*H,1.4,1.4)}g.fillStyle='rgba(120,95,60,0.07)';for(let x=40;x<W;x+=40)for(let y=40;y<H;y+=40)g.fillRect(x,y,2,2)})();

  honshu:[[140.3,41.25],[140.85,41.15],[141.45,41.45],[141.4,40.6],[141.95,39.65],[141.6,38.95],[141.5,38.3],[141.0,38.2],[141.0,37.1],[140.65,36.4],[140.85,35.75],[140.4,35.15],[139.85,34.9],[139.95,35.4],[139.65,35.3],[139.15,35.25],[138.85,34.6],[138.7,35.05],[138.25,34.6],[137.3,34.65],[136.9,34.75],[136.85,34.3],[136.3,34.05],[135.75,33.45],[135.1,33.85],[135.15,34.3],[135.4,34.65],[134.9,34.65],[134.2,34.65],[133.4,34.45],[132.4,34.25],[131.9,33.95],[130.95,33.95],[131.05,34.4],[131.7,34.75],[132.6,35.45],[133.3,35.55],[134.3,35.6],[135.3,35.6],[136.0,35.7],[136.1,36.1],[136.7,36.7],[136.75,37.25],[137.3,37.5],[137.0,36.9],[137.3,36.75],[138.2,37.15],[139.0,37.95],[139.55,38.6],[139.95,39.5],[139.7,39.95],[140.0,40.3],[139.9,40.65],[140.3,41.25]],

  kyushu:[[130.9,33.95],[131.4,33.6],[131.7,33.25],[131.9,32.95],[131.65,32.4],[131.4,31.45],[131.1,31.3],[130.7,31.0],[130.55,31.55],[130.2,31.25],[130.15,31.8],[130.35,32.4],[130.55,32.75],[130.2,32.85],[129.75,32.7],[129.65,33.15],[129.95,33.5],[130.4,33.62],[130.9,33.95]],
  sado:[[138.25,38.3],[138.5,38.25],[138.55,37.9],[138.25,37.85],[138.25,38.3]],
  tsushima:[[129.3,34.7],[129.45,34.65],[129.4,34.2],[129.2,34.2],[129.3,34.7]],
  awaji:[[134.95,34.6],[135.0,34.55],[134.85,34.2],[134.7,34.25],[134.95,34.6]],
  tanega:[[130.95,30.85],[131.1,30.75],[130.95,30.35],[130.85,30.5],[130.95,30.85]],
  yaku:[[130.5,30.45],[130.65,30.35],[130.5,30.25],[130.4,30.35],[130.5,30.45]],
  goto:[[128.7,32.85],[128.9,32.75],[128.75,32.6],[128.6,32.7],[128.7,32.85]],
  oki:[[133.2,36.3],[133.35,36.25],[133.25,36.15],[133.1,36.2],[133.2,36.3]]};
 const OK=IS(123.6,28.7,300,780);
 const O={okinawa:[[127.65,26.08],[127.9,26.4],[128.25,26.65],[128.33,26.87],[128.1,26.75],[127.8,26.45],[127.65,26.2],[127.65,26.08]],
  amami:[[129.2,28.5],[129.7,28.4],[129.6,28.15],[129.2,28.25],[129.2,28.5]],
  miyako:[[125.2,24.85],[125.45,24.75],[125.3,24.7],[125.15,24.75],[125.2,24.85]],
  ishigaki:[[124.1,24.55],[124.35,24.5],[124.25,24.35],[124.05,24.4],[124.1,24.55]],
  iriomote:[[123.7,24.42],[123.95,24.4],[123.9,24.25],[123.7,24.3],[123.7,24.42]]};
 const polys=Object.values(L).map(a=>a.map(([lo,la])=>P(lo,la))).concat(Object.values(O).map(a=>a.map(([lo,la])=>OK(lo,la))));
 const path=new Path2D();polys.forEach(pl=>{pl.forEach(([x,y],i)=>i?path.lineTo(x,y):path.moveTo(x,y));path.closePath()});
 const box=[OK(123.4,28.9),OK(130.0,23.9)];
 return {path,box};})();
// 色のドット：地図の陸の上に散らす【人間の指示】
const DOTS=(()=>{const r=rng(42),a=[],tc=document.createElement('canvas').getContext('2d');let guard=0;while(a.length<160&&guard++<200000){const x=250+r()*1500,y=320+r()*720;if(!tc.isPointInPath(JP.path,x,y))continue;if(Math.hypot(x-960,y-686)<40)continue;a.push([x,y,r()])}return a})();
// 付箋
const NOTES=[['吹き抜け','#ffe48a'],['大開口','#ffc7d9'],['回遊動線','#bfe7ff'],['アイランド','#c9f0c4'],['造作キッチン','#ffe48a'],['書斎','#ffc7d9'],['ガレージ','#bfe7ff'],['畳コーナー','#c9f0c4'],['広いWIC','#ffe48a']];
const NOTE_DST=[[-100,-150],[60,-140],[-60,-60],[90,-50],[-110,40],[40,20],[-30,110],[110,120],[-120,150]];
// 樹
const LEAF_Y=Array.from({length:16},(_,i)=>330+i*42);
const XS=[260,500,740,980,1220];
function nodeY(level,idx){const span=16>>level;let s=0;for(let i=0;i<span;i++)s+=LEAF_Y[idx*span+i];return s/span}
const HOUSE_COL=['#f6b26b','#8fd3c7','#f49ac1','#9cc4f5','#ffd966','#b6d7a8','#d5a6e8','#f9cb9c','#a2c4c9'];
// ---------- render ----------
function render(t){

  const cx=camX(t);ctx.save();ctx.translate(-cx,0);
  // ---- S1
  {const o=0,a=sceneAlpha(0,t);ctx.save();ctx.translate(o,0);
    const tip=strokePart(S[0].pts,eio((t-S[0].t0)/S[0].d),S[0].col,a);

  {const o=3*W,a=sceneAlpha(3,t);ctx.save();ctx.translate(o,0);
    const tip=strokePart(S[3].pts,eio((t-S[3].t0)/S[3].d),S[3].col,a);
    // 窓とプラス
    {const k=eo((t-14.4)/.5);if(k>0){ctx.save();ctx.globalAlpha=a*k;ctx.fillStyle=C.te;for(let r=0;r<5;r++)for(let c=0;c<3;c++)ctx.fillRect(292+c*66,420+r*62,34,30);ctx.lineWidth=6;ctx.strokeStyle=C.or;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(740,600);ctx.lineTo(740,680);ctx.moveTo(700,640);ctx.lineTo(780,640);ctx.stroke();ctx.restore()}}

  // ---- S5
  {const o=4*W,a=sceneAlpha(4,t);ctx.save();ctx.translate(o,0);
    const s=1+.4*eio((t-19.0)/2.0);const pts=s5pts(s);
    const tip=strokePart(pts,eio((t-S[4].t0)/S[4].d),S[4].col,a);
    // 画面の中の行
