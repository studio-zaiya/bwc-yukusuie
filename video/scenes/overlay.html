<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>いつも出す重ね（章・字幕・一本の線）</title>
<!-- プレファイナル4（構成 v6）の全編のレイヤー。claude.ai の見本 video/v6/overlay.html（1280）と video/scenes/thread.html を、1920×1080 で書き直した【動画担当】。
     時刻表は window.TL（render_overlay.cjs が edl.json と字幕から渡す）：{DUR, SUBS:[[開始,終了,文]], CH:[[開始,終了,番号]], CHN:[名前], HOUSE, DARK, NOLINE:[[開始,終了]]}
     透明の背景。決定論的：window.render(t)、READY -->
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
const TL=window.TL||{DUR:12,SUBS:[[0.5,4,'見本の字幕です。'],[4,8,'二つ目の字幕。']],CH:[[0,8,0]],CHN:['なぜつくったか','遊んでみる','見えてきたもの','どう作ったか'],HOUSE:8.5,DARK:8.2};
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const FONT='"Hiragino Sans","BIZ UDPGothic","Zen Maru Gothic",sans-serif';
const X0=173,X1=1747,Y=948;               // 線の左右（枠の幅）と高さ（枠の下と字幕のあいだ）
const cl=v=>Math.max(0,Math.min(1,v)),eo=v=>1-Math.pow(1-cl(v),3);
const SUBT=TL.SUBS.map(s=>s[0]),CHT=TL.CH.slice(1).map(c=>c[0]);
function yAt(x,t,tip){let y=Y+Math.sin(x*.012-t*2.2)*1.2+Math.sin(x*.031+t*1.3)*.6;             // ふだんの息づかい
  SUBT.forEach(s=>{const a=t-s;if(a<0||a>.7)return;const d=x-tip;y+=-7*Math.exp(-a*6)*Math.exp(-d*d/7200)*Math.sin(a*26)}); // 字幕が変わるとペン先がピクッ
  CHT.forEach(s=>{const a=t-s;if(a<0||a>1.6)return;const f=X0+(a/1.2)*(tip-X0),d=x-f;y+=-10*Math.exp(-d*d/16200)*(1-a/1.6)}); // 章が変わると左から波
  return y}
window.render=t=>{
  ctx.clearRect(0,0,1920,1080);
  const dark=t>=TL.DARK;
  // 章（枠の上の左上に4つ。いまの章だけ墨＋橙の点）
  const c=TL.CH.find(c=>t>=c[0]&&t<c[1]);
  if(c){let x=X0+2;ctx.font=`700 26px ${FONT}`;ctx.textBaseline='middle';
    TL.CHN.forEach((n,i)=>{const on=i===c[2];ctx.fillStyle=on?'#E8701F':'#d8d0c2';ctx.beginPath();ctx.arc(x+6,24,6,0,7);ctx.fill();
      ctx.fillStyle=on?'#1E2B36':'#a7aeb3';ctx.fillText(n,x+20,25);x+=ctx.measureText(n).width+64;});}
  // 字幕（帯の中央、墨の字、全編で同じ位置。長いときは字を小さくして1行に）
  const s=TL.SUBS.find(s=>t>=s[0]&&t<s[1]);
  if(s){const a=Math.min(eo((t-s[0])/.18),eo((s[1]-t)/.18));ctx.globalAlpha=a;ctx.fillStyle='#1E2B36';ctx.textAlign='center';ctx.textBaseline='middle';
    let fs=44;ctx.font=`700 ${fs}px ${FONT}`;while(ctx.measureText(s[2]).width>1640&&fs>28){fs-=2;ctx.font=`700 ${fs}px ${FONT}`}
    ctx.fillText(s[2],960,1014);ctx.globalAlpha=1;ctx.textAlign='left';}
  // 一本の線（ペン先が動画の始めから終わりへ。黒画面では紙の色になり、一筆で家を描いて屋根の下に橙の点）
  const tip=X0+(X1-X0)*cl(t/TL.HOUSE);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=dark?'#FFFAF0':'#1C9A8E';ctx.lineWidth=3.5;
  ctx.beginPath();for(let x=X0;x<=tip;x+=4){const y=yAt(x,t,tip);x===X0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
  let tp=[tip,yAt(tip,t,tip)];
  if(t>TL.HOUSE){const k=eo((t-TL.HOUSE)/2.6),cx=1560,cy=Y-30,sz=80;
    const P=[[X1,Y],[cx+sz+40,Y],[cx+sz,cy],[cx+sz,cy-sz*.9],[cx,cy-sz*1.7],[cx-sz,cy-sz*.9],[cx-sz,cy],[cx-sz*.25,cy],[cx-sz*.25,cy-sz*.55],[cx+sz*.25,cy-sz*.55],[cx+sz*.25,cy]];
    let L=0;const sg=[];for(let i=1;i<P.length;i++){const d=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);sg.push(d);L+=d}let r=L*k;
    for(let i=1;i<P.length&&r>0;i++){const f=Math.min(1,r/sg[i-1]);const x=P[i-1][0]+(P[i][0]-P[i-1][0])*f,y=P[i-1][1]+(P[i][1]-P[i-1][1])*f;ctx.lineTo(x,y);tp=[x,y];r-=sg[i-1]}
    ctx.stroke();if(k>=1){const a=eo((t-TL.HOUSE-2.6)/.4);ctx.globalAlpha=a;ctx.fillStyle='#E8701F';ctx.beginPath();ctx.arc(cx,cy-sz*1.15,9,0,7);ctx.fill();ctx.globalAlpha=1;return}}
  else ctx.stroke();
  const g=ctx.createRadialGradient(tp[0],tp[1],0,tp[0],tp[1],18);g.addColorStop(0,'rgba(232,112,31,.9)');g.addColorStop(1,'rgba(232,112,31,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(tp[0],tp[1],18,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tp[0],tp[1],3.5,0,7);ctx.fill();
};
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{window.render(+(new URLSearchParams(location.search).get('t')||3));window.READY=true});
</script></body></html>
