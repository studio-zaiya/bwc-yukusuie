<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ゆくすいえ — 実写の代用（線画の額）</title>
<!-- 実写が間に合わなかった場合の代用。線が額を描き、その中に線画が現れる。人間が撮った写真に差し替えられる。
     ?kind=table|sketch|hands|handover  ?t=秒。決定論的：window.render(t)、DUR、READY -->
<style>
:root{--paper:#FFFAF0;--ink:#1E2B36;--ink2:#6B6358;--kazu:#E8701F;--yuu:#1C8DCC;--gold:#C9962B}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
body{background-image:linear-gradient(rgba(28,141,204,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(28,141,204,.06) 1px,transparent 1px);background-size:32px 32px}
svg{position:absolute;left:0;top:0;width:1920px;height:1080px}
path,rect,line,circle,polyline{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:3}.k{stroke:var(--kazu)}.y{stroke:var(--yuu)}.g{stroke:var(--gold);stroke-dasharray:14 12}
.fillp{stroke:none;fill:#FFFFFF}
</style></head><body>
<svg id="s" viewBox="0 0 1920 1080"></svg>
<script>
const q=new URLSearchParams(location.search), KIND=q.get('kind')||'table';
const DURS={table:5,sketch:5,hands:5,handover:8}; const DUR=DURS[KIND]; window.DUR=DUR;
const cl=v=>Math.max(0,Math.min(1,v)), eo=v=>1-Math.pow(1-cl(v),3);
// 額：中央の 1280x720
const FX=320,FY=180,FW=1280,FH=720;
// 線の部品：[種類, 属性, 開始秒, 秒数]
const P=[];
const add=(tag,attrs,t0,d,cls='')=>P.push({tag,attrs,t0,d,cls});
const R=(x,y,w,h,r=0)=>`M${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h-r}Q${x+w} ${y+h} ${x+w-r} ${y+h}H${x+r}Q${x} ${y+h} ${x} ${y+h-r}V${y+r}Q${x} ${y} ${x+r} ${y}Z`;
add('path',{d:R(FX,FY,FW,FH,10)},0,1.0);
const ox=FX,oy=FY; // 額の内側の原点
if(KIND==='table'){ // 真上から：図面と見積書が広がる打ち合わせのテーブル
  add('path',{d:R(ox+40,oy+40,FW-80,FH-80,8),class:'thin'},.9,.6);
  // 図面（間取り）
  add('path',{d:R(ox+110,oy+90,520,400,4)},1.3,.6);
  add('path',{d:`M${ox+150} ${oy+130}H${ox+590}V${oy+450}H${ox+150}Z M${ox+150} ${oy+300}H${ox+400} M${ox+400} ${oy+130}V${oy+450} M${ox+400} ${oy+330}H${ox+590}`,class:'thin'},1.8,1.0);
  add('path',{d:`M${ox+300} ${oy+130}v14 M${ox+400} ${oy+390}v-0 M${ox+250} ${oy+300}v-18`,class:'thin y'},2.6,.5);
  // 見積書
  add('path',{d:R(ox+690,oy+120,360,440,4)},1.5,.6);
  for(let i=0;i<7;i++) add('line',{x1:ox+730,y1:oy+180+i*50,x2:ox+1010-(i%3)*60,y2:oy+180+i*50,class:'thin'},2.0+i*.1,.5);
  add('path',{d:`M${ox+730} ${oy+520}H${ox+1010}`,class:'k'},2.9,.5);
  // 鉛筆
  add('path',{d:`M${ox+560} ${oy+520}L${ox+840} ${oy+640}`},3.0,.6);
  add('path',{d:`M${ox+560} ${oy+520}l-24 -10 l18 18`,class:'k thin'},3.4,.4);
  // 円（コップの上面）
  add('circle',{cx:ox+1130,cy:oy+130,r:48,class:'thin'},3.2,.6);
  add('circle',{cx:ox+1130,cy:oy+130,r:34,class:'thin'},3.4,.5);
}
if(KIND==='sketch'){ // 手元：手書きのスケッチ（手と紙だけ）
  add('path',{d:R(ox+260,oy+90,760,540,6)},.9,.7);
  // 家のスケッチ（切妻）
  add('path',{d:`M${ox+380} ${oy+470}V${oy+300}L${ox+520} ${oy+200}L${ox+660} ${oy+300}V${oy+470}Z`},1.6,1.2);
  add('path',{d:`M${ox+700} ${oy+470}V${oy+330}L${ox+810} ${oy+260}L${ox+920} ${oy+330}V${oy+470}Z`,class:'thin'},2.6,1.0);
  add('line',{x1:ox+330,y1:oy+470,x2:ox+960,y2:oy+470},2.2,.7);
  add('path',{d:`M${ox+480} ${oy+470}V${oy+380}H${ox+540}V${oy+470}`,class:'thin y'},3.2,.6);
  // 手：握った手とペン（簡略）
  add('path',{d:`M${ox+930} ${oy+260}c40 -40 100 -30 130 10c30 40 60 130 40 200c-10 40 -60 50 -100 30c-40 -20 -70 -80 -90 -130z`},3.0,1.0);
  add('path',{d:`M${ox+930} ${oy+260}L${ox+840} ${oy+330}`,class:'k'},3.8,.6);
  add('path',{d:`M${ox+1010} ${oy+250}c20 10 40 40 50 80M${ox+1040} ${oy+240}c25 15 45 50 55 95`,class:'thin'},3.9,.6);
}
if(KIND==='hands'){ // 図面に向かう手元
  add('path',{d:R(ox+120,oy+90,1040,540,6)},.9,.7);
  add('path',{d:`M${ox+200} ${oy+500}V${oy+190}H${ox+620}V${oy+330}H${ox+1080}V${oy+500}Z M${ox+620} ${oy+190}V${oy+500}`,class:'thin'},1.5,1.2);
  add('path',{d:`M${ox+260} ${oy+190}v40 M${ox+420} ${oy+190}v40 M${ox+780} ${oy+330}v40`,class:'thin y'},2.6,.5);
  // 定規
  add('path',{d:R(ox+150,oy+540,700,40,4),class:'thin'},2.3,.7);
  for(let i=0;i<14;i++) add('line',{x1:ox+190+i*48,y1:oy+540,x2:ox+190+i*48,y2:oy+(i%2?556:566),class:'thin'},2.6+i*.03,.3);
  // 手
  add('path',{d:`M${ox+900} ${oy+640}c-10 -90 20 -170 80 -190c60 -20 110 20 120 90c10 60 -10 100 -40 100z`},3.0,1.0);
  add('path',{d:`M${ox+960} ${oy+470}c-30 -50 -70 -90 -120 -110`,class:'k'},3.8,.7);
}
if(KIND==='handover'){ // レポートを手渡す（手元だけ・無地の背景）
  // 机の線
  add('line',{x1:FX+60,y1:FY+560,x2:FX+FW-60,y2:FY+560,class:'thin'},.9,.8);
  // レポート（冊子）：縦長、表紙に16区画
  add('path',{d:R(ox+520,oy+120,240,340,6)},1.6,.9);
  add('path',{d:R(ox+535,oy+135,240,340,6),class:'thin'},1.9,.8);
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){const x=ox+560+c*44,y=ox*0+oy+170+r*44;add('rect',{x,y,width:30,height:30,class:(r*4+c===6)?'k':'thin'},2.4+(r*4+c)*.05,.4)}
  add('line',{x1:ox+560,y1:oy+400,x2:ox+720,y2:oy+400,class:'thin'},3.4,.5);
  // 左の手（渡す側）、右の手（受け取る側）
  add('path',{d:`M${ox+60} ${oy+470}c80 -30 220 -40 330 -10c30 8 40 40 10 55c-60 30 -200 40 -340 20z`},3.4,1.2);
  add('path',{d:`M${ox+390} ${oy+450}c20 -20 50 -10 60 10M${ox+400} ${oy+475}c25 -15 55 -5 62 15`,class:'thin'},4.3,.6);
  add('path',{d:`M${ox+1220} ${oy+420}c-80 -10 -220 20 -320 60c-30 12 -30 45 0 55c70 20 210 10 320 -20z`},4.2,1.2);
  add('path',{d:`M${ox+900} ${oy+470}c-20 -25 -55 -20 -70 -2M${ox+895} ${oy+495}c-22 -20 -55 -12 -70 6`,class:'thin'},5.1,.6);
  // 受け取ったあと：金の破線が一周（◆を入れずに、静かに）
  add('path',{d:R(ox+500,oy+100,300,380,16),class:'g thin'},6.2,1.2);
}
const svg=document.getElementById('s');
const els=P.map(p=>{const e=document.createElementNS('http://www.w3.org/2000/svg',p.tag);for(const k in p.attrs)e.setAttribute(k,p.attrs[k]);e.setAttribute('pathLength','1');
  const dash=/\bg\b/.test(p.attrs.class||'');e.dataset.dash=dash?1:0;svg.appendChild(e);return e});
window.render=t=>{
  P.forEach((p,i)=>{const a=eo((t-p.t0)/p.d),e=els[i];
    if(e.dataset.dash==='1'){e.style.opacity=a;return}
    e.style.strokeDasharray='1 1';e.style.strokeDashoffset=(1-a).toFixed(4);e.style.opacity=a>0?1:0;});
  svg.style.opacity=(1-cl((t-(DUR-.5))/.5)).toFixed(3);
};
render(q.has('t')?+q.get('t'):DUR-.6);
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{window.READY=true});
</script></body></html>
