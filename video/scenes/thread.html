<!doctype html><html><head><meta charset="utf-8"><title>thread</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script>
// 一本の線（字幕の上を、最初から最後まで走る）【人間の案、Claudeが実装】
// ?bg=URL で背景の確認用画像。?demo=1 で12秒の見本の時刻表を使う
const Q=new URLSearchParams(location.search);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=1920,H=1080;
const C={te:'#1C9A8E',or:'#E8701F',ink:'#1E2B36'};
const X0=134,X1=1786,Y=948;            // 線の左右と高さ（枠の下と字幕のあいだ）
// 時刻表：DUR 全体の秒、SUBS 字幕が変わる秒、CH 章が変わる秒、HOUSE 家を描き始める秒
let T={DUR:180,SUBS:[],CH:[],HOUSE:172};
if(Q.get('demo')) T={DUR:12,SUBS:[1.5,3.2,4.8,7.4],CH:[6.0],HOUSE:8.6};
try{const j=Q.get('tl');if(j)Object.assign(T,JSON.parse(decodeURIComponent(j)))}catch(e){}
window.DUR=T.DUR;
const bg=new Image();if(Q.get('bg'))bg.src=Q.get('bg');
const cl=v=>Math.max(0,Math.min(1,v)),eo=v=>1-Math.pow(1-cl(v),3),eio=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
function yAt(x,t,tipX){let y=Y+Math.sin(x*.012-t*2.2)*1.2+Math.sin(x*.031+t*1.3)*.6; // ふだんの息づかい
  T.SUBS.forEach(s=>{const a=t-s;if(a<0||a>.7)return;const d=x-tipX;y+=-7*Math.exp(-a*6)*Math.exp(-d*d/(2*60*60))*Math.sin(a*26)}); // 字幕が変わると、ペン先がピクッ
  T.CH.forEach(s=>{const a=t-s;if(a<0||a>1.6)return;const front=X0+(a/1.2)*(tipX-X0);const d=x-front;y+=-10*Math.exp(-d*d/(2*90*90))*(1-a/1.6)}); // 章が変わると、波が左から走る
  return y}
function house(p,cx,cy,s){ // 一筆の家（切妻）
  const pts=[[cx-s,cy],[cx-s,cy-s*.9],[cx,cy-s*1.7],[cx+s,cy-s*.9],[cx+s,cy],[cx-s*.25,cy],[cx-s*.25,cy-s*.55],[cx+s*.25,cy-s*.55],[cx+s*.25,cy]];
  return pts}
function render(t){ctx.clearRect(0,0,W,H);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,W,H);
  const prog=cl(t/T.HOUSE),tipX=X0+(X1-X0)*eio(prog*1)*1;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=C.te;ctx.lineWidth=3;
  // 描いた分の線
  ctx.beginPath();for(let x=X0;x<=tipX;x+=4){const y=yAt(x,t,tipX);x===X0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
  // 家：線の終わりから立ち上がって、一筆で家を描く
  let tip=[tipX,yAt(tipX,t,tipX)];
  if(t>T.HOUSE){const k=eio((t-T.HOUSE)/2.4);const P=[[X1,Y],[1600,Y],...house(0,1500,Y-40,70).map(p=>p)];
    // 経路の長さで k の分だけ描く
    let L=0;const seg=[];for(let i=1;i<P.length;i++){const d=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);seg.push(d);L+=d}
    let rem=L*k;for(let i=1;i<P.length&&rem>0;i++){const f=Math.min(1,rem/seg[i-1]);const x=P[i-1][0]+(P[i][0]-P[i-1][0])*f,y=P[i-1][1]+(P[i][1]-P[i-1][1])*f;ctx.lineTo(x,y);tip=[x,y];rem-=seg[i-1]}
    if(k>=1){ctx.stroke();ctx.restore();ctx.save();const a=eo((t-T.HOUSE-2.4)/.4);ctx.globalAlpha=a;ctx.fillStyle=C.or;ctx.beginPath();ctx.arc(1500,Y-40-70*1.15,7,0,7);ctx.fill();ctx.restore();return}}
  ctx.stroke();
  // ペン先の光
  const g=ctx.createRadialGradient(tip[0],tip[1],0,tip[0],tip[1],16);g.addColorStop(0,'rgba(232,112,31,.9)');g.addColorStop(1,'rgba(232,112,31,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(tip[0],tip[1],16,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tip[0],tip[1],3,0,7);ctx.fill();ctx.restore()}
window.render=render;
Promise.all([bg.src?new Promise(r=>{bg.onload=r;bg.onerror=r}):0]).then(()=>{window.READY=true});
if(!Q.get('t')){const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%T.DUR);requestAnimationFrame(loop)})()}
</script></body></html>
