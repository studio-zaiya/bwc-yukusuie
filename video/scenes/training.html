<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ゆくすいえ — 担当者の研修の前後</title>
<!-- 値は docs/devlog.md（2026-11-05 03:40 と 11:10）の実際の研修の記録だけ。審査役のClaudeが会話を読んで 1〜5 で採点した平均。
     1回目 → 9回目。決定論的：window.render(t)、DUR、READY、?t=秒 -->
<style>
:root{--paper:#FFFAF0;--ink:#1E2B36;--ink2:#6B6358;--line:#D9D2C3}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","BIZ UDPGothic","Zen Maru Gothic",sans-serif}
body{background-image:linear-gradient(rgba(28,141,204,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(28,141,204,.06) 1px,transparent 1px);background-size:32px 32px}
.wrap{position:absolute;left:200px;right:200px;top:130px}
h1{font-size:64px;font-weight:700;letter-spacing:.02em}
.sub{font-size:30px;color:var(--ink2);margin-top:18px}
.m{margin-top:70px}
.row{display:grid;grid-template-columns:520px 1fr;align-items:center;gap:30px;margin-bottom:56px}
.lab{font-size:38px;font-weight:700;line-height:1.35}
.bars{position:relative;height:120px}
.axis{position:absolute;left:0;right:0;top:0;bottom:0}
.axis i{position:absolute;top:0;bottom:0;border-left:2px dashed var(--line)}
.axis b{position:absolute;bottom:-40px;transform:translateX(-50%);font-size:24px;font-weight:400;color:var(--ink2)}
.bar{position:absolute;left:0;height:44px;border-radius:0 10px 10px 0;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;font-size:30px;font-weight:700}
.b0{top:6px;background:#E6DFD1;color:var(--ink2)}
.b1{top:62px;background:var(--ink);color:#fff}
.tag{position:absolute;left:-150px;font-size:24px;color:var(--ink2);width:130px;text-align:right}
.note{position:absolute;left:200px;right:200px;top:820px;font-size:24px;color:var(--ink2)}
</style></head><body>
<div class="wrap">
  <h1 id="h">担当者の研修（9回）</h1>
  <div class="sub" id="s">客役と審査役もAIが演じ、審査役が会話を読んで1〜5で採点した平均（1回目 → 9回目）</div>
  <div class="m">
    <div class="row" data-a="1.58" data-b="2.67"><div class="lab">頼まれたことに<br>答えたか</div><div class="bars"></div></div>
    <div class="row" data-a="1.44" data-b="2.55"><div class="lab">話が<br>前に進んだか</div><div class="bars"></div></div>
  </div>
</div>
<div class="note" id="n">決まり文句に落ちた発言：92回 → 2回（5回目まで）。記録は期間中の実際の研修から</div>
<script>
const DUR=6;window.DUR=DUR;
const cl=v=>Math.max(0,Math.min(1,v)),eo=v=>1-Math.pow(1-cl(v),3);
const rows=[...document.querySelectorAll('.row')];
const BW=880; // 1〜5 の幅
rows.forEach(r=>{const b=r.querySelector('.bars');
  b.innerHTML=`<div class="axis">${[1,2,3,4,5].map(v=>`<i style="left:${(v-1)/4*BW}px"></i><b style="left:${(v-1)/4*BW}px">${v}</b>`).join('')}</div>
  <div class="bar b0"><span></span></div><div class="bar b1"><span></span></div>
  <div class="tag" style="top:12px">1回目</div><div class="tag" style="top:68px">9回目</div>`});
const fade=(el,a)=>{el.style.opacity=a.toFixed(3);el.style.transform=`translateY(${((1-a)*14).toFixed(1)}px)`};
window.render=t=>{
  fade(document.getElementById('h'),eo(t/.5));fade(document.getElementById('s'),eo((t-.3)/.5));
  rows.forEach((r,i)=>{const a=+r.dataset.a,b=+r.dataset.b,t0=.8+i*.5;
    fade(r,eo((t-t0)/.4));
    const k0=eo((t-t0-.2)/.6),k1=eo((t-t0-.8)/.9);
    const w=v=>Math.max(60,(v-1)/4*BW);
    const e0=r.querySelector('.b0'),e1=r.querySelector('.b1');
    e0.style.width=(w(1+(a-1)*k0))+'px';e0.firstChild.textContent=k0>.95?a.toFixed(2):'';
    const v1=a+(b-a)*k1;e1.style.width=(k1>0?w(v1):0)+'px';e1.firstChild.textContent=k1>0?v1.toFixed(2):'';});
  fade(document.getElementById('n'),eo((t-3.0)/.5));
};
const q=new URLSearchParams(location.search);render(q.has('t')?+q.get('t'):DUR);
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{window.READY=true});
</script></body></html>
