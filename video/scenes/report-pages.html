<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ゆくすいえ — レポートの4ページ</title>
<!-- 実機の印刷用レポート（/report.html）を撮った4ページを、順にめくる【構成：Claude】。
     画像は out/rec/report-p1〜4.png（実機の再生モードから撮ったもの。台本の画面ではない）。?img=画像のフォルダ
     決定論的：window.render(t)、DUR、READY、?t=秒 -->
<style>
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#FFFAF0}
body{background-image:linear-gradient(rgba(28,141,204,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(28,141,204,.06) 1px,transparent 1px);background-size:32px 32px}
.pg{position:absolute;left:50%;top:50%;height:940px;width:auto;transform-origin:50% 50%;box-shadow:0 18px 40px rgba(30,43,54,.18),0 2px 6px rgba(30,43,54,.12);border-radius:4px;opacity:0;background:#fff}
</style></head><body>
<script>
const q=new URLSearchParams(location.search);
const IMG=q.get('img')||'../../out/rec';
const DUR=+(q.get('dur')||8);window.DUR=DUR;
const cl=v=>Math.max(0,Math.min(1,v)),eio=v=>{v=cl(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2},lerp=(a,b,k)=>a+(b-a)*k;
const pages=[1,2,3,4].map(i=>{const im=new Image();im.className='pg';im.src=`${IMG}/report-p${i}.png`;document.body.appendChild(im);return im});
// 各ページの登場（秒）。表紙 → 2 → 3 → 4、最後に3ページ目（先に伝えておきたいこと）へ寄る
const T=[0.0,1.6,3.0,4.2];
const W=940*794/1123;
window.render=t=>{
  const zoom=eio((t-5.6)/1.4); // 3ページ目へ寄る
  pages.forEach((im,i)=>{
    const a=eio((t-T[i])/0.8);if(a<=0){im.style.opacity=0;return}
    // 置き場所：並べたときの x（4枚を少し重ねて扇に）
    const fan=[-690,-230,230,690][i];
    const n=T.filter(x=>t>=x+0.8).length; // 置き終わった枚数
    const settled=Math.min(1,eio((t-T[3]-0.8)/0.6));
    const x0=lerp(700,0,a);           // 右から入る
    const xc=lerp(0,fan,settled);     // 最後に扇に開く
    let x=x0+xc,y=lerp(40,0,a),rot=lerp(6,[-3,-1,1,3][i]*settled,a),sc=lerp(1,.48,settled);
    if(zoom>0){ if(i===2){x=lerp(x,0,zoom);sc=lerp(sc,1.05,zoom);rot=lerp(rot,0,zoom);y=lerp(y,30,zoom)} else {im.style.opacity=(1-zoom*.75).toFixed(3)} }
    if(!(zoom>0&&i!==2)) im.style.opacity=a.toFixed(3);
    im.style.zIndex=i===2&&zoom>0?10:i;
    im.style.transform=`translate(-50%,-50%) translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
  });
};
Promise.all(pages.map(im=>im.decode().catch(()=>{}))).then(()=>{render(q.has('t')?+q.get('t'):DUR);window.READY=true});
</script></body></html>
