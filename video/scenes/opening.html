<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ゆくすいえ — 冒頭のロゴ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:rgb(14,18,34)}
#lock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
#t{font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;font-weight:900;font-size:128px;letter-spacing:.1em;color:#FFFAF0;margin-top:-6px;line-height:1.1}
#e{font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;font-weight:700;font-size:30px;letter-spacing:.16em;color:#FFFAF0;margin-top:12px;opacity:.9}
#e span{font-weight:500}
#c2{white-space:nowrap;font-family:"Hiragino Sans","BIZ UDPGothic",sans-serif;font-weight:400;font-size:28px;letter-spacing:.06em;color:#FFFAF0;margin-top:22px;opacity:0}
#c{white-space:nowrap;font-family:"Hiragino Sans","BIZ UDPGothic",sans-serif;font-weight:700;font-size:38px;letter-spacing:.08em;color:#FFFAF0;margin-top:56px;opacity:.95}
</style></head><body>
<div id="all"><div id="lock"><div id="logo"></div><div id="c"></div><div id="c2"></div></div></div>
<script src="logo.js"></script>
<script>
// 冒頭のロゴ【人間の案】：Heroの最初の空の色の上に、白い文字のロゴと一言。消えるとそのままHeroの光が降りてくる
const q=new URLSearchParams(location.search);
// mode=light：締め用の反転（明るい紙色の地に墨の文字、同じレイアウト）【人間の案】
const LIGHT=q.get('mode')==='light';
if(LIGHT){document.documentElement.style.background=document.body.style.background='#FFFAF0';document.getElementById('c').style.color='#1E2B36';}
const DUR=+(q.get('dur')||4); window.DUR=DUR;
// タイトル【人間の決定 11/6】：大きく「Claudeと描く、家づくりの16の未来。」、小さく今の添え書き。締め（light）は「16回目の、マイホームへ。」だけ
document.getElementById('c').textContent=q.get('copy')||(LIGHT?'16回目の、マイホームへ。':'Claudeと描く、家づくりの16の未来。');
document.getElementById('c2').textContent=LIGHT?'':(q.get('sub')||'現役の建築士が、Claudeとつくった家づくりシミュレーション');
if(!LIGHT)document.getElementById('c').style.fontSize='52px';
const cl=v=>Math.max(0,Math.min(1,v)),eo=v=>1-Math.pow(1-cl(v),3),$=id=>document.getElementById(id);
const fade=(el,a)=>{el.style.opacity=a.toFixed(3);el.style.transform=`translateY(${((1-a)*12).toFixed(1)}px)`};
window.render=t=>{
  // 新しいロゴ（横組み、「い」が橙）。マークが現れ、文字、英字の順
  $('logo').innerHTML=YLOGO.lockupHTML({fs:132,ink:LIGHT?'#1E2B36':'#FFFAF0',p:cl(t/1.1),textA:eo((t-1.0)/0.5).toFixed(3),subA:eo((t-1.3)/0.5).toFixed(3)});
  fade($('c'),eo((t-1.7)/0.6)); if(!LIGHT)fade($('c2'),eo((t-2.0)/0.6)*.85);
  $('all').style.opacity=(LIGHT?1:(1-cl((t-(DUR-0.8))/0.8))).toFixed(3);
};
render(q.has('t')?+q.get('t'):3);window.READY=true;
</script></body></html>
