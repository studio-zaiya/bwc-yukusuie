<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../../../../app/engine.js"></script><script src="../../../../app/iso.js"></script><script src="../../play/common.js"></script><script src="../_s.js"></script>
<title>S1 起動画面</title>
<style>
.bg{position:absolute;inset:0;background:linear-gradient(#CFEBFA,#F4FAFD 56%,#F3E7CF 56.1%)}
.est{position:absolute;left:820px;top:150px;width:1080px;height:860px}
.est svg{width:100%;height:100%}
.ttl{position:absolute;left:120px;top:250px;width:700px}
#logo-slot.big{font-family:var(--fr);font-weight:900;font-size:128px;letter-spacing:.04em;line-height:1;white-space:nowrap}
.en{font-size:32px;letter-spacing:.14em;margin-top:22px;font-weight:700}.en span{font-weight:400}
.catch{font-family:var(--fr);font-weight:700;font-size:44px;margin-top:60px}
.bt{display:flex;gap:18px;margin-top:60px;align-items:center}
.lock{font:700 22px var(--f);padding:14px 26px;border-radius:12px;border:2px dashed rgba(30,43,54,.35);background:rgba(255,250,240,.7);color:rgba(30,43,54,.5)}
.lock small{display:block;font-weight:400;font-size:14px}
.note{position:absolute;left:120px;bottom:48px;width:760px;font-size:16px;line-height:1.7;color:var(--ink2)}
</style></head>
<body><div id="stage"><div id="view"></div></div>
<script>
S.mountStatic(() => {
  const L = S.L;
  document.getElementById('view').innerHTML = `
  <div class="bg"></div>
  <div class="est">${L.estate2(L.worldsAt(10.6), {})}</div>
  <div class="ttl">
    <div id="logo-slot" class="big">ゆくすいえ</div>
    <div class="en">YUKUSUIE: <span>16 unbuilt futures</span></div>
    <div class="catch">16回目の、マイホームへ。</div>
    <div class="bt"><button class="btn" style="font-size:26px;padding:16px 40px">はじめる</button>
      <span class="lock">16の世界を、AIにまかせて見る<small>1回遊ぶと開きます</small></span></div>
  </div>
  <p class="note">本作の制度・手続き・金額・期間などの設定は、体験のために簡略化しています。実際の家づくりでは、地域・金融機関・住宅会社によって異なります。登場する住宅会社・人物・団体はすべて架空です。</p>`;
});
</script></body></html>
