<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P1 ヒアリングのチャット v3</title>
<link rel="stylesheet" href="../_shared/v3.css">
<script src="../../../../app/engine.js"></script><script src="../../../../app/iso.js"></script>
<style>
.right .chat{height:100%}
.chat .tools{display:flex;gap:10px;align-items:center;padding:0 16px 10px}
.chat .tools .used{font-size:14px;color:var(--ink2);margin-left:auto}
.caster{left:44px;bottom:262px}
.pair{position:absolute;left:880px;bottom:262px;display:flex;gap:6px;z-index:12;pointer-events:none}
.pair .cst .nm{font-size:14px}
.pair .cst .nm i{width:12px;height:12px;display:inline-block}
.ghostlab{position:absolute;left:520px;top:600px;font-size:16px;color:var(--ink2);background:rgba(255,250,240,.9);border:1px dashed rgba(30,43,54,.35);border-radius:999px;padding:4px 14px}
.cursor::after{content:"";display:inline-block;width:2px;height:1em;background:var(--ink);margin-left:2px;vertical-align:-2px;animation:cb 1s steps(1) infinite}
@keyframes cb{50%{opacity:0}}
</style></head>
<body><div id="stage"><div id="view"></div></div>
<script src="../../../v2/layout/common.js"></script>
<script src="../_shared/v3.js"></script>
<script>
const co = (V3.Q.get('co') || 'A').toUpperCase();
const C = YKS.COMPANIES[co], S = V3.STAFF[co];
// 口調の見本（本番はClaude〈中位〉が、担当者の設定と口調の指示から生成する）
const TALK = {
  A: [['s', 'アンケートのご記入、ありがとうございます。ご予算は4,500〜5,500万円、土地は分譲地にお申込み中ですね。'], ['kz', 'はい。第二希望が当たりそうで。'], ['s', '承知しました。ご主人は、どのような家をお考えでしょうか。'], ['kz', '外観はかっこよく。ミニマルにしたいです。'], ['s', 'ありがとうございます。奥様は、いかがでしょうか。']],
  B: [['s', 'アンケート、ありがとうございます！分譲地、いい場所ですよね。'], ['kz', 'まだ決まったわけじゃないんですけど。'], ['s', '規格プランなら土地が決まってからでも間に合います！ご主人、こだわりはありますか？'], ['kz', '外観はかっこよく。ミニマルに。'], ['s', 'いいですね！奥様は、どんな感じがお好きですか？']],
  C: [['s', '……ありがとうございます。今のお住まいで、困っていることはありますか。'], ['yu', '収納が足りなくて、玄関がいつも靴だらけで。'], ['s', 'なるほど。朝は、皆さん同じ時間に出かけますか。'], ['kz', '僕と上の子が、ほぼ同時です。'], ['s', '……では、玄関まわりは、ゆとりを見ておきます。奥様は、家で好きな場所はありますか。']],
  D: [['s', 'アンケート見たよ。うさぎ飼ってるの？いいねえ。'], ['yu', 'はい、庭に囲いを作ってあげたくて。'], ['s', 'そんなの簡単、簡単。ほかには？ご主人は？'], ['kz', '外観はかっこよく。ミニマルに。'], ['s', '任せといて。奥さんは、どんな家がいい？']],
};
const T = TALK[co];
const me = YKS.HOUSEHOLDS.t2;
const L_ = window.L; const list = L_.worldsAt(1.3), mine = list[L_.YOU - 1];
const who = w => w === 'kz' ? '<i class="sq" style="display:inline-block;width:12px;height:12px;background:var(--kazu)"></i>かず' : '<i style="display:inline-block;width:12px;height:12px;background:var(--yuu);border-radius:50%"></i>ゆう';
const msgHTML = ([w, t], i, last) => w === 's'
  ? `<div class="msg" ${last ? 'id="last"' : ''}><div class="who">${V3.coTag(co, 18)}${S.role}・${S.name}</div><span class="tx">${t}</span></div>`
  : `<div class="msg me ${w === 'kz' ? 'kz' : ''}"><div class="who">${who(w)}</div>${t}</div>`;
document.getElementById('view').innerHTML = `
${V3.topbar(1, {})}
<div class="hero">
  <div class="lab"><span class="no">07</span>あなたの家</div>
  <div class="ph">初回打ち合わせ　${C.name}<br><span style="font-size:15px">まだ地縄も張られていない、分譲地の区画</span></div>
  ${L_.bigHouse(mine.w, 0, { ghost: 0.45 })}
  <div class="ghostlab">要望から考えた家の大きさ（仮）</div>
</div>
<div class="right"><div class="chat">
  <div class="hd">${V3.coTag(co, 30)}<b>${C.name}</b>${S.role}・${S.name}<span class="sub">初回打ち合わせ</span></div>
  <div class="log" id="log">${T.map((m, i) => msgHTML(m, i, i === T.length - 1)).join('')}</div>
  <div class="tools"><div class="nav2"><button type="button">SNSを見る</button><button type="button">自分のAIに聞く</button></div><span class="used">自分のAIは、この場面で1回まで</span></div>
  <div class="in"><label for="ans" style="position:absolute;left:-9999px">ゆうとして答える</label><input id="ans" placeholder="ゆうとして答える（木の家、庭、畑……）"><button class="btn" type="button">伝える</button></div>
</div></div>
<div class="caster" id="cast"><div class="cst">${V3.avatar(co, 168, 'idle', 'id="av"')}<div class="nm">${V3.coTag(co, 22)}${C.name}　${S.role}・${S.name}</div></div></div>
<div class="pair"><div class="cst">${V3.spouse('kazu', 92)}</div><div class="cst">${V3.spouse('yuu', 92)}</div></div>
${V3.gallery(1.3)}
<div class="ctrl"><button id="play">応答の流れを再生</button>${['A', 'B', 'C', 'D'].map(k => `<button onclick="location.search='?co=${k}'">${k}</button>`).join('')}</div>
`;
// 応答の流れ：考え中（文字が届くまで）→ 話す（文字が流れるあいだ）→ 笑顔（言い終わり）→ 待機
const av = document.getElementById('av'), last = document.querySelector('#last .tx'), full = T[T.length - 1][1];
function play() {
  V3.setFace(av, 'think'); last.textContent = '……'; last.classList.remove('cursor');
  setTimeout(() => {
    V3.setFace(av, 'talk'); last.textContent = ''; last.classList.add('cursor'); let i = 0;
    const tick = () => { i += 2; last.textContent = full.slice(0, i); if (i < full.length) setTimeout(tick, 60); else { last.classList.remove('cursor'); V3.setFace(av, 'smile'); setTimeout(() => V3.setFace(av, 'idle'), 1400); } };
    tick();
  }, 1200);
}
document.getElementById('play').onclick = play;
// 撮影用：?s=think|talk|smile で表情を固定
const s = V3.Q.get('s');
if (s === 'think') { V3.setFace(av, 'think'); last.textContent = '……'; }
if (s === 'talk') { V3.setFace(av, 'talk'); last.textContent = full.slice(0, Math.ceil(full.length * .6)); last.classList.add('cursor'); }
if (s === 'smile') V3.setFace(av, 'smile');
</script></body></html>
