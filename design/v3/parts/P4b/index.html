<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P4-b 電気の打ち合わせ v3</title>
<link rel="stylesheet" href="../_shared/v3.css">
<script src="../../../../app/engine.js"></script><script src="../../../../app/iso.js"></script>
<style>
.spec{position:absolute;left:30px;top:104px;width:1100px;height:900px;background:#fff;border:1.5px solid rgba(30,43,54,.2);border-radius:18px;padding:30px 40px;display:flex;flex-direction:column;gap:18px}
.spec > *{max-width:820px}
.spec h1{font-size:28px;display:flex;align-items:baseline;gap:14px}
.spec h1 small{font-size:17px;font-weight:400;color:var(--ink2)}
.spec h2{font-size:19px;color:var(--ink2);letter-spacing:.06em;margin-top:6px}
.spec dl{display:grid;grid-template-columns:220px 1fr;gap:0;font-size:21px;line-height:1.55}
.spec dt,.spec dd{padding:10px 0;border-bottom:1px solid rgba(30,43,54,.12)}
.spec dt{font-weight:700}
.spec dd{margin:0}
.spec ul{list-style:none;display:flex;flex-direction:column;gap:0;font-size:21px}
.spec li{padding:10px 0;border-bottom:1px solid rgba(30,43,54,.12);display:flex;justify-content:space-between;gap:12px}
.spec li span{color:var(--ink2);font-size:17px;white-space:nowrap}
.spec li.add{border-bottom:1.5px dashed var(--goldT)}
.spec li.add::before{content:"◆";color:var(--gold);-webkit-text-stroke:.6px var(--goldT);margin-right:10px}
.spec li.add b{flex:1;font-weight:400}
.right .chat{height:100%}
.chat .acts{display:flex;gap:10px;padding:0 16px 12px}
.caster{left:900px;bottom:90px}
</style></head>
<body><div id="stage"><div id="view"></div></div>
<script src="../../../v2/layout/common.js"></script>
<script src="../_shared/v3.js"></script>
<script>
const v = V3.Q.get('v') || 'ask';
const ME = V3.ME(), S = V3.STAFF.C;
const PRIOR = 102; // 契約後の増工の累計（ショールーム12＋コーディネート90。本番は台帳から）
// 追加の単価は仮置き（engine.js に電気の単価表として追加予定）
const ADD = [['壁掛けテレビの下地と配線（リビング）', 4.8], ['寝室に有線LAN', 2.5]];
const addSum = v === 'reply' ? ADD.reduce((a, x) => a + x[1], 0) : 0;
document.getElementById('view').innerHTML = `
${V3.topbar(6, { company: 'C', contract: true, amount: ME.quote.real, add: +(PRIOR + addSum).toFixed(1), loan: ME.principal })}
<section class="spec" aria-label="電気・設備の仕様">
  <h1>電気・設備の仕様<small>Cデザイン　電気の打ち合わせ</small></h1>
  <h2>標準仕様</h2>
  <dl>
    <dt>照明</dt><dd>ダウンライト。子供部屋のみリモコン付きシーリングライト</dd>
    <dt>コンセント</dt><dd>LDKは4か所。その他の部屋は2か所ずつ</dd>
    <dt>テレビ</dt><dd>地上波1か所。床置き</dd>
    <dt>インターネット</dt><dd>光回線の引き込み＋電源1か所のみ</dd>
    <dt>スイッチ・プレート</dt><dd>標準品</dd>
  </dl>
  <h2>契約に入れてあるオプション</h2>
  <ul>
    <li><b style="font-weight:400">書斎に有線LANを追加</b><span>契約済み</span></li>
    <li><b style="font-weight:400">LDKに間接照明</b><span>契約済み</span></li>
    <li><b style="font-weight:400">外部コンセント（駐車場側）1か所</b><span>契約済み</span></li>
  </ul>
  ${v === 'reply' ? `<h2>今回の追加</h2><ul>${ADD.map(([t, a]) => `<li class="add"><b>${t}</b><span>+${a}万円</span></li>`).join('')}</ul>` : ''}
</section>
<div class="right"><div class="chat">
  <div class="hd">${V3.coTag('C', 30)}<b>Cデザイン</b>${S.role}・${S.name}<span class="sub">電気の打ち合わせ</span></div>
  <div class="log">
    <div class="msg"><div class="who">${V3.coTag('C', 18)}${S.role}・${S.name}</div>左の内容で進めますが、問題ないでしょうか。</div>
    ${v === 'reply' ? `
    <div class="msg me"><div class="who"><i style="display:inline-block;width:12px;height:12px;background:var(--yuu);border-radius:50%"></i>ゆう</div>リビングのテレビは壁掛けにしたいって、最初に伝えていました。下地と配線もお願いします。あと、寝室にもLANがほしいです。</div>
    <div class="msg"><div class="who">${V3.coTag('C', 18)}${S.role}・${S.name}</div>……すみません。壁掛けテレビの下地と配線は、契約には入っていないんです。追加で+4.8万円になります。寝室のLANは、+2.5万円です。</div>` : ''}
  </div>
  ${v === 'reply'
    ? `<div class="acts"><button class="btn" type="button">追加する（+${addSum}万円）</button><button class="btn ghost" type="button">やめておく</button></div>`
    : `<div class="acts"><button class="btn" type="button">この内容でOK</button></div>`}
  <div class="tools" style="display:flex;gap:10px;padding:0 16px 10px"><div class="nav2"><button type="button">SNSを見る</button><button type="button">自分のAIに聞く</button></div></div>
  <div class="in"><label for="tell" style="position:absolute;left:-9999px">追加の要望や、気になるところを伝える</label><input id="tell" placeholder="追加の要望や、気になるところを伝える"><button class="btn" type="button">伝える</button></div>
</div></div>
<div class="caster"><div class="cst">${V3.avatar('C', 150, v === 'reply' ? 'talk' : 'smile')}<div class="nm">${V3.coTag('C', 22)}Cデザイン　${S.role}・${S.name}</div></div></div>
<div class="ctrl"><button onclick="location.search='?v=ask'">聞かれる</button><button onclick="location.search='?v=reply'">指摘したあと</button></div>`;
</script></body></html>
