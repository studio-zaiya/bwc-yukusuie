<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>L4 推奨：アップ＋ギャラリー＋処理の記録</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../../../../app/engine.js"></script><script src="../../../../app/iso.js"></script><script src="../common.js"></script>
<style id="css"></style>
<style>
.top{position:absolute;left:40px;right:40px;top:22px;display:flex;align-items:center;gap:26px}
.logo{font-family:var(--fr);font-weight:900;font-size:30px;white-space:nowrap}
.top .pbar{flex:1}
.hero{position:absolute;left:30px;top:146px;width:1090px;height:470px;background:linear-gradient(#DDF0FA,#F4FAFD 52%,#F3E7CF 52.1%);border-radius:22px;overflow:hidden}
.hero svg{position:absolute;left:190px;top:0;width:700px;height:470px}
.hero .lab{position:absolute;left:28px;top:20px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.hero .no{font-family:var(--fr);font-weight:900;font-size:42px}
.hero .ph{position:absolute;right:26px;top:22px;font-size:17px;color:var(--ink2);text-align:right;line-height:1.5}
.trace{position:absolute;left:30px;top:630px;width:1090px;height:78px;display:flex;align-items:center;gap:0;background:#fff;border:1.5px solid rgba(30,43,54,.14);border-radius:16px;padding:0 14px}
.trace .t0{font-size:13px;color:var(--ink2);width:108px;line-height:1.35;white-space:nowrap}
.bd{display:flex;flex-direction:column;justify-content:center;padding:6px 12px;border-radius:12px;min-width:140px;height:58px}
.bd small{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.bd b{font-size:17px;white-space:nowrap}
.bd.cl{background:#FFF6E0;border:1.5px dashed #C99A00}
.bd.en{background:#EEF2F5;border:1.5px solid #9AA6AF}
.bd.ok{background:var(--ink);color:var(--paper)}.bd.ok small{color:#C9D3DA}
.ar{width:26px;text-align:center;color:var(--ink2);font-size:20px}
.right{position:absolute;left:1150px;top:146px;width:730px;height:562px}
.right .chat{height:100%}
.gal{position:absolute;left:30px;right:30px;bottom:22px;height:296px;display:grid;grid-template-columns:repeat(15,1fr);gap:8px}
.th{background:#fff;border:1.5px solid rgba(30,43,54,.14);border-radius:12px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;font-size:13px;line-height:1.35;overflow:hidden}
.th.same{border:2px dashed #C99A00;background:#FFFCF2}
.th .hd{display:flex;align-items:center;justify-content:space-between;width:100%;font-weight:700;font-size:16px}
.th svg{width:100%;height:140px}
.th .st{font-weight:700;font-size:13px;margin-top:2px;white-space:nowrap}
.th .nt{color:var(--ink2);text-align:center;min-height:36px}
.th .bar{width:100%;height:5px;border-radius:3px;background:rgba(30,43,54,.1);margin-top:auto}.th .bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.galT{position:absolute;left:34px;bottom:326px;font-size:16px;color:var(--ink2);display:flex;gap:18px;align-items:center}
.galT i{display:inline-block;width:18px;height:12px;border:2px dashed #C99A00;border-radius:3px;vertical-align:-1px;margin-right:4px}
.caster{left:40px;top:500px}
</style></head>
<body><div id="stage"><div id="view"></div></div>
<script>
document.getElementById('css').textContent = L.CSS;
const Y = L.Y, H = L.H, me0 = L.WORLDS[L.YOU - 1];
// 処理の記録（本番は実際の呼び出しのログから組む。ここでは engine.simulate の実値を表示）
const st = { spec: { ...Y.baseSpec(H), kitchen: true, exterior: 'min' }, company: 'C', principal: L.WORLDS[4].principal, household: H, loanDeadlineLeft: 17 };
const sim = Y.simulate(st, { borrowAdd: 60, spec: { window: 'triple' } });
function trace() {
  return `<div class="trace"><div class="t0">いま起きたこと<br>（記録から）</div>
    <div class="bd cl"><small>Claude・読み替え</small><b>借入 +60万／南の窓をトリプル</b></div><div class="ar">→</div>
    <div class="bd en"><small>エンジン・見積</small><b>差額 +${sim.diff}万円</b></div><div class="ar">→</div>
    <div class="bd en"><small>エンジン・審査</small><b>返済負担率 ${sim.loan.ratio}%</b></div><div class="ar">→</div>
    <div class="bd en"><small>エンジン・工程</small><b>+${sim.days}日</b></div><div class="ar">→</div>
    <div class="bd ok"><small>判定</small><b>${sim.verdict}</b></div></div>`;
}
L.mount(p => {
  const list = L.worldsAt(p), me = list[L.YOU - 1], sc = L.scene(p);
  const others = list.filter(x => x.w.no !== L.YOU);
  // 同じ選択をした世界：分かれ道3まで進んでいれば、あなたと同じ側（bit3）の世界を示す
  const same = n => p >= 3 && L.WORLDS[n - 1].bits[2] === me0.bits[2] && L.WORLDS[n - 1].bits[1] === me0.bits[1];
  const sc2 = Math.floor(p) === 3 ? { ...sc, log: [...sc.log.slice(0, 2), ['me', '主な仕様の見積で進めたい。でも、南の窓だけは、借入を少し増やしてでもいいものにしたい。'], ['C', `確かめました。差額は${sim.diff}万円、審査の負担率は${sim.loan.ratio}%で枠の内です。本審査のやり直しに${sim.days}日かかります。`]], opts: ['この条件で進める', 'もう少し考える'] } : sc;
  document.getElementById('view').innerHTML = `
  <div class="top"><div class="logo">ゆくすいえ</div>${L.progressBar(p)}</div>
  <div style="position:absolute;left:1150px;top:96px">${L.clocks(p)}</div>
  <div class="hero">
    <div class="lab"><span class="no">07</span>あなたの家　${L.coTag('C', 28)}Cデザイン</div>
    <div class="ph">${L.STEPS[Math.floor(p)]}<br><span style="font-size:14px">34坪・総二階　箱型の屋根</span></div>
    ${L.bigHouse(me.w, me.stage, { ghost: me.ghost })}
  </div>
  ${trace()}
  <div class="right">${L.chatHTML(sc2)}</div>
  ${L.castOf(sc)}
  <div class="galT"><span>ほかの15の世界（同じ日）</span>${p >= 3 ? '<span><i></i>あなたと同じ選択をした世界</span>' : ''}</div>
  <div class="gal">${others.map(x => `<div class="th ${same(x.w.no) ? 'same' : ''}"><div class="hd"><span>${String(x.w.no).padStart(2, '0')}</span>${L.coTag(x.w.company, 20)}</div>${L.thumb(x)}<div class="st">${L.STEPS_S[Math.floor(x.s)]}</div><div class="nt">${x.note}</div><div class="bar"><i style="width:${x.s / 11 * 100}%"></i></div></div>`).join('')}</div>`;
});
</script></body></html>
