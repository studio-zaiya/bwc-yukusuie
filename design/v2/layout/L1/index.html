<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>L1 自分の家のアップ＋ギャラリー</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../../../../app/engine.js"></script><script src="../../../../app/iso.js"></script><script src="../common.js"></script>
<style id="css"></style>
<style>
.top{position:absolute;left:40px;right:40px;top:22px;display:flex;align-items:center;gap:26px}
.logo{font-family:var(--fr);font-weight:900;font-size:30px;white-space:nowrap}
.top .pbar{flex:1}
.clks{position:absolute;left:40px;top:96px}
.hero{position:absolute;left:30px;top:146px;width:1090px;height:570px;background:linear-gradient(#DDF0FA,#F4FAFD 52%,#F3E7CF 52.1%);border-radius:22px;overflow:hidden}
.hero svg{position:absolute;left:150px;top:10px;width:780px;height:540px}
.hero .lab{position:absolute;left:28px;top:22px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.hero .no{font-family:var(--fr);font-weight:900;font-size:44px}
.hero .ph{position:absolute;right:26px;top:24px;font-size:18px;color:var(--ink2);text-align:right;line-height:1.5}
.right{position:absolute;left:1150px;top:146px;width:730px;height:570px}
.right .chat{height:100%}
.gal{position:absolute;left:30px;right:30px;bottom:24px;height:300px;display:grid;grid-template-columns:repeat(15,1fr);gap:8px}
.th{background:#fff;border:1.5px solid rgba(30,43,54,.14);border-radius:12px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;font-size:13px;line-height:1.35;overflow:hidden}
.th .hd{display:flex;align-items:center;justify-content:space-between;width:100%;font-weight:700;font-size:16px}
.th svg{width:100%;height:150px}
.th .st{font-weight:700;font-size:13px;margin-top:2px;white-space:nowrap}
.th .nt{color:var(--ink2);text-align:center;min-height:36px}
.th .bar{width:100%;height:5px;border-radius:3px;background:rgba(30,43,54,.1);margin-top:auto}.th .bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.galT{position:absolute;left:34px;bottom:332px;font-size:17px;color:var(--ink2)}
.caster{left:44px;top:600px}
</style></head>
<body><div id="stage"><div id="view"></div></div>
<script>
document.getElementById('css').textContent = L.CSS;
L.mount(p => {
  const list = L.worldsAt(p), me = list[L.YOU - 1], sc = L.scene(p);
  const others = list.filter(x => x.w.no !== L.YOU);
  document.getElementById('view').innerHTML = `
  <div class="top"><div class="logo">ゆくすいえ</div>${L.progressBar(p)}</div>
  <div class="hero">
    <div class="lab"><span class="no">07</span>あなたの家　${L.coTag('C', 28)}Cデザイン</div>
    <div class="ph">${L.STEPS[Math.floor(p)]}<br><span style="font-size:15px">34坪・総二階　箱型の屋根</span></div>
    ${L.bigHouse(me.w, me.stage, { ghost: me.ghost })}
  </div>
  <div class="right">${L.chatHTML(sc)}</div>
  ${L.castOf(sc)}
  <div class="galT">ほかの15の世界（同じ日）</div>
  <div class="gal">${others.map(x => `<div class="th"><div class="hd"><span>${String(x.w.no).padStart(2, '0')}</span>${L.coTag(x.w.company, 20)}</div>${L.thumb(x)}<div class="st">${L.STEPS_S[Math.floor(x.s)]}</div><div class="nt">${x.note}</div><div class="bar"><i style="width:${x.s / 11 * 100}%"></i></div></div>`).join('')}</div>
  <div style="position:absolute;left:1150px;top:96px">${L.clocks(p)}</div>`;
});
</script></body></html>
