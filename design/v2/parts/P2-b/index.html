<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2-b 汎用AIと伝え忘れのメールを書く</title><link rel="stylesheet" href="../_shared/common.css">
<style>
.lot{position:absolute;left:40px;top:100px;width:560px;height:460px;border-radius:20px;overflow:hidden;background:linear-gradient(#F6E7D3,#FBF3E7 42%,var(--ground) 42.1%);border:1.5px solid var(--line)}
.ai{position:absolute;left:40px;top:590px;width:560px}
.mail{position:absolute;left:640px;top:100px;width:1240px;height:760px}
.mail .hdr div{display:grid;grid-template-columns:90px 1fr;font-size:20px;padding:12px 4px;border-bottom:1px solid var(--line)}
.mail .hdr b{color:var(--ink2);font-weight:400}
.mail .bd{font-size:22px;line-height:1.8;padding:20px 6px;min-height:250px}
.sent{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.reply{margin-top:20px;padding:20px 24px;background:#fff;border:1.5px solid var(--ink);border-radius:16px;font-size:21px;line-height:1.7}
.aitag{display:inline-block;font-size:14px;border:1.5px solid var(--ink2);color:var(--ink2);border-radius:6px;padding:1px 8px;margin-right:8px}
</style></head><body><div id="stage"></div>
<script src="../../../../app/engine.js"></script><script src="../../../../app/iso.js"></script><script src="../_shared/parts.js"></script>
<script>
document.getElementById('stage').innerHTML = UI.progress(1) + `
<div class="lot">${UI.myLot(0, { ghost: { w: 70, d: 56, h: 40 } })}<div class="abs" style="left:16px;top:14px"><span class="chip">19日目・夜</span></div></div>
<div class="ai card" style="padding:22px 24px">
  <div style="font-size:16px;color:var(--ink2);margin-bottom:8px"><span class="aitag">くらしのAI</span>家族の予定と、ちょっとした相談</div>
  <div style="font-size:21px;line-height:1.65">今日の打ち合わせ、おつかれさまでした。伝え忘れたことはありませんか？ メモから下書きを作りました。</div>
  <div class="input" style="margin-top:16px"><div class="box ph" style="font-size:19px">思いついたことを、ひとこと…</div></div>
</div>
<div class="mail card" style="padding:26px 36px">
  <div class="hdr"><div><b>宛先</b><span><span class="co circle" style="width:26px;height:26px;font-size:13px">C</span>　Cデザイン　佐々木さま</span></div><div><b>件名</b><span>本日の打ち合わせのお礼と、追加のお願い</span></div></div>
  <div class="bd">本日はありがとうございました。言い忘れたことを送ります。<br>・リビングのテレビは、壁に掛けたいです。<br>・書斎に、LANの配線をお願いします。<br>・洗面と脱衣は、分けられたらうれしいです。</div>
  <div class="label">同じ内容を送る会社</div>
  <div class="sent"><span class="chip">Aハウス　送信済み</span><span class="chip">Bハウス　送信済み</span><span class="chip">D工務店　送信済み</span></div>
  <div style="display:flex;gap:12px"><div class="btn">送る</div><div class="btn ghost">もう少し考える</div></div>
  <div class="reply"><div class="label" style="margin-bottom:6px">佐々木（Cデザイン）からの返信　翌日 9:05</div>承知しました。テレビの下地と配管は、図面に入れておきます。<br>ひとつ伺わせてください。<b>洗濯物は、どこに干されますか？</b> 外か、室内か、乾燥機かで、洗面の広さが変わります。</div>
</div>
${UI.cast(['sasaki'], { left: 1680 })}`;
</script></body></html>
