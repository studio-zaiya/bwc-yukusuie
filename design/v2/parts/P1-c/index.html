<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>P1-c 担当者のメモが並ぶヒアリング</title><link rel="stylesheet" href="../_shared/common.css">
<style>
.lot{position:absolute;left:40px;top:96px;width:520px;height:420px;border-radius:20px;overflow:hidden;background:linear-gradient(#DDEFF8,#F4FAFD 42%,var(--ground) 42.1%);border:1.5px solid var(--line)}
.chatw{position:absolute;left:600px;top:96px;width:700px;height:870px}
.memo{position:absolute;left:1340px;top:96px;width:540px;height:760px;background:#FFFDF6;border:1px solid #D9D2C5;box-shadow:0 10px 26px rgba(30,43,54,.12);padding:28px 32px;
  background-image:repeating-linear-gradient(#FFFDF6 0 43px,#E7E0D2 43px 44px);transform:rotate(1.2deg)}
.memo h3{font-size:22px;margin-bottom:4px}.memo .sub{font-size:14px;color:var(--ink2);margin-bottom:20px}
.memo .l{font-family:"Hiragino Maru Gothic ProN","Zen Maru Gothic",sans-serif;font-size:22px;color:#2C3E66;line-height:44px}
.sumq{position:absolute;left:40px;top:540px;width:520px}
.sumq .row{display:flex;justify-content:space-between;font-size:19px;padding:10px 4px;border-bottom:1px solid var(--line)}
</style></head><body><div id="stage"></div>
<script src="../../../../app/engine.js"></script><script src="../../../../app/iso.js"></script><script src="../_shared/parts.js"></script>
<script>
const Y = YKS, H = Y.HOUSEHOLDS.t2;
document.getElementById('stage').innerHTML = UI.progress(1) + `
<div class="lot">${UI.myLot(0, { ghost: { w: 64, d: 52, h: 40 } })}<div class="abs" style="left:16px;top:14px"><span class="chip">15日目</span></div></div>
<div class="sumq"><div class="label" style="margin-bottom:8px">アンケートに書いたこと</div>
  <div class="row"><span>ご家族</span><span>4人（子ども2人）</span></div>
  <div class="row"><span>ご予算（総額）</span><span>4,000〜5,000万円</span></div>
  <div class="row"><span>世帯年収</span><span>${H.income}万円くらい</span></div>
  <div class="row"><span>土地</span><span>分譲地に申込み中</span></div></div>
<div class="chatw"><div class="label">D工務店・森社長との打ち合わせ（社長の自宅を兼ねた事務所）</div>
  <div class="chat" style="margin-top:18px">
    <div class="msg"><small>森（D工務店）</small>まあ座って。ご主人、どんな家がいい？</div>
    <div class="msg me kz"><small>かず</small>外観はミニマルに。1階に寝室。カーポートは2台分ほしいです。</div>
    <div class="msg"><small>森（D工務店）</small>できるできる。奥さんは？</div>
    <div class="msg me yu"><small>ゆう</small>木の家がいいです。庭で畑をしたくて。あと、テレビは壁に掛けたいです。</div>
    <div class="msg"><small>森（D工務店）</small>木なら任せて。うちは大工が自前だから。</div>
  </div>
  <div class="input" style="position:absolute;left:0;right:0;bottom:0"><div class="box ph">ほかに伝えること…</div><div class="btn">伝える</div></div></div>
<div class="memo"><h3>ヒアリングメモ</h3><div class="sub">D工務店　記入：森</div>
  <div class="l">かず様・ゆう様　4人</div><div class="l">予算 4〜5千万</div><div class="l">外観すっきり／1F寝室</div><div class="l">カーポート2台</div><div class="l">木の家（大工手刻み可）</div><div class="l">庭・畑</div><div class="l" style="color:#B5AEA3">―</div></div>
${UI.cast(['mori'], { left: 1500, bubble: '木なら任せて。', bubbleLeft: -120 })}`;
</script></body></html>
