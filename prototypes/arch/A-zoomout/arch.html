<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>仕組み図 案A 1軒から引く</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
html,body{margin:0;height:100%;background:#E9EEF0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Zen Kaku Gothic New",sans-serif;color:#1E2B36}
#wrap{position:fixed;left:0;right:0;top:0;bottom:56px;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;box-shadow:0 10px 40px rgba(30,43,54,.15)}
canvas{display:block;width:1920px;height:1080px}
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-top:1px solid #E2DCCF;font-size:14px}
#bar button{font:inherit;font-weight:700;border:1px solid #E2DCCF;background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer}
#bar input{flex:1}
#time{font-variant-numeric:tabular-nums;min-width:100px;text-align:right}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div></div>
<div id="bar"><button id="play" type="button">一時停止</button><input id="seek" type="range" min="0" step="0.01" value="0" aria-label="再生位置"><span id="time">0.0 秒</span></div>
<script>
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}
const W=1920,H=1080,DUR=12;window.DUR=DUR;
const cv=document.getElementById('c'),X=cv.getContext('2d');
const FONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Zen Kaku Gothic New",sans-serif';
const MARU='"Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans",sans-serif';
const C={paper:'#FFFAF0',sky:'#CFEBFA',ground:'#F3E7CF',grass:'#9BD27A',ink:'#1E2B36',ink2:'#6B6358',kazu:'#E8701F',yuu:'#1C8DCC',gold:'#F2C230',goldT:'#8C6A00',green:'#5FA94A',lot:'#D9CDB4'};
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,u)=>a+(b-a)*u;
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},eo=x=>1-Math.pow(1-clamp(x),3);
function mix(h1,h2,u){const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);const r=Math.round(lerp(a>>16,b>>16,u)),g=Math.round(lerp(a>>8&255,b>>8&255,u)),bl=Math.round(lerp(a&255,b&255,u));return'#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1)}
function tones(c){return[mix(c,'#FFFFFF',.22),c,mix(c,'#231A2C',.22)]}

// ---------- 等角の投影 ----------
const S=90,K=0.866,OX=960,OY=150;
const P=(x,y,z)=>[OX+(x-y)*K*S,OY+(x+y)*.5*S-z*S];
function poly(pts,fill,stroke,lw){X.beginPath();pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.closePath();if(fill){X.fillStyle=fill;X.fill()}if(stroke){X.strokeStyle=stroke;X.lineWidth=lw||1;X.stroke()}}
function box(x,y,z,w,d,h,col,a){const[t,l,r]=tones(col);X.save();X.globalAlpha*=a==null?1:a;
  poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],l);
  poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],r);
  poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],t);X.restore()}
// 窓（+y面と+x面に）
function winY(x0,y,z0,w,h,col){poly([P(x0,y,z0),P(x0+w,y,z0),P(x0+w,y,z0+h),P(x0,y,z0+h)],col)}
function winX(x,y0,z0,w,h,col){poly([P(x,y0,z0),P(x,y0+w,z0),P(x,y0+w,z0+h),P(x,y0,z0+h)],col)}

// ---------- 16の世界 ----------
const FIN=['#F7F4EC','#C98B55','#9AA6AE','#B5654A','#E9D8B6','#5B6470','#F2EFE6','#D7B98E','#8FA7B8','#EFE7DA','#A86F4C','#C9CED2','#F4E3C8','#7D8A8F','#E6D2B5','#BFA07A'];
const ROOF=['gable','flat','shed','gable','flat','gable','shed','flat','gable','gable','flat','shed','gable','flat','gable','shed'];
const RC=['#4A5560','#8E3B2E','#3E6E8E','#5B4A3E','#4A5560','#2F4858','#7A5B44','#4A5560','#8E3B2E','#3E6E8E','#4A5560','#5B4A3E','#2F4858','#4A5560','#7A5B44','#3E6E8E'];
const DETAIL=new Set([2,6,10,14]); // 世界03・07・11・15（0始まり）
const WORLDS=[];for(let i=0;i<16;i++){const r=Math.floor(i/4),c=i%4;WORLDS.push({i,id:String(i+1).padStart(2,'0'),x:c*1.25,y:r*1.25,cx:c*1.25+.5,cy:r*1.25+.5,det:DETAIL.has(i),empty:i===2})}
const ME=WORLDS[6];
const AGZ=-1.6,PLZ=-3.2;

function house(w,a){
  const x=w.x+.16,y=w.y+.16,bw=.68,bd=.62,two=(w.i%3)!==1;const h=two?.72:.44;const col=FIN[w.i];
  if(w.empty){ // 更地：土と花、仮囲いはなし（明るい場所として）
    X.save();X.globalAlpha*=a;poly([P(w.x+.12,w.y+.12,0),P(w.x+.88,w.y+.12,0),P(w.x+.88,w.y+.88,0),P(w.x+.12,w.y+.88,0)],C.lot);
    for(let k=0;k<9;k++){const p=P(w.x+.2+((k*37)%60)/100,w.y+.2+((k*53)%60)/100,0);X.fillStyle=k%2?'#F6D36B':'#FFFFFF';X.beginPath();X.arc(p[0],p[1],2.6,0,7);X.fill()}
    X.restore();return}
  box(x,y,0,bw,bd,h,col,a);
  X.save();X.globalAlpha*=a;
  const wc='#BFE3F5';winY(x+.1,y+bd,.12,.18,.16,wc);winY(x+.38,y+bd,.12,.2,.16,wc);if(two){winY(x+.1,y+bd,.44,.16,.14,wc);winY(x+.4,y+bd,.44,.16,.14,wc)}
  winX(x+bw,y+.14,.12,.16,.16,wc);if(two)winX(x+bw,y+.34,.44,.16,.14,wc);
  const rt=ROOF[w.i],rc=RC[w.i],[t,l,r]=tones(rc);
  if(rt==='gable'){const rz=h,rh=.26;
    poly([P(x-.03,y-.03,rz),P(x+bw+.03,y-.03,rz),P(x+bw+.03,y+bd/2,rz+rh),P(x-.03,y+bd/2,rz+rh)],t);
    poly([P(x+bw+.03,y-.03,rz),P(x+bw+.03,y+bd+.03,rz),P(x+bw+.03,y+bd/2,rz+rh)],mix(col,'#231A2C',.18));
    poly([P(x-.03,y+bd+.03,rz),P(x+bw+.03,y+bd+.03,rz),P(x+bw+.03,y+bd/2,rz+rh),P(x-.03,y+bd/2,rz+rh)],l);
  }else if(rt==='shed'){const rz=h;
    poly([P(x-.03,y-.03,rz+.22),P(x+bw+.03,y-.03,rz+.22),P(x+bw+.03,y+bd+.03,rz),P(x-.03,y+bd+.03,rz)],l);
    poly([P(x+bw+.03,y-.03,rz),P(x+bw+.03,y+bd+.03,rz),P(x+bw+.03,y-.03,rz+.22)],mix(col,'#231A2C',.18));
  }else{ // 陸屋根：薄いパラペットのみ、中央に何も置かない
    box(x,y,h,bw,bd,.05,mix(col,'#FFFFFF',.1),1);
    poly([P(x+.05,y+.05,h+.05),P(x+bw-.05,y+.05,h+.05),P(x+bw-.05,y+bd-.05,h+.05),P(x+.05,y+bd-.05,h+.05)],mix(rc,'#FFFFFF',.35));
  }
  X.restore();
}
function tile(w,a){X.save();X.globalAlpha*=a;
  poly([P(w.x,w.y+1,-.1),P(w.x+1,w.y+1,-.1),P(w.x+1,w.y+1,0),P(w.x,w.y+1,0)],mix(C.ground,'#231A2C',.1));
  poly([P(w.x+1,w.y,-.1),P(w.x+1,w.y+1,-.1),P(w.x+1,w.y+1,0),P(w.x+1,w.y,0)],mix(C.ground,'#231A2C',.2));
  poly([P(w.x,w.y,0),P(w.x+1,w.y,0),P(w.x+1,w.y+1,0),P(w.x,w.y+1,0)],C.grass);
  poly([P(w.x+.08,w.y+.08,0),P(w.x+.92,w.y+.08,0),P(w.x+.92,w.y+.92,0),P(w.x+.08,w.y+.92,0)],C.ground);
  X.restore()}

// ---------- 線と光の点 ----------
function seg(a,b,col,lw,al,dash){X.save();X.globalAlpha*=al;X.strokeStyle=col;X.lineWidth=lw;X.lineCap='round';if(dash)X.setLineDash(dash);X.beginPath();X.moveTo(a[0],a[1]);X.lineTo(b[0],b[1]);X.stroke();X.restore()}
function pulse(a,b,t,per,ph,col,r,al){const u=((t/per+ph)%1+1)%1;const p=[lerp(a[0],b[0],u),lerp(a[1],b[1],u)];X.save();X.globalAlpha*=al*Math.sin(u*Math.PI);X.fillStyle=col;X.beginPath();X.arc(p[0],p[1],r,0,7);X.fill();X.restore()}
function dot(p,r,fill,stroke,lw,al){X.save();X.globalAlpha*=al;X.beginPath();X.arc(p[0],p[1],r,0,7);if(fill){X.fillStyle=fill;X.fill()}if(stroke){X.strokeStyle=stroke;X.lineWidth=lw;X.stroke()}X.restore()}
function txt(s,x,y,size,o={}){X.save();X.globalAlpha*=o.a==null?1:o.a;X.fillStyle=o.c||C.ink;X.font=`${o.w||700} ${size}px ${o.f||FONT}`;X.textAlign=o.al||'left';X.textBaseline=o.bl||'alphabetic';X.fillText(s,x,y);X.restore()}
function card(x,y,w,h,o={}){X.save();X.globalAlpha*=o.a==null?1:o.a;X.beginPath();X.roundRect(x,y,w,h,o.r||14);X.fillStyle=o.fill||'#FFFFFF';X.fill();if(o.stroke){X.strokeStyle=o.stroke;X.lineWidth=o.lw||2;if(o.dash)X.setLineDash(o.dash);X.stroke()}X.restore()}
function arrow(pts,col,lw,al,dash,prog){X.save();X.globalAlpha*=al;X.strokeStyle=col;X.fillStyle=col;X.lineWidth=lw;X.lineCap='round';X.lineJoin='round';if(dash)X.setLineDash(dash);
  const L=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(d);tot+=d}
  let rem=tot*(prog==null?1:prog);X.beginPath();X.moveTo(pts[0][0],pts[0][1]);let end=pts[0],prev=pts[0];
  for(let i=1;i<pts.length&&rem>0;i++){const u=Math.min(1,rem/L[i-1]);end=[lerp(pts[i-1][0],pts[i][0],u),lerp(pts[i-1][1],pts[i][1],u)];prev=pts[i-1];X.lineTo(end[0],end[1]);rem-=L[i-1]}
  X.stroke();X.setLineDash([]);const ang=Math.atan2(end[1]-prev[1],end[0]-prev[0]);X.beginPath();X.moveTo(end[0],end[1]);X.lineTo(end[0]-12*Math.cos(ang-.45),end[1]-12*Math.sin(ang-.45));X.lineTo(end[0]-12*Math.cos(ang+.45),end[1]-12*Math.sin(ang+.45));X.closePath();X.fill();X.restore()}
// モデルの格：上位＝塗り、中位＝輪、軽量＝小さな点
function tier(kind,x,y,al){if(kind==='上位')dot([x,y],9,C.ink,null,0,al);else if(kind==='中位')dot([x,y],8,'#FFFFFF',C.ink,3,al);else dot([x,y],4.5,C.ink,null,0,al)}
function roleCard(x,y,w,title,kind,al,o={}){card(x,y,w,72,{a:al,stroke:o.stroke||'#D8D2C4',lw:o.lw||2,dash:o.dash,fill:o.fill});tier(kind,x+28,y+36,al);txt(title,x+50,y+33,26,{a:al});txt(kind+'モデル'+(o.note?'・'+o.note:''),x+50,y+58,17,{w:500,c:C.ink2,a:al})}

// ---------- 場面 ----------
function scene(t,sc){
  const showUnder=eo((t-0.9)/1.2),groundA=lerp(1,.78,eio((t-1.2)/2.2));
  const lod=clamp((sc-1.3)/.6); // 寄りのときだけ見せる細部
  // 計算エンジンの板
  const plA=eo((t-2.4)/1.6);
  if(plA>0){X.save();X.globalAlpha=plA;
    poly([P(-.45,-.45,PLZ),P(5.2,-.45,PLZ),P(5.2,5.2,PLZ),P(-.45,5.2,PLZ)],C.ink);
    poly([P(5.2,-.45,PLZ),P(5.2,5.2,PLZ),P(5.2,5.2,PLZ-.18),P(5.2,-.45,PLZ-.18)],'#141D25');
    poly([P(-.45,5.2,PLZ),P(5.2,5.2,PLZ),P(5.2,5.2,PLZ-.18),P(-.45,5.2,PLZ-.18)],'#18222B');
    // 板の上の格子
    X.globalAlpha=plA*.18;for(let k=0;k<=9;k++){const u=-.45+k*.628;seg(P(u,-.45,PLZ),P(u,5.2,PLZ),'#FFFFFF',1,1);seg(P(-.45,u,PLZ),P(5.2,u,PLZ),'#FFFFFF',1,1)}
    X.restore();
  }
  // 地面（区画）と家：奥から順に
  const order=[...WORLDS].sort((a,b)=>(a.x+a.y)-(b.x+b.y));
  order.forEach(w=>{tile(w,1);house(w,1)});
  // 各世界のエージェントと配線
  WORLDS.forEach((w,k)=>{const base=P(w.cx,w.cy,-.1),node=P(w.cx,w.cy,AGZ),pl=P(w.cx,w.cy,PLZ);
    const a=showUnder*eo((t-1.1-(w===ME?0:.9+k*.05))/.8);if(a<=0)return;
    seg(base,node,'#FFFFFF',w.det?6:4,a*.7);seg(base,node,C.ink,w.det?2.4:1.5,a*.75);seg(node,pl,'#FFFFFF',w.det?5:3.5,a*.5*plA);seg(node,pl,C.ink,w.det?2.2:1.4,a*.55*plA);
    pulse(base,node,t,1.4,k*.17,w.det?C.yuu:C.kazu,w.det?4.5:3,a);
    if(plA>0)pulse(node,pl,t,1.7,k*.23+.5,C.kazu,3.5,a*plA);
    if(w.det){ // 詳しく動かす世界：担当者役（中位）のまわりに登場人物
      const actors=[['担当者',C.ink],['親',C.kazu],['SNS',C.yuu],['アシスタントAI',C.green]];
      actors.forEach((ac,j)=>{const ang=-Math.PI/2+j*Math.PI/2+.4,pp=[node[0]+Math.cos(ang)*34,node[1]+Math.sin(ang)*20];
        seg(node,pp,ac[1],1.6,a*.8);dot(pp,5,ac[1],'#FFFFFF',1.5,a);
        if(w===ME){const la=a*lod;if(la>0)txt(ac[0],pp[0]+(Math.cos(ang)>0?9:-9),pp[1]+4,11,{al:Math.cos(ang)>0?'left':'right',a:la,w:700})}});
      dot(node,9,'#FFFFFF',C.ink,3,a);
    }else dot(node,4.5,C.ink,null,0,a);
    if(w===ME){const la=a*lod;if(la>0){txt('担当者役',node[0],node[1]+30,11,{al:'center',a:la});txt('中位モデル',node[0],node[1]+44,9,{al:'center',c:C.ink2,a:la,w:500})}}
  });
  if(plA>0){
    const mods=[['台帳','お金'],['時計','期日'],['判定','敷地・性能'],['記録','16世界の状態']];
    mods.forEach((m,k)=>{const a=plA*eo((t-3.2-k*.18)/.6),x=735+k*150,y=705;
      card(x-62,y-40,124,78,{a,fill:'#2A3A48',stroke:'#3E5262',lw:1.5,r:12});
      txt(m[0],x,y-4,28,{al:'center',c:'#FFFFFF',a,w:900});txt(m[1],x,y+24,16,{al:'center',c:'#C9D6DF',a,w:500});
      // 光の脈
      const g=.5+.5*Math.sin(t*4-k*1.3);dot([x+46,y-26],4,C.gold,null,0,a*g)});
    card(960-130,762,260,88,{a:plA*eo((t-3.6)/.6),fill:C.ink,r:14});
    txt('計算エンジン',960,800,34,{al:'center',c:'#FFFFFF',a:plA*eo((t-3.6)/.6),w:900,f:MARU});
    txt('数字はここで決まる',960,834,20,{al:'center',c:'#C9D6DF',a:plA*eo((t-3.8)/.6),w:500});
  }
  // 自分の世界07の札（寄りのときだけ）
  const tp=P(ME.cx,ME.cy,1.15);if(lod>0){card(tp[0]-24,tp[1]-17,48,22,{a:lod,fill:C.ink,r:11});txt('世界07',tp[0],tp[1]-1,11,{al:'center',c:'#FFFFFF',a:lod,w:700})}
  // 4世界と12世界の凡例（引いたとき）
  const lg=eo((t-5.8)/.8);if(lg>0){dot([560,132],9,'#FFFFFF',C.ink,3,lg);txt('詳しく動かす4世界',580,141,24,{a:lg});
    dot([1252,132],4.5,C.ink,null,0,lg);txt('概略の12世界',1268,141,24,{a:lg});}
  // 左：ユーザーの自由な答え → 読み替え → 変更の提案 → エンジン
  const la=eo((t-6.0)/.7);if(la>0){
    txt('あなたの言葉',96,286,22,{c:C.ink2,a:la});
    card(90,304,360,100,{a:la,stroke:C.gold,lw:3.5,dash:[14,9],fill:'#FFFDF5',r:16});
    X.save();X.globalAlpha=la;X.fillStyle=C.gold;X.beginPath();X.moveTo(118,330);X.lineTo(128,340);X.lineTo(118,350);X.lineTo(108,340);X.closePath();X.fill();X.restore();
    txt('自由な答え',140,348,26,{a:la});txt('「大きい窓だけ、トリプルに」',108,388,22,{w:500,c:C.goldT,a:la});
    const a2=eo((t-6.35)/.6);arrow([[270,410],[270,452]],C.ink,3,a2);
    roleCard(90,458,360,'読み替え役','上位',a2);
    const a3=eo((t-6.7)/.6);arrow([[270,536],[270,578]],C.ink,3,a3);
    card(90,584,360,72,{a:a3,stroke:'#D8D2C4',lw:2});txt('変更の提案',118,617,26,{a:a3});txt('言葉だけ。数字は書かない',118,642,17,{w:500,c:C.ink2,a:a3});
    const a4=eo((t-7.0)/.6);arrow([[450,620],[500,640],[560,664]],C.gold,4,a4,[12,8],eo((t-7.0)/.8));
  }
  // 右：2択の生成役 ⇄ 審査役、レポート
  const ra=eo((t-6.2)/.7);if(ra>0){
    txt('分かれ道をつくる',1476,286,22,{c:C.ink2,a:ra});
    roleCard(1470,304,360,'2択の生成役','上位',ra);
    roleCard(1470,430,360,'審査役','上位',ra,{note:'誘導を差し戻す'});
    // 往復の矢印
    const ra2=eo((t-6.6)/.6);arrow([[1810,380],[1830,404],[1810,428]],C.ink,3,ra2);arrow([[1490,428],[1470,404],[1490,380]],C.ink,3,ra2);
    arrow([[1470,338],[1420,330],[1352,350]],C.kazu,3.5,ra2,null,eo((t-6.8)/.7));
    txt('夫婦の言葉の2択',1392,312,18,{al:'center',c:'#B3541A',a:ra2,w:700});
    roleCard(1470,560,360,'1年後のレポート','上位',eo((t-6.9)/.6),{note:'本音の開示'});
    const a3=eo((t-7.1)/.6);
    card(1470,686,360,96,{a:a3,stroke:'#D8D2C4',lw:2,fill:'#FFFFFF'});
    txt('15世界を進める',1494,722,22,{a:a3});
    for(let k=0;k<15;k++)tier('軽量',1500+k*14,760,a3);
    txt('軽量モデル',1820,766,16,{al:'right',c:C.ink2,a:a3,w:500});
    // 格の凡例
    const a4=eo((t-7.3)/.6);tier('上位',1484,826,a4);txt('上位',1500,833,18,{a:a4,w:500});tier('中位',1556,826,a4);txt('中位',1572,833,18,{a:a4,w:500});tier('軽量',1626,826,a4);txt('軽量',1638,833,18,{a:a4,w:500});
    txt('すべて Claude',1830,833,18,{al:'right',a:a4,w:900});
    // 記録 → 画面
    arrow([[1300,760],[1380,812],[1460,860]],C.ink,3,a3,null,eo((t-7.3)/.7));txt('記録から、画面・再生・動画へ',1830,880,18,{al:'right',c:C.ink2,a:a3*eo((t-7.6)/.5),w:500});
  }
}

// ---------- カメラと字幕 ----------
const F0=(()=>{const p=P(ME.cx,ME.cy,.45);return[p[0],p[1]+6]})();
function render(t){
  X.setTransform(1,0,0,1,0,0);
  const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#D9F0FB');g.addColorStop(.55,'#F4F8F4');g.addColorStop(1,C.paper);X.fillStyle=g;X.fillRect(0,0,W,H);
  // カメラ：家に寄る → 家の下（担当者たちの層）へ下がる → 全体へ引く
  const nd=P(ME.cx,ME.cy,AGZ),F1=[(F0[0]+nd[0])/2+20,(F0[1]+nd[1])/2+10];
  const u1=eio((t-1.1)/2.0),u2=eio((t-3.4)/2.8);
  let sc=Math.exp(lerp(Math.log(4.2),Math.log(2.1),u1)),fx=lerp(F0[0],F1[0],u1),fy=lerp(F0[1],F1[1],u1);
  sc=Math.exp(lerp(Math.log(sc),0,u2));fx=lerp(fx,960,u2);fy=lerp(fy,540,u2);
  X.setTransform(sc,0,0,sc,960-fx*sc,540-fy*sc);
  scene(t,sc);
  X.setTransform(1,0,0,1,0,0);
  // 字幕（読み切れる時間を確保）
  const caps=[[.2,2.5,'1軒の家の下で、'],[2.5,4.6,'AIの担当者たちが動き、'],[4.6,6.6,'16の未来が、同時に進む。']];
  caps.forEach(([a,b,s])=>{const al=Math.min(eo((t-a)/.35),1-eo((t-(b-.3))/.3));if(al>0){X.save();X.globalAlpha=al;X.fillStyle='rgba(255,250,240,.9)';X.beginPath();X.roundRect(960-330,930,660,84,42);X.fill();X.restore();txt(s,960,987,46,{al:'center',a:al,w:900,f:MARU})}});
  const fa=eo((t-6.7)/.6);
  if(fa>0){txt('16の未来 × 9つのAIの役割 × 1つの計算エンジン',960,972,48,{al:'center',a:fa,w:900,f:MARU});
    txt('言葉は Claude、数字はエンジン。',960,1026,28,{al:'center',c:C.ink2,a:eo((t-7.4)/.6),w:700})}
  const ba=eo((t-7.0)/.6);if(ba>0){txt('ゆくすいえ',64,72,34,{a:ba,w:900,f:MARU});txt('YUKUSUIE: 16 unbuilt futures',64,102,18,{a:ba,c:C.ink2,w:500})}
}
window.render=render;

// ---------- 再生まわり ----------
const qs=new URLSearchParams(location.search);
const seek=document.getElementById('seek'),tl=document.getElementById('time'),pb=document.getElementById('play');
let playing=!qs.has('t'),t=parseFloat(qs.get('t')||'0'),last=null;
seek.max=DUR;
function sync(){seek.value=t;tl.textContent=`${t.toFixed(1)} / ${DUR.toFixed(1)} 秒`;pb.textContent=playing?'一時停止':'再生'}
function loop(now){if(playing){if(last!=null)t+=(now-last)/1000;if(t>=DUR)t=0}last=now;try{render(t)}catch(e){console.error(e)}sync();requestAnimationFrame(loop)}
pb.onclick=()=>{playing=!playing;last=null};seek.oninput=()=>{t=+seek.value;playing=false};
window.seekTo=v=>{t=v;playing=false};
function fit(){const s=Math.min(innerWidth/W,(innerHeight-56)/H);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
let started=false;function start(){if(started)return;started=true;window.READY=true;requestAnimationFrame(loop)}
(document.fonts?document.fonts.ready:Promise.resolve()).then(start,start);setTimeout(start,1500);
