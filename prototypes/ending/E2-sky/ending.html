<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>エンディング E2 空と光</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500&display=swap">
<style>
:root{--ui:#1e2b36;--uibg:#fffaf0;color-scheme:light}
html,body{margin:0;height:100%;background:#0e1626;overflow:hidden;font-family:"Hiragino Sans","Zen Kaku Gothic New",sans-serif}
#wrap{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;transform-origin:center center;position:absolute}
canvas{display:block;width:1920px;height:1080px}
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--uibg);color:var(--ui);font-size:14px}
#bar button{font:inherit;font-weight:700;border:1px solid #c9bfa9;background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer}
#bar input{flex:1}
#tt{font-variant-numeric:tabular-nums;min-width:5.5em}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div></div>
<div id="bar"><button id="play" type="button">一時停止</button><input id="scr" type="range" min="0" max="18" step="0.01" value="0" aria-label="時刻"><span id="tt">0.00秒</span></div>
<script>
// ===== 基本設定 =====
const W=1920,H=1080,DUR=18;
window.DUR=DUR;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const SERIF='"Hiragino Mincho ProN","Hiragino Mincho Pro","Zen Old Mincho","Yu Mincho",serif';
const SANS='"Hiragino Sans","Hiragino Kaku Gothic ProN","Zen Kaku Gothic New","Noto Sans JP",sans-serif';

// 乱数（種つき）
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mix(a,b,t){const A=hex(a),B=hex(b);return A.map((v,i)=>Math.round(lerp(v,B[i],t)))}
function rgba(c,a){return`rgba(${c[0]},${c[1]},${c[2]},${a})`}
function mixKeys(keys,t){ // keys: [[time,hex],...]
  for(let i=0;i<keys.length-1;i++){if(t<=keys[i+1][0]){const k=(t-keys[i][0])/(keys[i+1][0]-keys[i][0]);return mix(keys[i][1],keys[i+1][1],ease(clamp(k,0,1)))}}
  return hex(keys[keys.length-1][1]);
}

// ===== 時間の割り振り（18秒） =====
// 0-3.2   夜明け前の群青。16軒の影。
// 3.2-7   斜めの朝日。光の筋、雲の縁が金色に。家々に順に朝の光。「正解の家を、探していたのではなかった。」
// 7-11.2  1年がめぐる（春の花びら→夏の積雲→秋の葉→冬の澄んだ光→また春）。「大切にしたいことに、出会うための、16回。」
// 11.2-14 カメラが空へ。16本の光の筋が分かれ、さらに細い筋が増える。「未来は、16通りより多かった。」
// 14-18   明るい朝の空に題名「16軒目の、わが家」。16.2秒から注記。

// 空の色の移ろい（上端／地平線）
const SKY_TOP=[[0,'#0f1c3d'],[2.6,'#253f78'],[4.6,'#4f86c9'],[6.8,'#6aa8e6'],[8,'#79b9ee'],[9.1,'#5aa0e0'],[10.1,'#86a9cf'],[11.2,'#7fb4ea'],[13.5,'#8cc4f2'],[18,'#9fd0f6']];
const SKY_HOR=[[0,'#3a4a7a'],[2.4,'#c98a8a'],[3.6,'#f6b98a'],[5.2,'#fde2b8'],[7,'#fdf1d8'],[8,'#e8f5fb'],[9.1,'#f7d9b0'],[10.1,'#eaf1f6'],[11.2,'#fdeed8'],[14,'#fff6e6'],[18,'#fff8ec']];
// 季節の色合い（地面の草）
const GRASS=[[0,'#1b2a3a'],[3.6,'#5f7f53'],[7,'#8fbf6a'],[8,'#9cd16f'],[8.8,'#9cd16f'],[9.3,'#d29a4a'],[10.1,'#b8c3bf'],[11.2,'#a4d47a'],[18,'#a4d47a']];
// 太陽の位置（左下から上がる）
function sunPos(t){const k=easeOut(seg(t,2.2,9));return{x:lerp(260,520,k),y:lerp(900,250,k)}}

// ===== 雲（種つきの柔らかい塊の群れ） =====
const R=rng(16);
const clouds=[];
for(let i=0;i<14;i++){
  const cx=R()*2600-340,cy=lerp(120,620,R()),scale=lerp(.6,1.5,R()),speed=lerp(6,22,R());
  const puffs=[];const n=8+Math.floor(R()*10);
  for(let j=0;j<n;j++){puffs.push({dx:(R()-.5)*360*scale,dy:(R()-.6)*90*scale,r:lerp(50,130,R())*scale})}
  clouds.push({cx,cy,scale,speed,puffs,depth:cy/620});
}
// 雲は半分の解像度の別キャンバスに描き、ぼかしてから重ねる（輪郭のない、空気に溶ける雲）
const cl=document.createElement('canvas');cl.width=W/2;cl.height=H/2;const cg=cl.getContext('2d');
const toHex=a=>'#'+a.map(v=>v.toString(16).padStart(2,'0')).join('');
function drawClouds(t,sun,camY,warm){
  const top=mixKeys(SKY_TOP,t),hor=mixKeys(SKY_HOR,t);
  const day=seg(t,2.4,6);
  cg.setTransform(1,0,0,1,0,0);cg.clearRect(0,0,W/2,H/2);cg.setTransform(.5,0,0,.5,0,0);
  // 1層目：雲の本体（下側はやや空の色を帯びた影）
  for(const c of clouds){
    const par=.35+c.depth*.65;
    const x=((c.cx+t*c.speed*par+340)%2600)-340, y=c.cy+camY*par;
    const body=mix(toHex(mix('#cfd6e6',toHex(hor),.35)),toHex(top),.25+(1-day)*.45);
    cg.fillStyle=rgba(body,.55+c.depth*.25);
    for(const p of c.puffs){cg.beginPath();cg.arc(x+p.dx,y+p.dy+p.r*.12,p.r,0,7);cg.fill();}
  }
  // 2層目：太陽に向いた側の明るさ（本体を太陽側へ少しずらして重ねる）
  const rim=mix('#ffffff','#ffd29c',clamp(warm,0,1));
  for(const c of clouds){
    const par=.35+c.depth*.65;
    const x=((c.cx+t*c.speed*par+340)%2600)-340, y=c.cy+camY*par;
    const ang=Math.atan2(sun.y-y,sun.x-x);
    cg.fillStyle=rgba(rim,(.18+.62*day)*(.55+c.depth*.35));
    for(const p of c.puffs){cg.beginPath();cg.arc(x+p.dx+Math.cos(ang)*p.r*.22,y+p.dy+Math.sin(ang)*p.r*.22,p.r*.78,0,7);cg.fill();}
  }
  g.save();g.filter='blur(14px)';g.drawImage(cl,0,0,W,H);g.restore();
}

// ===== 丘（大気遠近の重なり） =====
function ridge(seed,baseY,amp,freq){const r=rng(seed);const ph=[r()*6,r()*6,r()*6];return x=>baseY+amp*(Math.sin(x*freq+ph[0])*.55+Math.sin(x*freq*2.3+ph[1])*.3+Math.sin(x*freq*5.1+ph[2])*.15)}
const RIDGES=[ridge(3,700,40,.0021),ridge(5,770,34,.0029),ridge(9,850,26,.004)];
function drawHills(t,camY){
  const hor=mixKeys(SKY_HOR,t),grass=mixKeys(GRASS,t),top=mixKeys(SKY_TOP,t);
  const far=['#7a8fb0','#6e8a86','#5c7a5a'];
  RIDGES.forEach((f,i)=>{
    const par=.5+i*.25;
    const k=[.72,.48,.22][i]; // 遠いほど空色へ
    const col=mix('#'+mix(far[i],'#'+grass.map(v=>v.toString(16).padStart(2,'0')).join(''),.5).map(v=>v.toString(16).padStart(2,'0')).join(''),'#'+hor.map(v=>v.toString(16).padStart(2,'0')).join(''),k);
    g.fillStyle=rgba(col,1);g.beginPath();g.moveTo(0,H+400);
    for(let x=0;x<=W;x+=24)g.lineTo(x,f(x)+camY*par);
    g.lineTo(W,H+400);g.fill();
  });
  // 手前の地面（16軒が並ぶ緩やかな斜面）
  const gy=x=>930-x*.04+Math.sin(x*.003)*14;
  g.fillStyle=rgba(grass,1);g.beginPath();g.moveTo(0,H+400);
  for(let x=0;x<=W;x+=24)g.lineTo(x,gy(x)+camY);
  g.lineTo(W,H+400);g.fill();
  return gy;
}

// ===== 16軒（少し抽象化した家） =====
const R2=rng(707);
const FIN=['#f3efe6','#c98b5e','#e8d9bf','#9aa6ad','#d9b48a','#eef2f4','#b36a4a','#d5cbb3','#7f9aa8','#efe3cf','#a7b59b','#e3c7a7','#c9d2d8','#d7a07a','#f0e6d2','#8ea0a0'];
const houses=[];
for(let i=0;i<16;i++){
  const roof=['gable','flat','shed','gable','gable','flat','shed','gable'][Math.floor(R2()*8)];
  houses.push({x:150+i*103+(R2()-.5)*26,w:lerp(58,80,R2()),h:lerp(42,62,R2()),roof,fin:FIN[i],tree:R2()>.45,two:R2()>.35});
}
function drawHouses(t,gy,camY,sun){
  const lit=seg(t,3.4,7.2); // 朝の光が左から順に当たる
  houses.forEach((hs,i)=>{
    const by=gy(hs.x)+camY+4;
    const x=hs.x,w=hs.w,h=hs.two?hs.h:hs.h*.7;
    const reach=clamp((lit*20-i*.9),0,1);
    const dark=[38,52,74];
    const fin=hex(hs.fin);
    const face=fin.map((v,j)=>Math.round(lerp(dark[j],v,.25+.75*reach)));
    const side=face.map(v=>Math.round(v*.78));
    // 影（太陽と反対側へ長く）
    const sl=lerp(0,1,reach)*clamp(1-(t-7)/6,.25,1);
    g.fillStyle=`rgba(30,40,60,${.18*sl})`;
    g.beginPath();g.moveTo(x,by);g.lineTo(x+w,by);g.lineTo(x+w+90*sl,by+6);g.lineTo(x+60*sl,by+6);g.fill();
    // 側面（右）と正面
    const sd=w*.28;
    g.fillStyle=rgba(side,1);g.beginPath();g.moveTo(x+w,by);g.lineTo(x+w+sd,by-sd*.35);g.lineTo(x+w+sd,by-h-sd*.35);g.lineTo(x+w,by-h);g.fill();
    g.fillStyle=rgba(face,1);g.fillRect(x,by-h,w,h);
    // 屋根
    const roofCol=hs.roof==='flat'?face.map(v=>Math.round(v*.9)):[Math.round(lerp(40,92,reach)),Math.round(lerp(48,96,reach)),Math.round(lerp(64,104,reach))];
    g.fillStyle=rgba(roofCol,1);
    if(hs.roof==='gable'){g.beginPath();g.moveTo(x-5,by-h);g.lineTo(x+w/2,by-h-w*.38);g.lineTo(x+w+5,by-h);g.fill();
      g.fillStyle=rgba(roofCol.map(v=>Math.round(v*.8)),1);g.beginPath();g.moveTo(x+w/2,by-h-w*.38);g.lineTo(x+w/2+sd,by-h-w*.38-sd*.35);g.lineTo(x+w+sd+5,by-h-sd*.35);g.lineTo(x+w+5,by-h);g.fill();}
    else if(hs.roof==='shed'){g.beginPath();g.moveTo(x-4,by-h+2);g.lineTo(x-4,by-h-w*.22);g.lineTo(x+w+sd+4,by-h-sd*.35);g.lineTo(x+w+4,by-h+2);g.fill();}
    else{ // 陸屋根：薄いパラペットだけ（煙突に見える突起は置かない）
      g.fillRect(x-2,by-h-6,w+4,6);g.beginPath();g.moveTo(x+w+2,by-h-6);g.lineTo(x+w+sd+2,by-h-6-sd*.35);g.lineTo(x+w+sd+2,by-h-sd*.35);g.lineTo(x+w+2,by-h);g.fill();}
    // 窓（昼の光を映す。灯りで「明るい家庭」を演出しない）
    const glass=mix('#3c4a63','#cfe6f5',reach);
    g.fillStyle=rgba(glass,1);
    const cols=Math.max(2,Math.floor(w/26));
    for(let k=0;k<cols;k++){const wx=x+8+k*(w-16)/cols;g.fillRect(wx,by-h*.45,(w-16)/cols-7,h*.22);if(hs.two)g.fillRect(wx,by-h*.85,(w-16)/cols-7,h*.18);}
    // 庭木
    if(hs.tree){const tx=x+w+sd+14,ty=by-2;const leaf=mixKeys(GRASS,t).map(v=>Math.round(v*.82));g.fillStyle=rgba([70,58,44],1);g.fillRect(tx-2,ty-18,4,18);g.fillStyle=rgba(leaf,1);g.beginPath();g.arc(tx,ty-26,15,0,7);g.fill();}
  });
}

// ===== 光の筋（太陽から斜めに） =====
function drawRays(t,sun){
  const a=seg(t,3.2,4.6)*(1-seg(t,10.5,12.5)*.7);
  if(a<=0)return;
  g.save();g.globalCompositeOperation='lighter';g.filter='blur(16px)';
  const r=rng(41);
  for(let i=0;i<14;i++){
    const ang=-.32+i*.075+Math.sin(t*.22+i*1.7)*.025+(r()-.5)*.03;
    const len=lerp(1400,2300,r()),wid=lerp(.012,.03,r());
    const gr=g.createLinearGradient(sun.x,sun.y,sun.x+Math.cos(ang)*len,sun.y+Math.sin(ang)*len);
    const al=lerp(.11,.22,r())*a*(.7+.3*Math.sin(t*.9+i));
    gr.addColorStop(0,`rgba(255,232,186,${al})`);gr.addColorStop(.55,`rgba(255,232,186,${al*.45})`);gr.addColorStop(1,'rgba(255,232,186,0)');
    g.fillStyle=gr;g.beginPath();g.moveTo(sun.x,sun.y);
    g.lineTo(sun.x+Math.cos(ang-wid)*len,sun.y+Math.sin(ang-wid)*len);
    g.lineTo(sun.x+Math.cos(ang+wid)*len,sun.y+Math.sin(ang+wid)*len);g.fill();
  }
  g.restore();
}
function drawSun(t,sun){
  const a=seg(t,2.2,3.6);
  if(a<=0)return;
  g.save();g.globalCompositeOperation='lighter';
  let gr=g.createRadialGradient(sun.x,sun.y,0,sun.x,sun.y,520);
  gr.addColorStop(0,`rgba(255,240,205,${.9*a})`);gr.addColorStop(.08,`rgba(255,224,170,${.55*a})`);gr.addColorStop(.35,`rgba(255,200,150,${.16*a})`);gr.addColorStop(1,'rgba(255,200,150,0)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);g.restore();
}

// ===== 光の粒・花びら・葉（閉じた式で決まる） =====
const R3=rng(99);
const motes=[...Array(90)].map(()=>({x:R3()*W,y:R3()*H,s:lerp(1.5,4,R3()),ph:R3()*6,sp:lerp(8,26,R3())}));
const petals=[...Array(70)].map(()=>({x:R3()*W*1.3,y:R3()*-H,s:lerp(6,12,R3()),ph:R3()*6,sp:lerp(110,190,R3()),dr:lerp(60,140,R3())}));
function drawMotes(t){
  const a=seg(t,3.6,5)*(1-seg(t,16,18)*.6);
  g.save();g.globalCompositeOperation='lighter';
  for(const m of motes){
    const x=(m.x+Math.sin(t*.4+m.ph)*30+t*m.sp*.3)%W,y=(m.y-t*m.sp+H*4)%H;
    const tw=.5+.5*Math.sin(t*2+m.ph);
    g.fillStyle=`rgba(255,236,190,${.5*a*tw})`;g.beginPath();g.arc(x,y,m.s,0,7);g.fill();
  }
  g.restore();
}
function drawPetals(t,camY){
  // 春（7.0-8.0, 11.2-）は花びら、秋（9.1-10.1）は葉
  const spring=seg(t,6.8,7.4)*(1-seg(t,8,8.4))+seg(t,11,11.6)*(1-seg(t,14.6,15.6));
  const autumn=seg(t,8.9,9.3)*(1-seg(t,9.9,10.3));
  if(spring<=0&&autumn<=0)return;
  for(const p of petals){
    const tt=t*1;
    const x=(p.x+Math.sin(tt*1.3+p.ph)*p.dr+tt*90)%(W*1.3)-W*.15;
    const y=((p.y+tt*p.sp)%(H+200)+H+200)%(H+200)-100+camY*.2;
    const rot=tt*2+p.ph;
    g.save();g.translate(x,y);g.rotate(rot);g.scale(1,Math.abs(Math.cos(tt*3+p.ph))*.8+.2);
    if(spring>0){g.fillStyle=`rgba(250,206,214,${.85*spring})`;g.beginPath();g.ellipse(0,0,p.s,p.s*.6,0,0,7);g.fill();}
    if(autumn>0){g.fillStyle=`rgba(214,128,58,${.85*autumn})`;g.beginPath();g.ellipse(0,0,p.s*1.1,p.s*.5,0,0,7);g.fill();}
    g.restore();
  }
}

// ===== 空に分かれていく光の筋（世界線の余韻） =====
const R4=rng(2026);
function branchPaths(){
  // 根元は地平線の1点。4回分かれて16本、そのあと細い筋が増える
  const root={x:960,y:1040};
  const out=[];
  function grow(p,depth,ang,idx){
    if(depth===4){out.push({p,ang,idx});return}
    const L=lerp(230,140,depth/4);
    for(const s of[-1,1]){
      const a=ang+s*lerp(.42,.16,depth/4)+(R4()-.5)*.06;
      const q={x:p.x+Math.cos(a)*L,y:p.y+Math.sin(a)*L,from:p,depth:depth+1};
      out.push({seg:[p,q],depth});
      grow(q,depth+1,a,idx*2+(s>0?1:0));
    }
  }
  grow(root,0,-Math.PI/2,0);
  return out;
}
const BR=branchPaths();
const TIPS=BR.filter(b=>b.p&&!b.seg);
const extra=[];
TIPS.forEach((tp,i)=>{const n=1+((i*7)%3);for(let k=0;k<n;k++){const a=tp.ang+(R4()-.5)*.9;const L=lerp(60,150,R4());extra.push({a:tp.p,b:{x:tp.p.x+Math.cos(a)*L,y:tp.p.y+Math.sin(a)*L},d:R4()})}});
function drawBranches(t,camY){
  const a=seg(t,11.2,11.8)*(1-seg(t,15.2,16.4)*.75);
  if(a<=0)return;
  g.save();g.translate(0,camY-1040+760);g.globalCompositeOperation='lighter';g.lineCap='round';
  const prog=seg(t,11.3,13);
  BR.forEach(b=>{if(!b.seg)return;const[p,q]=b.seg;
    const k=clamp(prog*4-b.depth,0,1);if(k<=0)return;
    const ex=lerp(p.x,q.x,easeOut(k)),ey=lerp(p.y,q.y,easeOut(k));
    g.strokeStyle=`rgba(255,246,226,${.75*a})`;g.lineWidth=lerp(5,2.4,b.depth/4);
    g.beginPath();g.moveTo(p.x,p.y);g.lineTo(ex,ey);g.stroke();
  });
  const ep=seg(t,12.9,14.2);
  extra.forEach(e=>{const k=clamp(ep*1.6-e.d*.6,0,1);if(k<=0)return;
    g.strokeStyle=`rgba(255,240,214,${.45*a})`;g.lineWidth=1.4;
    g.beginPath();g.moveTo(e.a.x,e.a.y);g.lineTo(lerp(e.a.x,e.b.x,easeOut(k)),lerp(e.a.y,e.b.y,easeOut(k)));g.stroke();});
  // 16の先端
  TIPS.forEach(tp=>{const k=clamp(prog*4-3.6,0,1);if(k<=0)return;
    const gr=g.createRadialGradient(tp.p.x,tp.p.y,0,tp.p.x,tp.p.y,16);gr.addColorStop(0,`rgba(255,250,235,${.9*a*k})`);gr.addColorStop(1,'rgba(255,250,235,0)');
    g.fillStyle=gr;g.beginPath();g.arc(tp.p.x,tp.p.y,16,0,7);g.fill();});
  g.restore();
}

// ===== 文字 =====
function textBlock(str,x,y,size,alpha,opt={}){
  if(alpha<=0)return;
  g.save();g.globalAlpha=alpha;g.font=`${opt.weight||500} ${size}px ${opt.font||SERIF}`;g.textAlign=opt.align||'center';g.textBaseline='middle';
  g.letterSpacing=opt.ls||'0.06em';
  // 明るい空の上でも読めるよう、墨の文字に紙色の柔らかい光をまとわせる
  g.shadowColor='rgba(255,250,240,.95)';g.shadowBlur=opt.glow||26;
  g.fillStyle=opt.color||'#22324a';
  for(let k=0;k<2;k++)g.fillText(str,x,y+(1-alpha)*10);
  g.restore();
}
function fade(t,a,b,c,d){return seg(t,a,b)*(1-seg(t,c,d))}

// ===== 1コマ =====
function render(t){
  t=clamp(t,0,DUR);
  const sun=sunPos(t);
  // カメラ：11.2秒から空へ見上げる（地面が下へ流れる）
  const camY=ease(seg(t,11,13.6))*520-ease(seg(t,14,15.6))*160;
  const top=mixKeys(SKY_TOP,t),hor=mixKeys(SKY_HOR,t);
  const sky=g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,rgba(top,1));sky.addColorStop(.72,rgba(hor,1));sky.addColorStop(1,rgba(hor,1));
  g.fillStyle=sky;g.fillRect(0,0,W,H);
  // 夜明け前の星（すぐ消える）
  const star=1-seg(t,1.2,3);
  if(star>0){const r=rng(5);for(let i=0;i<120;i++){const x=r()*W,y=r()*H*.6;g.fillStyle=`rgba(255,255,255,${star*(.3+.5*r())})`;g.fillRect(x,y,1.6,1.6)}}
  drawSun(t,sun);
  const warm=1-seg(t,6,8)+seg(t,8.9,9.6)*(1-seg(t,10,10.6))*.6;
  drawClouds(t,sun,camY*.4,clamp(warm,0,1));
  drawRays(t,sun);
  const gy=drawHills(t,camY);
  drawHouses(t,gy,camY,sun);
  drawPetals(t,camY);
  drawMotes(t);
  drawBranches(t,camY);
  // 季節の名残（冬：澄んだ白い光のヴェール）
  const winter=fade(t,9.9,10.2,10.6,11);
  if(winter>0){g.fillStyle=`rgba(255,255,255,${.18*winter})`;g.fillRect(0,0,W,H)}
  // 最後の明るさ（白く飛ばさず、紙のような暖かい白へ少しだけ）
  const end=seg(t,14,15.4)*.28;
  if(end>0){const gr=g.createRadialGradient(W/2,H*.42,0,W/2,H*.42,1100);gr.addColorStop(0,`rgba(255,250,238,${end})`);gr.addColorStop(1,'rgba(255,250,238,0)');g.fillStyle=gr;g.fillRect(0,0,W,H)}

  // 言葉（説明しすぎない。3行だけ）
  textBlock('正解の家を、探していたのではなかった。',W/2,360,58,fade(t,4.4,5.2,6.6,7.1));
  textBlock('大切にしたいことに、出会うための、16回。',W/2,360,58,fade(t,7.6,8.4,10.4,10.9));
  textBlock('未来は、16通りより多かった。',W/2,300,62,fade(t,12.6,13.3,14.2,14.7));
  // 題名
  const ti=seg(t,14.6,15.6);
  textBlock('16軒目の、わが家',W/2,430,128,ti,{weight:700,color:'#22324a',shadow:false,ls:'0.12em'});
  // 注記
  const no=seg(t,16.2,16.9);
  if(no>0){
    g.save();g.globalAlpha=no;g.fillStyle='rgba(255,250,240,.82)';
    const nw=1500,nh=96,nx=(W-nw)/2,ny=H-150;
    g.beginPath();g.roundRect(nx,ny,nw,nh,14);g.fill();
    g.fillStyle='#2a3646';g.font=`500 25px ${SANS}`;g.textAlign='center';g.textBaseline='middle';
    g.fillText('本作の制度・手続き・金額・期間などの設定は、体験のために簡略化しています。実際の家づくりでは、',W/2,ny+32);
    g.fillText('地域・金融機関・住宅会社によって異なります。登場する住宅会社・人物・団体はすべて架空です。',W/2,ny+66);
    g.restore();
  }
}
window.render=render;

// ===== 再生まわり =====
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/W,(innerHeight-56)/H);stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
const qs=new URLSearchParams(location.search);
let t0=performance.now(),playing=!qs.has('t'),cur=qs.has('t')?parseFloat(qs.get('t')):0;
const scr=document.getElementById('scr'),tt=document.getElementById('tt'),pb=document.getElementById('play');
function show(t){cur=t;render(t);scr.value=t.toFixed(2);tt.textContent=t.toFixed(2)+'秒'}
function loop(now){if(playing){const t=((now-t0)/1000)%DUR;show(t)}requestAnimationFrame(loop)}
pb.onclick=()=>{playing=!playing;pb.textContent=playing?'一時停止':'再生';if(playing)t0=performance.now()-cur*1000};
scr.oninput=()=>{playing=false;pb.textContent='再生';show(parseFloat(scr.value))};
if(!playing)pb.textContent='再生';
const start=()=>{show(cur);window.READY=true;requestAnimationFrame(loop)};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start,start);
setTimeout(()=>{if(!window.READY)start()},1500);
</script>
</body>
</html>
