<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>エンディング E4 1年後のひとコマ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{--paper:#FFFAF0;--ink:#1E2B36;--muted:#5F6B74;--line:#E7DCC8;color-scheme:light}
html,body{margin:0;height:100%;background:#E9E2D3;color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic",sans-serif}
.wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px}
.stage{width:min(100%,calc((100vh - 90px)*16/9));aspect-ratio:16/9;max-width:100%;box-shadow:0 6px 24px rgba(30,43,54,.18);background:var(--paper)}
canvas{width:100%;height:100%;display:block}
.ctl{display:flex;align-items:center;gap:10px;width:min(100%,960px);font-size:13px}
.ctl button{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 14px;cursor:pointer;color:var(--ink)}
.ctl input{flex:1;min-width:0}
.ctl span{font-variant-numeric:tabular-nums;color:var(--muted);min-width:7em;text-align:right}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage"><canvas id="cv" width="1920" height="1080"></canvas></div>
  <div class="ctl">
    <button id="pp" type="button">一時停止</button>
    <input id="sc" type="range" min="0" step="0.01" value="0" aria-label="時刻">
    <span id="tl">0.00 秒</span>
  </div>
</div>
<script>
// ===== 色（デザインコードに合わせる） =====
const C={paper:'#FFFAF0',sky:'#CFEBFA',sky2:'#EAF6FD',ground:'#F3E7CF',grass:'#9BD27A',grass2:'#7FBF5F',
  ink:'#1E2B36',kazu:'#E8701F',yuu:'#1C8DCC',gold:'#F2C230',wood:'#C98B5A',wood2:'#A86E43',white:'#FFFFFF',
  plaster:'#F6F1E7',gray:'#B9B4AA',skin:'#F2C9A5',hair:'#3A2E28',red:'#E2513B',pink:'#F4A6B8',green:'#5BA65A'};
const FONT_D='"Hiragino Maru Gothic ProN","Zen Maru Gothic","Hiragino Sans",sans-serif';
const FONT_B='"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic",sans-serif';
const W=1920,H=1080;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');

// ===== 道具 =====
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function fillRR(c,x,y,w,h,r,col){rr(c,x,y,w,h,r);c.fillStyle=col;c.fill()}
function sky(c,top=C.sky,bot=C.sky2){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,0,W,H)}
// 後ろ姿の人
function person(c,x,y,s,top,opt={}){
  c.save();c.translate(x,y);c.scale(s,s);
  const bob=opt.bob||0;c.translate(0,bob);
  // 脚
  c.fillStyle=opt.pants||'#4A5866';
  fillRR(c,-26,40,22,90,10,opt.pants||'#4A5866');fillRR(c,4,40,22,90,10,opt.pants||'#4A5866');
  // 胴
  fillRR(c,-40,-60,80,115,30,top);
  // 腕
  if(opt.armUp){c.save();c.translate(32,-45);c.rotate(-2.3);fillRR(c,-9,0,18,70,9,top);c.restore()}
  // 頭（後ろ）
  c.beginPath();c.arc(0,-92,36,0,Math.PI*2);c.fillStyle=C.skin;c.fill();
  c.beginPath();c.arc(0,-98,37,Math.PI*1.0,Math.PI*2.0);c.lineTo(37,-80);c.quadraticCurveTo(0,-64,-37,-80);c.closePath();c.fillStyle=opt.hair||C.hair;c.fill();
  c.restore();
}
// うさぎ
function rabbit(c,x,y,s,ph=0){
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='#FFFFFF';c.strokeStyle=C.gray;c.lineWidth=3;
  c.beginPath();c.ellipse(0,0,46,32,0,0,Math.PI*2);c.fill();c.stroke();
  c.beginPath();c.ellipse(36,-26,22,20,0,0,Math.PI*2);c.fill();c.stroke();
  c.save();c.translate(36,-40);c.rotate(-0.25+Math.sin(ph)*0.08);fillRR(c,-8,-48,14,50,7,'#FFFFFF');c.strokeRect;c.restore();
  c.save();c.translate(44,-40);c.rotate(0.15+Math.sin(ph+1)*0.08);fillRR(c,-6,-44,13,46,7,'#FFFFFF');c.restore();
  c.beginPath();c.arc(44,-28,3.5,0,Math.PI*2);c.fillStyle=C.ink;c.fill();
  c.beginPath();c.arc(-46,-4,10,0,Math.PI*2);c.fillStyle='#FFFFFF';c.fill();
  c.restore();
}
function leaf(c,x,y,s,rot,col){c.save();c.translate(x,y);c.rotate(rot);c.beginPath();c.ellipse(0,0,s,s*0.45,0,0,Math.PI*2);c.fillStyle=col;c.fill();c.restore()}
function gravel(c,x,y,w,h,seed,dens=0.004){const r=rng(seed);const n=Math.floor(w*h*dens);for(let i=0;i<n;i++){const gx=x+r()*w,gy=y+r()*h;c.beginPath();c.ellipse(gx,gy,3+r()*5,2+r()*3,r()*3,0,Math.PI*2);c.fillStyle=['#D8CDBA','#C9BDA8','#E6DDCD','#B8AC98'][Math.floor(r()*4)];c.fill()}}

// ===== 16のひとコマ（07は最後の場面） =====
const V={};
// 01 洗濯物
V[1]=(c,t)=>{sky(c);c.fillStyle=C.grass;c.fillRect(0,820,W,260);
  // 木の外壁
  c.fillStyle=C.wood;c.fillRect(0,0,620,840);c.strokeStyle=C.wood2;c.lineWidth=4;for(let y=30;y<840;y+=46){c.beginPath();c.moveTo(0,y);c.lineTo(620,y);c.stroke()}
  fillRR(c,140,220,330,380,8,'#DDEFF8');c.strokeStyle=C.white;c.lineWidth=14;c.strokeRect(140,220,330,380);
  // 物干し
  c.fillStyle='#8A8F94';c.fillRect(760,330,14,500);c.fillRect(1760,330,14,500);
  c.strokeStyle='#8A8F94';c.lineWidth=5;c.beginPath();c.moveTo(767,360);c.quadraticCurveTo(1265,410,1767,360);c.stroke();
  const items=[[880,C.kazu,'t'],[1040,C.white,'s'],[1200,C.yuu,'t'],[1360,C.gold,'s'],[1520,C.pink,'t'],[1650,C.white,'k']];
  items.forEach(([x,col,k],i)=>{const sw=Math.sin(t*3.2+i*0.9)*0.09;const y0=360+Math.sin((x-767)/1000*Math.PI)*45;
    c.save();c.translate(x,y0);c.rotate(sw);
    if(k==='t'){c.beginPath();c.moveTo(-70,0);c.lineTo(70,0);c.lineTo(100,50);c.lineTo(62,66);c.lineTo(60,190);c.lineTo(-60,190);c.lineTo(-62,66);c.lineTo(-100,50);c.closePath();c.fillStyle=col;c.fill()}
    else if(k==='s'){fillRR(c,-60,0,120,150,10,col);c.strokeStyle='#E0D8CA';c.lineWidth=3;rr(c,-60,0,120,150,10);c.stroke()}
    else{fillRR(c,-38,0,76,110,8,col);c.strokeStyle='#E0D8CA';c.lineWidth=3;rr(c,-38,0,76,110,8);c.stroke()}
    c.fillStyle='#6D7378';c.fillRect(-30,-8,10,16);c.fillRect(20,-8,10,16);c.restore()});
};
// 02 うさぎが庭を走る
V[2]=(c,t)=>{sky(c);c.fillStyle=C.grass;c.fillRect(0,560,W,520);
  const r=rng(2);for(let i=0;i<70;i++){const x=r()*W,y=600+r()*460;c.beginPath();c.arc(x,y,5+r()*5,0,Math.PI*2);c.fillStyle=['#FFFFFF','#F6E27A','#F4A6B8'][i%3];c.fill()}
  // 柵
  c.fillStyle=C.white;for(let x=-20;x<W+40;x+=70){fillRR(c,x,600,34,150,8,C.white)}c.fillRect(0,640,W,16);c.fillRect(0,700,W,16);
  const p=(t*0.55)%1;const x=lerp(260,1660,p);const hop=Math.abs(Math.sin(t*7))*90;
  c.beginPath();c.ellipse(x,930,70,14,0,0,Math.PI*2);c.fillStyle='rgba(30,43,54,.12)';c.fill();
  rabbit(c,x,900-hop,1.6,t*7);
};
// 03 更地に咲いた花と、通りがかる家族
V[3]=(c,t)=>{sky(c);c.fillStyle=C.ground;c.fillRect(0,600,W,480);
  c.fillStyle='#D9CDB6';c.fillRect(0,930,W,150);
  const r=rng(3);for(let i=0;i<140;i++){const x=r()*W,y=620+r()*290,h=40+r()*70,sw=Math.sin(t*2+i)*6;
    c.strokeStyle=C.green;c.lineWidth=3;c.beginPath();c.moveTo(x,y+h);c.quadraticCurveTo(x+sw,y+h/2,x+sw*1.4,y);c.stroke();
    const col=['#F4A6B8','#FFFFFF','#E86F9A','#F7C6D4'][i%4];for(let k=0;k<6;k++){leaf(c,x+sw*1.4+Math.cos(k)*11,y+Math.sin(k)*11,10,k,col)}c.beginPath();c.arc(x+sw*1.4,y,5,0,Math.PI*2);c.fillStyle=C.gold;c.fill()}
  const wx=lerp(1500,1100,eo(t/1.2));
  person(c,wx,880,1.0,C.yuu,{bob:Math.sin(t*9)*3});person(c,wx+130,890,0.95,'#7E9A6E',{bob:Math.sin(t*9+1)*3});person(c,wx-110,930,0.62,C.gold,{armUp:true,bob:Math.sin(t*9+2)*3});
};
// 04 ミニトマト
V[4]=(c,t)=>{sky(c,'#DFF2E2','#F4FBF2');
  c.strokeStyle=C.green;c.lineWidth=12;
  [[500,0.0],[960,0.6],[1420,1.2]].forEach(([x,ph])=>{c.beginPath();c.moveTo(x,1080);c.bezierCurveTo(x-40,800,x+60,500,x+Math.sin(t*1.6+ph)*20,140);c.stroke();
    for(let k=0;k<7;k++){leaf(c,x+(k%2?70:-70),900-k*110,60,(k%2?0.5:-0.5),C.grass2)}
    for(let k=0;k<5;k++){const tx=x+(k%2?50:-40)+Math.sin(t*1.6+ph+k)*6,ty=760-k*120;c.beginPath();c.arc(tx,ty,32,0,Math.PI*2);c.fillStyle=k===2?'#F59A3A':C.red;c.fill();c.beginPath();c.arc(tx-10,ty-12,9,0,Math.PI*2);c.fillStyle='rgba(255,255,255,.55)';c.fill()}});
  // 子どもの手
  const hx=lerp(1900,1560,eo(t/0.7));c.save();c.translate(hx,560);c.rotate(-0.2);fillRR(c,0,0,320,90,45,C.skin);fillRR(c,-40,10,70,30,15,C.skin);fillRR(c,-34,48,60,26,13,C.skin);fillRR(c,40,0,280,90,40,C.kazu);c.restore();
};
// 05 砂利の玄関とチョークの絵
V[5]=(c,t)=>{c.fillStyle='#EDE6D8';c.fillRect(0,0,W,H);
  c.fillStyle=C.plaster;c.fillRect(0,0,W,560);c.fillStyle=C.wood;fillRR(c,760,80,400,520,6,C.wood);c.strokeStyle=C.wood2;c.lineWidth=5;c.strokeRect(800,120,320,440);
  c.beginPath();c.arc(1090,360,10,0,Math.PI*2);c.fillStyle=C.ink;c.fill();
  c.fillStyle='#D9D3C8';c.fillRect(640,600,640,70);c.fillStyle='#CFC8BB';c.fillRect(600,670,720,40);
  gravel(c,0,700,W,380,55,0.006);gravel(c,0,600,600,100,56,0.006);gravel(c,1320,600,600,100,57,0.006);
  // 雑草
  const r=rng(5);for(let i=0;i<14;i++){const x=r()*W,y=720+r()*340;for(let k=0;k<4;k++)leaf(c,x+k*8-12,y-k*4,22,-1.2+k*0.6+Math.sin(t*2+i)*0.1,C.grass2)}
  // チョークのいえ（段の上）
  c.strokeStyle=C.white;c.lineWidth=6;c.lineCap='round';const d=clamp(t/0.8);c.setLineDash([600]);c.lineDashOffset=600*(1-d);
  c.beginPath();c.moveTo(700,660);c.lineTo(700,622);c.lineTo(740,600);c.lineTo(780,622);c.lineTo(780,660);c.stroke();c.setLineDash([]);
  // 三輪車
  c.save();c.translate(1460,900);c.strokeStyle=C.ink;c.lineWidth=10;c.beginPath();c.arc(-90,40,48,0,Math.PI*2);c.stroke();c.beginPath();c.arc(110,40,48,0,Math.PI*2);c.stroke();
  c.beginPath();c.arc(10,30,70,0,Math.PI*2);c.stroke();c.strokeStyle=C.yuu;c.lineWidth=16;c.beginPath();c.moveTo(-90,40);c.lineTo(10,-50);c.lineTo(110,40);c.stroke();fillRR(c,-40,-70,90,26,13,C.kazu);c.restore();
};
// 06 壁寄せのテレビ
V[6]=(c,t)=>{c.fillStyle='#F6EFE2';c.fillRect(0,0,W,H);c.fillStyle='#D9B48A';c.fillRect(0,720,W,360);
  c.strokeStyle='#C99F72';c.lineWidth=3;for(let x=0;x<W;x+=140){c.beginPath();c.moveTo(x,720);c.lineTo(x-80,1080);c.stroke()}
  // スタンド
  c.fillStyle='#8A8F94';c.fillRect(950,560,20,190);fillRR(c,860,740,200,20,8,'#8A8F94');
  const glow=0.5+0.5*Math.sin(t*5);fillRR(c,700,240,520,320,14,C.ink);const g=c.createLinearGradient(700,240,1220,560);g.addColorStop(0,`rgba(28,141,204,${0.55+0.2*glow})`);g.addColorStop(1,`rgba(242,194,48,${0.45+0.2*(1-glow)})`);c.fillStyle=g;rr(c,716,256,488,288,8);c.fill();
  // ラグ
  c.beginPath();c.ellipse(960,930,640,120,0,0,Math.PI*2);c.fillStyle='#F2E3C4';c.fill();
  // 寝転がる家族（後ろ姿）
  [[700,C.kazu,1],[960,C.yuu,1],[1190,C.gold,0.7],[1330,'#7E9A6E',0.7]].forEach(([x,col,s],i)=>{c.save();c.translate(x,900);c.scale(s,s);fillRR(c,-110,-40,220,90,45,col);c.beginPath();c.arc(-120,-20,40,0,Math.PI*2);c.fillStyle=C.hair;c.fill();c.restore()});
  // ルンバ風の丸い掃除機
  const rx=lerp(300,520,(Math.sin(t*1.3)+1)/2);c.beginPath();c.ellipse(rx,1010,70,20,0,0,Math.PI*2);c.fillStyle='#3B4650';c.fill();c.beginPath();c.ellipse(rx,1002,30,8,0,0,Math.PI*2);c.fillStyle=C.yuu;c.fill();
};
// 08 窓辺の植物と朝の光
V[8]=(c,t)=>{c.fillStyle=C.plaster;c.fillRect(0,0,W,H);
  sky(c,'#FBE3C6','#CFEBFA');c.save();c.beginPath();c.rect(0,0,W,H);c.restore();
  c.fillStyle=C.plaster;c.fillRect(0,0,380,H);c.fillRect(1540,0,380,H);c.fillRect(0,0,W,120);c.fillRect(0,820,W,260);
  c.strokeStyle=C.white;c.lineWidth=22;c.strokeRect(380,120,1160,700);c.beginPath();c.moveTo(960,120);c.lineTo(960,820);c.stroke();
  fillRR(c,340,800,1240,40,6,'#E9DFCC');
  // 光の帯
  c.fillStyle=`rgba(242,194,48,${0.18+0.05*Math.sin(t*2)})`;c.beginPath();c.moveTo(420,840);c.lineTo(1500,840);c.lineTo(1800,1080);c.lineTo(600,1080);c.closePath();c.fill();
  [[560,C.kazu],[820,'#D9CFC0'],[1120,C.yuu],[1380,'#E9E1D2']].forEach(([x,col],i)=>{fillRR(c,x-60,690,120,110,14,col);
    for(let k=0;k<6;k++)leaf(c,x+Math.cos(k*1.1+Math.sin(t+i)*0.1)*60,640-k*28,46,k*1.1-1.5+Math.sin(t*1.5+i)*0.06,k%2?C.grass:C.grass2)});
};
// 09 カーポートの下で雨宿り
V[9]=(c,t)=>{sky(c,'#C6D9E4','#E3EDF2');c.fillStyle='#BFC6C9';c.fillRect(0,760,W,320);
  // 雨
  const r=rng(9);c.strokeStyle='rgba(28,141,204,.45)';c.lineWidth=3;for(let i=0;i<160;i++){const x=r()*W,sp=900+r()*400,y=((r()*H+t*sp)%H);c.beginPath();c.moveTo(x,y);c.lineTo(x-8,y+34);c.stroke()}
  // 屋根
  fillRR(c,240,200,1440,40,10,'rgba(255,255,255,.85)');c.fillStyle='#8A8F94';c.fillRect(300,240,18,560);c.fillRect(1600,240,18,560);
  c.fillStyle='rgba(255,255,255,.35)';c.fillRect(260,240,1400,560);
  // 車と自転車
  fillRR(c,420,560,620,220,60,C.yuu);fillRR(c,500,480,420,140,50,'#7FB7DC');c.beginPath();c.arc(540,780,56,0,Math.PI*2);c.arc(920,780,56,0,Math.PI*2);c.fillStyle=C.ink;c.fill();
  c.strokeStyle=C.ink;c.lineWidth=8;[[1200],[1420]].forEach(([x])=>{c.beginPath();c.arc(x,760,52,0,Math.PI*2);c.stroke();c.beginPath();c.arc(x+150,760,52,0,Math.PI*2);c.stroke();c.strokeStyle=C.kazu;c.beginPath();c.moveTo(x,760);c.lineTo(x+60,680);c.lineTo(x+150,760);c.stroke();c.strokeStyle=C.ink});
  // 水たまり
  const rp=(t*1.4)%1;c.strokeStyle=`rgba(255,255,255,${0.8*(1-rp)})`;c.lineWidth=3;c.beginPath();c.ellipse(240,960,40+rp*120,10+rp*30,0,0,Math.PI*2);c.stroke();
};
// 10 デッキでスイカ
V[10]=(c,t)=>{sky(c,'#9FD8F4','#E8F7FD');
  const g=c.createRadialGradient(1600,180,20,1600,180,220);g.addColorStop(0,'#FFF4C2');g.addColorStop(1,'rgba(255,244,194,0)');c.fillStyle=g;c.fillRect(1300,0,620,500);
  c.fillStyle=C.grass;c.fillRect(0,640,W,140);c.fillStyle=C.wood;c.fillRect(0,760,W,320);c.strokeStyle=C.wood2;c.lineWidth=4;for(let y=780;y<H;y+=50){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
  [[760,C.kazu],[1080,C.yuu]].forEach(([x,col],i)=>{person(c,x,780,1.0,col,{bob:Math.sin(t*4+i)*2})});
  [[600,0],[930,1],[1250,2]].forEach(([x,i])=>{c.save();c.translate(x,900);c.beginPath();c.moveTo(-70,0);c.arc(0,0,70,Math.PI,0);c.closePath();c.fillStyle=C.red;c.fill();c.strokeStyle=C.green;c.lineWidth=12;c.beginPath();c.arc(0,0,70,Math.PI,0);c.stroke();for(let k=0;k<4;k++){c.beginPath();c.ellipse(-40+k*26,-26-(k%2)*12,4,7,0,0,Math.PI*2);c.fillStyle=C.ink;c.fill()}c.restore()});
};
// 11 造作キッチンで並んで料理
V[11]=(c,t)=>{c.fillStyle='#F7F0E3';c.fillRect(0,0,W,H);
  [[600],[960],[1320]].forEach(([x])=>{c.strokeStyle='#8A8F94';c.lineWidth=3;c.beginPath();c.moveTo(x,0);c.lineTo(x,180);c.stroke();c.beginPath();c.arc(x,200,40,Math.PI,0);c.fillStyle=C.gold;c.fill()});
  fillRR(c,240,700,1440,60,8,'#E3D2B8');c.fillStyle=C.wood;c.fillRect(240,760,1440,320);c.strokeStyle=C.wood2;c.lineWidth=4;for(let x=240;x<1680;x+=240){c.beginPath();c.moveTo(x,770);c.lineTo(x,1080);c.stroke()}
  person(c,780,640,1.15,C.kazu);person(c,1140,640,1.15,C.yuu);
  // 湯気
  c.strokeStyle='rgba(255,255,255,.95)';c.lineWidth=10;c.lineCap='round';for(let k=0;k<3;k++){const ph=(t*0.8+k*0.33)%1;c.globalAlpha=1-ph;c.beginPath();c.moveTo(960+k*30,560-ph*260);c.bezierCurveTo(940+k*30,520-ph*260,990+k*30,480-ph*260,960+k*30,440-ph*260);c.stroke()}c.globalAlpha=1;
  fillRR(c,900,600,130,90,20,'#5B6670');
};
// 12 吹き抜けの紙の飾り

// ===== 時間割 =====
const ORDER=[1,2,3,4,5,6,8,9,10,11,12,13,14,15,16];
const CUTS=[];{let s=0,d=0.88;for(const id of ORDER){CUTS.push({id,s,e:s+d});s+=d;d*=0.92}}

function worldLabel(id){return '世界'+String(id).padStart(2,'0')}

function render(t){
  t=clamp(t,0,DUR);

    const c7=cell(6);const x=lerp(0,c7.x,p),y=lerp(0,c7.y,p),w=lerp(W,GW,p),h=lerp(H,GH,p);
    drawScene(7,lt07,x,y,w,h);
    if(p>0.6){ctx.strokeStyle=C.ink;ctx.lineWidth=5;rr(ctx,c7.x-4,c7.y-4,GW+8,GH+8,13);ctx.globalAlpha=eo((p-0.6)/0.4);ctx.stroke();ctx.globalAlpha=1}

    // 16の外側の、点線の枠
    const q=eo((t-(PULL1-0.2))/1.2);if(q>0){ctx.save();ctx.globalAlpha=0.55*q;ctx.setLineDash([14,12]);ctx.strokeStyle=C.muted;ctx.lineWidth=4;

    // メッセージ
    const m=clamp((t-MSG0)/0.5)*clamp((MSG1-t)/0.4);if(m>0){ctx.globalAlpha=m;fillRR(ctx,0,880,W,200,0,'rgba(255,250,240,.94)');ctx.font=`700 64px ${FONT_D}`;ctx.fillStyle=C.ink;ctx.textBaseline='middle';const s='未来は、16通りより多かった。';const tw=ctx.measureText(s).width;ctx.fillText(s,W/2-tw/2,972);ctx.globalAlpha=1}
