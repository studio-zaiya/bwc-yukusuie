<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山場：ひらめきの一手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1d1d2b;--fg:#fff6e0}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"M PLUS Rounded 1c",sans-serif;overflow:hidden}
  #wrap{position:absolute;inset:0 0 44px 0;display:flex;align-items:center;justify-content:center}
  canvas{width:1920px;height:1080px;transform-origin:center center;image-rendering:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  #bar{position:absolute;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#14141f;font-size:13px}
  #bar button{background:#ffcc33;border:0;border-radius:6px;padding:6px 12px;font-weight:800;font-family:inherit;cursor:pointer;color:#2b2b45}
  #bar input{flex:1}
  #tc{width:70px;text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="bar"><button id="pp">一時停止</button><input id="sc" type="range" min="0" max="16" step="0.01" value="0"><span id="tc">0.00s</span></div>
<script>
// ===== 山場：ひらめきの一手（ゲームUIの文法）=====
// 画面はすべて時刻 t の関数 render(t) で決まる。
const W=1920,H=1080,DUR=16;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const C={ink:'#2b2b45',cream:'#fff6e0',sky1:'#7cc8ff',sky2:'#c9ecff',grass:'#7ed37f',grass2:'#5fbf6a',
  kaz:'#ff9a3c',yuu:'#22bfa8',gold:'#ffcc33',pink:'#ff6f91',red:'#ef5350',blue:'#5b8def',grey:'#b9b4c7',white:'#ffffff'};
const FD='"DotGothic16",monospace', FR='"M PLUS Rounded 1c",sans-serif';

// ---- 道具 ----
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function typed(s,t,a,cps=18){const n=Math.floor(cl((t-a)*cps,0,s.length));return [...s].slice(0,n).join('')}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function box(x,y,w,h,fill=C.white){ // ゲーム風の二重枠
  ctx.save();ctx.fillStyle='rgba(43,43,69,.25)';rr(x+8,y+10,w,h,18);ctx.fill();
  ctx.fillStyle=fill;rr(x,y,w,h,18);ctx.fill();
  ctx.lineWidth=6;ctx.strokeStyle=C.ink;rr(x,y,w,h,18);ctx.stroke();
  ctx.lineWidth=2;ctx.strokeStyle=C.ink;rr(x+10,y+10,w-20,h-20,10);ctx.stroke();ctx.restore()}
function txt(s,x,y,size,col=C.ink,font=FD,align='left',weight=''){ctx.font=`${weight} ${size}px ${font}`;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(s,x,y)}
function outlineTxt(s,x,y,size,fill,stroke,lw=10,font=FR,weight='800'){ctx.font=`${weight} ${size}px ${font}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);ctx.fillStyle=fill;ctx.fillText(s,x,y)}
function sprite(rows,pal,x,y,p){for(let j=0;j<rows.length;j++)for(let i=0;i<rows[j].length;i++){const k=rows[j][i];if(k==='.')continue;ctx.fillStyle=pal[k];ctx.fillRect(Math.round(x+i*p),Math.round(y+j*p),p,p)}}
function gauge(x,y,w,h,v,col,bg='#e6e1d3'){ctx.fillStyle=C.ink;rr(x-3,y-3,w+6,h+6,h/2+3);ctx.fill();ctx.fillStyle=bg;rr(x,y,w,h,h/2);ctx.fill();if(v>0){ctx.fillStyle=col;rr(x,y,Math.max(h,w*v),h,h/2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.35)';rr(x+4,y+3,Math.max(0,w*v-8),h*.3,h*.15);ctx.fill()}}
const man=v=>Math.round(v).toLocaleString('ja-JP')+'万円';

// ---- ドット絵（自作）----
const DAD=['..HHH..','.HHHHH.','.HHHHH.','..HHH..','.CCCCC.','CCCCCCC','CCCCCCC','S.CCC.S','..PPP..','..P.P..','..P.P..','.BB.BB.'];
const MOM=['.HHHHH.','HHHHHHH','HHHHHHH','HHHHHHH','.CCCCC.','CCCCCCC','CCCCCCC','S.CCC.S','.CCCCC.','..S.S..','..S.S..','.BB.BB.'];
const KID=['.HHH.','HHHHH','.HHH.','CCCCC','CCCCC','.P.P.','BB.BB'];
const CLERK=['..HHH..','.HSSSH.','.SKSKS.','.SSSSS.','..SMS..','.WTTTW.','WWWTWWW','WWWTWWW','S.WWW.S','..NNN..','..N.N..','.BB.BB.'];
const HOUSE=['......RR........','....RRRRRR......','..RRRRRRRRRR....','RRRRRRRRRRRRRR..','.WWWWWWWWWWWW...','.WGGWWWWWGGWW...','.WGGWWWWWGGWW...','.WWWWWWWWWWWW...','.WGGWWDDWWGGW...','.WGGWWDDWWGGW...','.WWWWWDDWWWWW...','.WWWWWDDWWWWW...'];
const BOX=['RRRRRRRRRRRRRRRR','RRRRRRRRRRRRRRRR','WWWWWWWWWWWWWWWW','WGGGGGWWWWWGGGWW','WGGGGGWWWWWGGGWW','WWWWWWWWWWWWWWWW','WWWWWWWWWWWWWWWW','WGGGGGGGGWWDDWWW','WGGGGGGGGWWDDWWW','WGGGGGGGGWWDDWWW','WWWWWWWWWWWDDWWW','WWWWWWWWWWWDDWWW'];
const BOXEAVE=['RRRRRRRRRRRRRRRR','RRRRRRRRRRRRRRRR','WWWWWWWWWWWWWWWW','WGGGGGWWWWWGGGWW','WGGGGGWWWWWGGGWW','WWWWWWWWWWWWWWWW','EEEEEEEEEEEW....','WGGGGGGGGWWDDWWW','WGGGGGGGGWWDDWWW','WGGGGGGGGWWDDWWW','WWWWWWWWWWWDDWWW','WWWWWWWWWWWDDWWW'];

// 16の世界（07が「あなた」）
const WORLDS=[
 {n:'01',co:'Cデザイン',ln:'外構を残した',st:'キッチンは既製品',k:'ok',w:'#f3efe6',r:'#6b7a8f',f:'gable'},
 {n:'02',co:'Cデザイン',ln:'勾配屋根の木の家',st:'ナチュラルに',k:'ok',w:'#d9a066',r:'#8a5a3b',f:'gable'},
 {n:'03',co:'B工務店',ln:'全部入りの家',st:'上棟後に倒産',k:'bad',w:'#e7d3b5',r:'#c0392b',f:'gable'},
 {n:'04',co:'B工務店',ln:'前払いを抑えた',st:'倒産、損失は小',k:'warn',w:'#f6e7c8',r:'#9b59b6',f:'gable'},
 {n:'05',co:'Dホーム',ln:'太陽光つき規格',st:'オプション+150万',k:'warn',w:'#ffffff',r:'#2e86de',f:'box'},
 {n:'06',co:'Cデザイン',ln:'借りて外構も',st:'返済が月+1.1万',k:'ok',w:'#fdf2e9',r:'#16a085',f:'box'},
 {n:'07',co:'Cデザイン',ln:'窓だけトリプル',st:'冬もあたたか',k:'me',w:'#ffffff',r:'#3b3f58',f:'eave'},
 {n:'08',co:'B工務店',ln:'外構込みの一式',st:'口約束で追加請求',k:'warn',w:'#e8c39e',r:'#7f8c8d',f:'gable'},
 {n:'09',co:'Cデザイン',ln:'勾配屋根',st:'雨だれ知らず',k:'ok',w:'#f9e79f',r:'#a04000',f:'gable'},
 {n:'10',co:'Cデザイン',ln:'和室を入れた',st:'予算+180万',k:'warn',w:'#f5f0e1',r:'#5d6d7e',f:'gable'},
 {n:'11',co:'Aハウス',ln:'月末に仮契約',st:'契約後+380万',k:'bad',w:'#eaf2f8',r:'#2c3e50',f:'box'},
 {n:'12',co:'Cデザイン',ln:'標準窓で外構',st:'2月の朝が寒い',k:'cold',w:'#e8f6f3',r:'#1f618d',f:'box'},
 {n:'13',empty:true},
 {n:'14',empty:true},
 {n:'15',co:'Cデザイン',ln:'標準窓で大きく',st:'2月の朝が寒い',k:'cold',w:'#ffffff',r:'#3b3f58',f:'box'},
 {n:'16',empty:true},
];
const KCOL={ok:C.grass2,warn:C.kaz,bad:C.red,cold:C.blue,me:C.gold};

function drawHouse(wd,x,y,p,ruined=false){
  const pal={R:wd.r,W:wd.w,G:'#ffe08a',D:'#8a5a3b',E:wd.r};
  if(ruined){ctx.fillStyle='#d8cdb5';ctx.fillRect(x,y+p*9,p*16,p*3);ctx.fillStyle=C.ink;ctx.fillRect(x+p*13,y+p*4,p*1,p*6);ctx.fillStyle=C.cream;ctx.fillRect(x+p*10,y+p*3,p*5,p*3);return}
  sprite(wd.f==='gable'?HOUSE:wd.f==='eave'?BOXEAVE:BOX,pal,x,y,p);
}

// ---- 場面1・2：エンカウント ----
function battle(t){
  // 空と地面
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.sky1);g.addColorStop(.55,C.sky2);g.addColorStop(.551,C.grass);g.addColorStop(1,C.grass2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 雲（ゆっくり流れる）
  for(let i=0;i<5;i++){const x=((i*430+t*30)%2300)-200,y=80+i%3*70;ctx.fillStyle='rgba(255,255,255,.85)';[[0,0,60],[50,-20,50],[100,0,55],[50,15,55]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(x+dx,y+dy,r*.8,0,7);ctx.fill()})}
  // 奥の銀行のカウンター（相手の背景）
  const ein=eo(seg(t,0.15,0.9));const ex=lerp(2100,1380,ein);
  ctx.fillStyle='rgba(43,43,69,.18)';ctx.beginPath();ctx.ellipse(ex,470,300,62,0,0,7);ctx.fill();
  ctx.fillStyle=C.blue;rr(ex-170,150,340,56,12);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=C.ink;rr(ex-170,150,340,56,12);ctx.stroke();
  txt('ローン相談窓口',ex,189,28,C.white,FR,'center','800');
  sprite(CLERK,{H:'#3d2c2e',S:'#f6c9a3',K:C.ink,M:'#d35d6e',W:'#ffffff',T:C.blue,N:'#41455f',B:'#2b2b45'},ex-42,236,12);
  ctx.fillStyle='#ffffff';rr(ex-230,340,460,100,10);ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=C.ink;rr(ex-230,340,460,100,10);ctx.stroke();
  ctx.fillStyle='#ffe9a8';ctx.fillRect(ex-226,344,452,22);
  // 手前の家族（後ろ姿）
  const fin=eo(seg(t,0.15,0.9));const fx=lerp(-400,520,fin);
  ctx.fillStyle='rgba(43,43,69,.2)';ctx.beginPath();ctx.ellipse(fx,850,330,58,0,0,7);ctx.fill();
  const bob=i=>Math.round(Math.sin(t*6+i)*3);
  sprite(DAD,{H:'#3a2a22',C:C.kaz,S:'#f2c19c',P:'#3e4a6b',B:C.ink},fx-190,650+bob(0),16);
  sprite(MOM,{H:'#5a3a2a',C:C.yuu,S:'#f2c19c',B:C.ink},fx-50,650+bob(1),16);
  sprite(KID,{H:'#3a2a22',C:C.pink,P:'#3e4a6b',B:C.ink},fx+90,738+bob(2),14);
  sprite(KID,{H:'#5a3a2a',C:C.gold,P:'#3e4a6b',B:C.ink},fx+180,752+bob(3),12);

  // 相手のステータス
  const sIn=eo(seg(t,0.9,1.3));
  ctx.save();ctx.translate(lerp(-700,0,sIn),0);
  box(110,90,640,170);
  txt('銀行の担当者',150,152,40,C.ink,FD);txt('Lv.35',690,152,30,C.ink,FD,'right');
  txt('借入枠',150,212,26,C.ink,FD);gauge(260,192,440,26,1,C.gold);txt('のこり300万',700,246,22,C.ink,FD,'right');
  ctx.restore();

  // 家族のステータス
  const pIn=eo(seg(t,1.0,1.4));
  const fund=lerp(4070,4130,eo(seg(t,7.0,7.8)));
  const warm=lerp(.28,.86,eo(seg(t,7.2,8.2)));
  const days=t<6.9?25:25;
  ctx.save();ctx.translate(lerp(900,0,pIn),0);
  box(1150,540,690,250);
  txt('かず＆ゆう',1190,604,40,C.ink,FD);txt('子ども2人',1800,604,26,C.ink,FD,'right');
  txt('予算',1190,662,28,C.ink,FD);txt(man(fund),1800,662,34,fund>4070.5?C.red:C.ink,FD,'right');
  txt('冬の',1190,716,24,C.ink,FD);txt('あたたかさ',1190,746,24,C.ink,FD);
  gauge(1330,712,300,26,warm,warm>.6?C.kaz:C.blue);
  txt('ローン特約',1660,724,22,C.ink,FD);txt('のこり'+days+'日',1800,758,26,C.red,FD,'right');
  ctx.restore();

  // 文章の窓
  const menuOn=t>=4.0&&t<6.9;
  const tbw=menuOn?1080:1760;
  box(80,860,tbw,190);
  let line1='',line2='';
  if(t<2.4){line1=typed('銀行の担当者が あらわれた！',t,1.2,16)}
  else if(t<4.0){line1='銀行の担当者が あらわれた！';line2=typed('「あと300万円、いまなら一緒に組めますよ」',t,2.4,20)}
  else if(t<6.9){line1='どうする？';line2='（外構か、予算か…）'}
  else if(t<7.9){line1=typed('ひらめいた！ 2択の外側の答え。',t,6.9,22)}
  else{line1='ひらめいた！ 2択の外側の答え。';line2=typed('冬のあたたかさが 3 あがった！',t,7.9,22)}
  txt(line1,130,935,42,C.ink,FD);txt(line2,130,1000,40,C.ink,FD);
  if(!menuOn&&Math.floor(t*3)%2===0&&t>3.6&&t<4)txt('▼',tbw+20,1020,28,C.ink,FD,'right');

  // コマンド
  if(menuOn){
    const mIn=eb(seg(t,4.0,4.3));
    ctx.save();ctx.translate(1520,955);ctx.scale(mIn,mIn);ctx.translate(-1520,-955);
    box(1190,820,650,230);
    const items=['外構を とりもどす','予算内で すすむ','じぶんで 考える'];
    const cur=t<4.6?0:t<5.1?1:2;
    items.forEach((s,i)=>{const y=890+i*62;txt(s,1270,y,38,i===2?C.ink:C.ink,FD);if(i===2){ctx.fillStyle=C.gold;ctx.fillRect(1268,y+8,300,6)}});
    if(Math.floor(t*4)%2===0||t>5.3)txt('▶',1222,890+cur*62,36,C.ink,FD);
    ctx.restore();
  }
  // 自分のことばで入力
  if(t>=5.4&&t<7.4){
    const a=eb(seg(t,5.4,5.7))*(1-seg(t,7.0,7.4));
    ctx.save();ctx.globalAlpha=cl(a*1.2);ctx.translate(W/2,430);ctx.scale(a,a);ctx.translate(-W/2,-430);
    box(330,330,1260,200,'#fffdf5');
    txt('じぶんの ことばで',380,392,30,C.yuu,FD);
    const s=typed('60万だけ増やして、窓をトリプルガラスにしたい',t,5.7,22);
    txt(s,380,470,48,C.ink,FD);
    ctx.font=`48px ${FD}`;const w=ctx.measureText(s).width;
    if(Math.floor(t*4)%2===0)ctx.fillRect(386+w,430,6,50);
    ctx.restore();
  }
  // ひらめきの演出
  if(t>=6.8&&t<8.6){
    const k=seg(t,6.8,8.6);
    ctx.save();ctx.translate(W/2,360);
    for(let i=0;i<18;i++){const a=i/18*Math.PI*2+rnd(i)*.3,d=eo(k)*(320+rnd(i+9)*240),s=lerp(28,6,k);
      ctx.save();ctx.translate(Math.cos(a)*d,Math.sin(a)*d*.7);ctx.rotate(k*4+i);ctx.fillStyle=[C.gold,C.pink,C.yuu,C.kaz][i%4];star(0,0,s,s*.45);ctx.fill();ctx.restore()}
    const sc=eb(seg(t,6.8,7.2))*(1-seg(t,8.2,8.6)*.2);
    ctx.scale(sc,sc);ctx.rotate(-0.04);
    ctx.fillStyle=C.gold;star(0,0,170,80);ctx.fill();ctx.lineWidth=8;ctx.strokeStyle=C.ink;ctx.stroke();
    outlineTxt('第3の答え',0,6,96,C.white,C.ink,16);
    ctx.restore();
  }
}
function star(x,y,R,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}ctx.closePath()}

// ---- 場面3：16の世界のカード ----
const CW=380,CH=200,GX=24,GY=22,X0=(W-(CW*4+GX*3))/2,Y0=170;
function cardPos(i){return [X0+(i%4)*(CW+GX),Y0+Math.floor(i/4)*(CH+GY)]}
function card(i,t,tFlip){
  const wd=WORLDS[i],[x,y]=cardPos(i);
  const f=eo(seg(t,tFlip,tFlip+.35));if(f<=0)return;
  ctx.save();ctx.translate(x+CW/2,y+CH/2);ctx.scale(Math.max(.02,f),1);ctx.translate(-CW/2,-CH/2);
  if(wd.empty){
    ctx.setLineDash([14,10]);ctx.lineWidth=4;ctx.strokeStyle='rgba(43,43,69,.45)';rr(0,0,CW,CH,18);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,255,255,.5)';rr(0,0,CW,CH,18);ctx.fill();
    outlineTxt('？',CW/2,CH/2-16,80,C.white,'rgba(43,43,69,.45)',8);
    txt('ひらめき待ちの空きスロット',CW/2,CH-26,22,'rgba(43,43,69,.6)',FD,'center');
    txt(wd.n,22,40,26,'rgba(43,43,69,.5)',FD);
    ctx.restore();return;
  }
  const me=wd.k==='me';
  if(me){const pulse=.5+.5*Math.sin(t*6);ctx.shadowColor=C.gold;ctx.shadowBlur=30+pulse*30}
  ctx.fillStyle=C.white;rr(0,0,CW,CH,18);ctx.fill();ctx.shadowBlur=0;
  ctx.lineWidth=me?8:5;ctx.strokeStyle=me?C.gold:C.ink;rr(0,0,CW,CH,18);ctx.stroke();
  ctx.fillStyle=KCOL[wd.k];rr(0,0,CW,46,18);ctx.fill();ctx.fillRect(0,26,CW,20);
  txt('世界'+wd.n,18,34,26,C.white,FD);txt(wd.co,CW-18,34,24,C.white,FD,'right');
  // 地面と家
  ctx.fillStyle='#bfe6a8';rr(14,70,150,112,10);ctx.fill();
  const ruined=wd.k==='bad'&&wd.n==='03'&&t>10.1;
  drawHouse(wd,26,92,8,ruined);
  txt(wd.ln,178,98,25,C.ink,FD);
  // 結果のシール
  const s=eb(seg(t,10.0+i*.04,10.35+i*.04));
  ctx.save();ctx.translate(176+8,118);ctx.scale(s,s);
  ctx.fillStyle=KCOL[wd.k];rr(0,0,186,40,20);ctx.fill();txt(wd.st,93,29,21,C.white,FD,'center');ctx.restore();
  // 分かれ道の進み具合
  txt('分かれ道',178,188,20,C.ink,FD);
  for(let d=0;d<4;d++){ctx.fillStyle=me?C.gold:C.ink;ctx.beginPath();ctx.arc(268+d*17,181,6,0,7);ctx.fill()}
  txt('4/4',CW-10,188,18,C.ink,FD,'right');
  if(me&&t>11.0){const b=eb(seg(t,11.0,11.35));ctx.save();ctx.translate(CW-40,-6);ctx.scale(b,b);ctx.rotate(.15);ctx.fillStyle=C.pink;rr(-70,-26,140,52,26);ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=C.ink;rr(-70,-26,140,52,26);ctx.stroke();outlineTxt('あなた',0,2,30,C.white,C.ink,6);ctx.restore()}
  ctx.restore();
}
function grid(t){
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fff6e0');g.addColorStop(1,'#ffe7c2');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 方眼
  ctx.strokeStyle='rgba(43,43,69,.06)';ctx.lineWidth=2;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  const hIn=eo(seg(t,8.1,8.6));
  ctx.globalAlpha=hIn;
  txt('16の世界',X0,118,60,C.ink,FR,'left','800');
  txt('同じふたりが、別の答えを選んだ未来',X0+290,114,30,C.ink,FD);
  const open=Math.min(13,Math.floor(seg(t,8.2,9.9)*14));
  box(W-X0-300,62,300,80);txt('解放 '+open+' / 16',W-X0-150,118,40,C.ink,FD,'center');
  ctx.globalAlpha=1;
  const order=[6,0,5,10,1,14,3,8,12,2,11,4,7,9,13,15];
  order.forEach((i,k)=>card(i,t,8.2+k*.1));
}

// ---- 場面4：クエスト達成 ----
function result(t){
  const z=eo(seg(t,12.3,13.1));
  const [cx,cy]=cardPos(6);
  // カード07へ寄る
  ctx.save();
  const s=lerp(1,5.2,z);const tx=cx+CW/2,ty=cy+CH/2;
  ctx.translate(W/2,H/2);ctx.scale(s,s);ctx.translate(-lerp(W/2,tx,z),-lerp(H/2,ty,z));
  grid(t);ctx.restore();
  const a=seg(t,12.9,13.3);if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fff3c4');g.addColorStop(1,'#ffd88a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 光の放射
  ctx.save();ctx.translate(560,560);ctx.rotate(t*.3);for(let i=0;i<16;i++){ctx.rotate(Math.PI/8);ctx.fillStyle=i%2?'rgba(255,255,255,.45)':'rgba(255,255,255,.15)';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(1400,-120);ctx.lineTo(1400,120);ctx.closePath();ctx.fill()}ctx.restore();
  // 家と家族
  ctx.fillStyle='#9fdc8f';ctx.beginPath();ctx.ellipse(560,800,420,90,0,0,7);ctx.fill();
  const hb=eb(seg(t,13.1,13.5));ctx.save();ctx.translate(560,800);ctx.scale(hb,hb);drawHouse(WORLDS[6],-256,-400,32);ctx.restore();
  const bob=i=>Math.round(Math.abs(Math.sin(t*5+i))*-14);
  sprite(DAD,{H:'#3a2a22',C:C.kaz,S:'#f2c19c',P:'#3e4a6b',B:C.ink},300,690+bob(0),12);
  sprite(MOM,{H:'#5a3a2a',C:C.yuu,S:'#f2c19c',B:C.ink},740,690+bob(1),12);
  // 見出し
  const bIn=eb(seg(t,13.2,13.6));
  ctx.save();ctx.translate(W/2,130);ctx.scale(bIn,bIn);ctx.rotate(-.02);
  ctx.fillStyle=C.pink;rr(-470,-70,940,140,70);ctx.fill();ctx.lineWidth=8;ctx.strokeStyle=C.ink;rr(-470,-70,940,140,70);ctx.stroke();
  outlineTxt('クエスト達成！ わが家 完成',0,4,72,C.white,C.ink,14);ctx.restore();
  // ステータス
  box(1060,260,780,560);
  txt('1年後のステータス',1100,330,38,C.ink,FD);
  const st=[['冬のあたたかさ',.92,C.kaz],['毎日の手ざわり',.88,C.yuu],['家の顔',.46,C.blue],['家計のゆとり',.7,C.grass2]];
  st.forEach(([n,v,col],i)=>{const y=400+i*92;const f=eo(seg(t,13.6+i*.25,14.2+i*.25));
    txt(n,1100,y+10,30,C.ink,FD);gauge(1380,y-14,400,30,v*f,col);
    if(n==='家の顔'&&f>.99)txt('（つくりかけ）',1780,y+56,22,C.ink,FD,'right')});
  // ふたりのバランス
  const bf=eo(seg(t,14.8,15.4));
  txt('ふたりのバランス',1100,770,28,C.ink,FD);
  const bx=1380,bw=400;ctx.fillStyle=C.ink;rr(bx-3,742,bw+6,36,18);ctx.fill();
  ctx.fillStyle=C.kaz;rr(bx,745,bw*.45*bf+0.01,30,15);ctx.fill();ctx.fillStyle=C.yuu;rr(bx+bw-bw*.55*bf,745,bw*.55*bf+.01,30,15);ctx.fill();
  if(bf>.9){txt('かず 45',bx+10,800,22,C.kaz,FD);txt('ゆう 55',bx+bw-10,800,22,C.yuu,FD,'right')}
  // 次へ
  if(t>15.2&&Math.floor(t*3)%2===0){box(1060,880,780,110);txt('▶ 選ばなかった世界を見にいく',1110,950,34,C.ink,FD)}
  ctx.restore();
}

// ---- 全体 ----
function render(t){
  t=((t%DUR)+DUR)%DUR;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  if(t<8.0)battle(t);
  else if(t<12.3)grid(t);
  else result(t);
  // 場面のつなぎ（横縞のワイプ・白い閃光）
  const wipe=(a,b,dir)=>{const k=seg(t,a,b);if(k<=0||k>=1)return;for(let i=0;i<9;i++){const h=H/9,p=cl(k*1.6-i*.07);const w=(dir?eo(p):1-eo(p))*W;ctx.fillStyle=i%2?C.ink:'#3d3d63';ctx.fillRect(i%2?0:W-w,i*h,w,h+1)}};
  if(t<0.6){const k=seg(t,0,.6);for(let i=0;i<9;i++){const h=H/9,p=cl(k*1.5-i*.05);const w=(1-eo(p))*W;ctx.fillStyle=i%2?C.ink:'#3d3d63';ctx.fillRect(i%2?W-w:0,i*h,w,h+1)}}
  if(t>7.8&&t<8.3){ctx.fillStyle=`rgba(255,255,255,${1-Math.abs(t-8.0)/.3})`;ctx.fillRect(0,0,W,H)}
  if(t>15.6){ctx.fillStyle=`rgba(255,255,255,${seg(t,15.6,16)})`;ctx.fillRect(0,0,W,H)}
}
window.DUR=DUR;window.render=render;

// ---- 再生と表示の大きさ ----
function fit(){const wr=document.getElementById('wrap').getBoundingClientRect();const s=Math.min(wr.width/W,wr.height/H);cv.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
let playing=true,t0=performance.now(),tt=0;const sc=document.getElementById('sc'),tc=document.getElementById('tc'),pp=document.getElementById('pp');
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'一時停止':'再生';t0=performance.now()-tt*1000};
sc.oninput=()=>{tt=+sc.value;t0=performance.now()-tt*1000;render(tt);tc.textContent=tt.toFixed(2)+'s'};
function loop(now){if(playing){tt=((now-t0)/1000)%DUR;sc.value=tt;tc.textContent=tt.toFixed(2)+'s';render(tt)}requestAnimationFrame(loop)}
document.fonts.ready.then(()=>{window.READY=true;requestAnimationFrame(loop)});
</script>
