.lot.me{background:var(--gold);font-size:26px}

.fork:after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-8px;border:8px solid transparent;border-top-color:#1d2433}
.card{position:absolute;transform:translate(-50%,-50%);min-width:250px;padding:14px 20px 16px;border-radius:14px;background:rgba(255,250,240,.96);color:#1d2433;box-shadow:0 10px 30px rgba(0,0,0,.35);white-space:nowrap}

#hud .d{font-size:78px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}

#tick div{font-size:25px;font-weight:700;color:#1d2433;background:rgba(255,250,240,.86);margin-top:8px;padding:6px 14px;border-radius:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tick div b{display:inline-block;min-width:96px;color:#fff;background:#1d2433;border-radius:6px;padding:0 8px;margin-right:12px;text-align:center}

#title{position:absolute;left:0;right:0;bottom:0;padding:200px 0 110px;text-align:center;color:#fff;background:linear-gradient(to top,rgba(16,20,48,.82),rgba(16,20,48,0))}
#title .t{font-size:124px;font-weight:900;letter-spacing:.06em;text-shadow:0 6px 40px rgba(255,190,90,.55)}
#title .u{font-size:38px;font-weight:700;margin-top:10px;letter-spacing:.12em;opacity:.95}

#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:8px 14px;background:rgba(10,14,28,.72);color:#fff;font-size:13px;z-index:9}
#ctl button{background:#ffd23f;border:0;border-radius:6px;padding:6px 12px;font-weight:700;cursor:pointer}
#ctl input{flex:1}
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const DUR = 20; window.DUR = DUR;
const W = 1920, H = 1080;

// ---------- 小道具 ----------
const cl = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ss = (a,b,x)=>{const t=cl((x-a)/(b-a));return t*t*(3-2*t);};
const lin = (a,b,x)=>cl((x-a)/(b-a));
const back = x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const hash = n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const lerp=(a,b,t)=>a+(b-a)*t;
const C = h=>new THREE.Color(h);
const mixC=(a,b,t)=>a.clone().lerp(b,t);
const _t=new THREE.Vector3(),_n=new THREE.Vector3(),_b=new THREE.Vector3(),UP=new THREE.Vector3(0,1,0),XX=new THREE.Vector3(1,0,0);

// ---------- 舞台の拡縮 ----------
const stage = document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/W,(innerHeight-40)/H);stage.style.transform=`translate(${(innerWidth-W*s)/2}px,${(innerHeight-40-H*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();

// ---------- レンダラ ----------
const renderer = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H,false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
stage.insertBefore(renderer.domElement, stage.firstChild);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(26, W/H, 0.5, 600);

// 空（自作のグラデーション球）
const skyU = {top:{value:C('#5fb8f5')}, bot:{value:C('#e3f5ff')}, hz:{value:C('#ffffff')}};
const sky = new THREE.Mesh(new THREE.SphereGeometry(400,32,16), new THREE.ShaderMaterial({
  uniforms:skyU, side:THREE.BackSide, depthWrite:false,
  vertexShader:`varying vec3 vp;void main(){vp=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 top,bot,hz;varying vec3 vp;void main(){float h=clamp(vp.y*1.6+.15,0.,1.);vec3 c=mix(bot,top,pow(h,.8));c=mix(c,hz,exp(-abs(vp.y)*9.)*.35);gl_FragColor=vec4(c,1.);}`
}));
scene.add(sky);

const hemi = new THREE.HemisphereLight(0xcfeaff, 0x9bd37a, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-36,right:36,top:36,bottom:-36,near:1,far:160});
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
scene.add(sun); scene.add(sun.target);
const moon = new THREE.DirectionalLight(0x8fa8ff, 0.0); moon.position.set(-30,40,20); scene.add(moon);

// ポスト処理
const composer = new EffectComposer(renderer);
composer.setSize(W,H);
composer.addPass(new RenderPass(scene,camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W,H), 0.3, 0.55, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- 敷地 ----------
const S = 12, L = 10; // 区画ピッチと区画の大きさ
const lotC = i=>{const r=Math.floor(i/4),c=i%4;return new THREE.Vector3((c-1.5)*S,0,(r-1.5)*S);};
const box = new THREE.BoxGeometry(1,1,1);
const std = (c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:C(c),roughness:.85,metalness:0},o));
function mk(geo,mat,x,y,z,sx,sy,sz,parent){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;(parent||scene).add(m);return m;}

const BW = 4*S+6;
mk(box,std('#efe6d2'),0,-0.25,0,BW,0.5,BW);           // 道（明るい舗装）
mk(box,std('#c08a5a'),0,-1.2,0,BW-0.3,1.4,BW-0.3);     // 土
mk(box,std('#93653f'),0,-2.5,0,BW-0.8,1.2,BW-0.8);     // 下層
const lotMeshes=[];
for(let i=0;i<16;i++){const p=lotC(i);lotMeshes.push(mk(box,std('#a8dc84'),p.x,0.03,p.z,L,0.06,L));}
// 周りの木（点景）
const treeG = new THREE.ConeGeometry(1,2.4,7), trunkG=new THREE.CylinderGeometry(.16,.2,1,6), ballG=new THREE.IcosahedronGeometry(1,0);
const leafMats=['#5fb35a','#7cc96a','#4aa368','#9ad45a'].map(c=>std(c,{flatShading:true}));
const trunkMat=std('#8a5a36');
function tree(x,z,s,k,parent){const g=new THREE.Group();g.position.set(x,0,z);(parent||scene).add(g);
  mk(trunkG,trunkMat,0,.5*s,0,s,s,s,g);
  if(k%2) mk(ballG,leafMats[k%4],0,1.7*s,0,1.1*s,1.2*s,1.1*s,g); else mk(treeG,leafMats[k%4],0,2.0*s,0,1.1*s,1.1*s,1.1*s,g);
  return g;}
for(let k=0;k<44;k++){const side=k%4,u=(hash(k*3.1)-.5)*(BW-4);const off=BW/2-1.3;
  const x= side===0?u: side===1?u: side===2?-off: off; const z= side===0?-off: side===1?off: u;
  if(side===1 && Math.abs(x)<5) continue; // 手前中央は道の入口
  tree(x,z,.7+hash(k)*.5,k);}

// 雲
const clouds=[];
for(let k=0;k<6;k++){const g=new THREE.Group();scene.add(g);const m=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,transparent:true,flatShading:true});
  for(let j=0;j<5;j++){const s=1.6+hash(k*9+j)*1.8;const b=new THREE.Mesh(ballG,m);b.position.set((j-2)*1.9,hash(k*5+j)*.8,hash(k*7+j)*1.2);b.scale.set(s,s*.7,s);g.add(b);}
  g.userData={m,x0:-60+k*24,y:20+hash(k)*6,z:-30+hash(k*2)*30};clouds.push(g);}

// ---------- 16の世界 ----------
// fate: ok / stop(工事が止まる) / scaffold(足場のまま) / cold(窓が冷たい)
const FIN = {plaster:'#f6f2ea',wood:'#c98b55',brick:'#c0563f',galva:'#8e9aa6',navy:'#3d5a80',mint:'#9ed9c3',butter:'#f2d27a',coral:'#f08a6c',sage:'#a9c49a'};
const ROOF = ['#4b5563','#2f3e4e','#a0522d','#6b7f5e','#3b3b48','#8a4b3a'];
const worlds = [
 {roof:'gable',st:2,w:6.4,d:5.2,fin:'wood',rc:2,cp:2,shed:1},
 {roof:'flat',st:2,w:6.8,d:5.4,fin:'navy',rc:1,cp:2,shed:1},
 {roof:'gable',st:2,w:6.6,d:5.4,fin:'butter',rc:2,cp:0,shed:0,fate:'stop'},
 {roof:'flat',st:2,w:6.2,d:5.2,fin:'plaster',rc:1,cp:1,shed:0,fate:'scaffold'},
 {roof:'shed',st:2,w:6.0,d:5.0,fin:'galva',rc:0,cp:1,shed:1},
 {roof:'gable',st:2,w:6.8,d:5.6,fin:'brick',rc:4,cp:2,shed:1},
 {roof:'flat',st:2,w:6.6,d:5.4,fin:'plaster',rc:0,cp:0,shed:1,me:1,eave:1,big:1},
 {roof:'gable',st:1,w:7.2,d:5.4,fin:'sage',rc:3,cp:1,shed:1},
 {roof:'flat',st:2,w:6.0,d:5.0,fin:'coral',rc:1,cp:2,shed:0},
 {roof:'gable',st:2,w:6.4,d:5.2,fin:'mint',rc:5,cp:2,shed:1},
 {roof:'gable',st:2,w:7.0,d:5.6,fin:'galva',rc:1,cp:2,shed:1},
 {roof:'shed',st:2,w:6.2,d:5.2,fin:'wood',rc:0,cp:1,shed:0},
 {roof:'gable',st:1,w:7.4,d:5.4,fin:'plaster',rc:2,cp:2,shed:1},
 {roof:'flat',st:2,w:6.4,d:5.2,fin:'brick',rc:1,cp:1,shed:1},
 {roof:'flat',st:2,w:6.6,d:5.4,fin:'plaster',rc:0,cp:0,shed:1,big:1,fate:'cold'},
 {roof:'gable',st:2,w:6.6,d:5.4,fin:'navy',rc:3,cp:2,shed:1},
];
const WHITE = C('#f4f4f2');
const h1=2.7, h2=2.6;
const triShape=(span,rh,ov)=>{const s=new THREE.Shape();s.moveTo(-span/2-ov,0);s.lineTo(span/2+ov,0);s.lineTo(0,rh);s.closePath();return s;};
const shedShape=(span,rh,ov)=>{const s=new THREE.Shape();s.moveTo(-span/2-ov,0);s.lineTo(span/2+ov,0);s.lineTo(span/2+ov,.25);s.lineTo(-span/2-ov,rh);s.closePath();return s;};
function roofGeo(shape,len){const g=new THREE.ExtrudeGeometry(shape,{depth:len,bevelEnabled:false});g.translate(0,0,-len/2);g.rotateY(Math.PI/2);return g;}
// 看板（自作のキャンバス文字）
function signTex(txt){const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');x.fillStyle='#fffaf0';x.fillRect(0,0,256,128);x.strokeStyle='#d6453d';x.lineWidth=10;x.strokeRect(5,5,246,118);x.fillStyle='#d6453d';x.font='900 54px "Zen Kaku Gothic New",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,128,66);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}

const glassBase = C('#33475c');
worlds.forEach((w,i)=>{
  const p=lotC(i); const g=new THREE.Group(); g.position.copy(p); scene.add(g); w.g=g;
  const hx=1.4, hz=-1.6; w.hx=hx; w.hz=hz;
  w.fc=C(FIN[w.fin]); w.wall=std('#f4f4f2'); w.roofM=std(ROOF[w.rc]);
  w.delay = i===6?0.15:hash(i*13.7)*1.2; if(w.fate==='scaffold') w.delay=1.1;
  w.slab = mk(box,std('#d9d4c8'),hx,0.1,hz,w.w+.3,.2,w.d+.3,g);
  w.f1 = mk(box,w.wall,hx,0,hz,w.w,h1,w.d,g);
  w.f2 = w.st===2? mk(box,w.wall,hx,0,hz,w.w,h2,w.d,g):null;
  const top = .2+h1+(w.st===2?h2:0); w.top=top;
  if(w.roof==='flat'){ w.rf = mk(box,w.roofM,hx,top+.17,hz,w.w+.25,.34,w.d+.25,g); }
  else if(w.roof==='gable'){ w.rf = new THREE.Mesh(roofGeo(triShape(w.d,1.9,.45),w.w+.6),w.roofM); w.rf.position.set(hx,top,hz); w.rf.castShadow=true; g.add(w.rf); }
  else { w.rf = new THREE.Mesh(roofGeo(shedShape(w.d,1.5,.4),w.w+.5),w.roofM); w.rf.position.set(hx,top,hz); w.rf.castShadow=true; g.add(w.rf); }
  if(w.eave){ w.ev = mk(box,std('#3b3b48'),hx+.4,.2+h1+.05,hz+w.d/2+.55,w.w*.72,.12,1.1,g); }
  // 窓（夜に灯る）
  w.wins=[];
  const addWin=(x,y,z,ww,hh,ry,k)=>{const m=new THREE.MeshStandardMaterial({color:glassBase,roughness:.25,metalness:.1,emissive:C('#ffc46b'),emissiveIntensity:0,transparent:true,opacity:0});
    const pl=new THREE.Mesh(new THREE.PlaneGeometry(ww,hh),m);pl.position.set(x,y,z);pl.rotation.y=ry;g.add(pl);w.wins.push({m,k});};
  const zf=hz+w.d/2+.02, xf=hx+w.w/2+.02;
  if(w.big){ addWin(hx+.4,.2+1.15,zf,w.w*.62,1.9,0,0); }
  else { addWin(hx-w.w*.22,.2+1.25,zf,1.2,1.3,0,0); addWin(hx+w.w*.22,.2+1.25,zf,1.2,1.3,0,1); }
  if(w.st===2){ addWin(hx-w.w*.28,.2+h1+1.3,zf,.95,.9,0,2); addWin(hx+.05,.2+h1+1.3,zf,.95,.9,0,3); addWin(hx+w.w*.3,.2+h1+1.3,zf,.95,.9,0,4); }
  addWin(xf,.2+1.3,hz,1.0,1.0,Math.PI/2,5);
  w.door = new THREE.Mesh(new THREE.PlaneGeometry(.95,2.0),std('#7a4b2a'));
  w.door.position.set(hx-w.w/2+.75,.2+1.0,zf+.01); g.add(w.door);
  // カーポート・物置・庭の木
  w.ext=[];
  if(w.cp){const cg=new THREE.Group();cg.position.set(-2.6,0,3.3);g.add(cg);const span=w.cp*2.7;
    for(const sx of [-span/2+.15,span/2-.15]) for(const sz of [-1.3,1.3]) mk(box,std('#dfe3e8'),sx,1.2,sz,.16,2.4,.16,cg);
    mk(box,std('#e9edf1'),0,2.45,0,span+.3,.12,3.0,cg);
    const carC=['#e2574c','#3d7dd8','#f2c14e','#ffffff'];
    for(let k=0;k<w.cp;k++) mk(box,std(carC[(i+k)%4],{roughness:.4}),-span/2+1.35+k*2.7,.55,0,1.5,.8,2.6,cg);
    w.ext.push(cg);}
  if(w.shed){w.ext.push(mk(box,std(['#e2574c','#f2c14e','#5fa8d3','#9ed9c3'][i%4]),-3.6,.7,-3.6,1.6,1.4,1.1,g));}
  w.ext.push(tree(4.0,3.6,.55+hash(i)*.25,i,g)); if(i%3) w.ext.push(tree(-4.1,.6,.45,i+1,g));
  // 地縄（ひも）
  w.rope = ropeRect(hx,hz,w.w+.4,w.d+.4); g.add(w.rope);
  // 工事が止まる世界：骨組みと看板
  if(w.fate==='stop'){
    w.frame=new THREE.Group(); g.add(w.frame); const fm=std('#e8c48c');
    for(let a=0;a<=4;a++) for(const zz of [-w.d/2,w.d/2]) mk(box,fm,hx-w.w/2+a*w.w/4,.2+h1,hz+zz,.18,h1*2,.18,w.frame);
    for(const yy of [h1,h1*2]) for(const zz of [-w.d/2,w.d/2]) mk(box,fm,hx,.2+yy,hz+zz,w.w,.18,.18,w.frame);
    const sg=new THREE.Group(); sg.position.set(-1.6,0,3.4); g.add(sg); w.sign=sg;
    mk(box,std('#8a5a36'),-.8,.8,0,.1,1.6,.1,sg); mk(box,std('#8a5a36'),.8,.8,0,.1,1.6,.1,sg);
    const sm=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.1),new THREE.MeshStandardMaterial({map:signTex('工事中断'),roughness:.9}));sm.position.set(0,1.5,.06);sg.add(sm);
  }
  if(w.fate==='scaffold'){
    w.scf=new THREE.Group(); g.add(w.scf); const pm=std('#9aa7b4',{metalness:.3,roughness:.5});
    const ww=w.w+1.2, dd=w.d+1.2, hh=h1+h2+1.0;
    for(let a=0;a<=4;a++) for(const zz of [-dd/2,dd/2]) mk(box,pm,hx-ww/2+a*ww/4,hh/2,hz+zz,.1,hh,.1,w.scf);
    for(let b=1;b<=3;b++) for(const zz of [-dd/2,dd/2]) mk(box,pm,hx,b*hh/3.2,hz+zz,ww,.08,.08,w.scf);
    const net=new THREE.Mesh(new THREE.PlaneGeometry(ww,hh),new THREE.MeshStandardMaterial({color:0x4a90d9,transparent:true,opacity:.42,side:THREE.DoubleSide}));
    net.position.set(hx,hh/2,hz+dd/2+.05); w.scf.add(net);
  }
});

// ---------- 自作の管（線を太く光らせる） ----------
function tubeBuf(n,rad=6){
  const pos=new Float32Array(n*rad*3), col=new Float32Array(n*rad*3), idx=[];

    const s0=scr(v); const cx=s0.x+c.dx, cy=s0.y+c.dy; c.el.style.left=cx+'px'; c.el.style.top=cy+'px'; c.el.style.opacity=s0.ok?op:0;
    c.el.style.transform=`translate(-50%,-50%) scale(${.85+.15*back(cl((t-a)/.5))})`;
    const ln=leaders[k]; ln.setAttribute('x1',s0.x);ln.setAttribute('y1',s0.y);ln.setAttribute('x2',cx+(c.dx>0?-120:120));ln.setAttribute('y2',cy);ln.style.opacity=s0.ok?op:0;
    dots[k].setAttribute('cx',s0.x);dots[k].setAttribute('cy',s0.y);dots[k].style.opacity=s0.ok?op:0;});
  // 日数
  let days; if(t<4){hudk.textContent='地縄を張った日';days=null;}
  else if(t<9){hudk.textContent='着工から';days=Math.round(lerp(0,270,lin(4,9,t)));}
  else {hudk.textContent='入居から';days=Math.round(lerp(0,365,lin(9,11.6,t)));}
  hudd.textContent = days===null? '0日' : (t>=11.6?'1年後':days+'日');
  huds.textContent = t<9?'16の世界で、同時に':(t<11.6?'季節がめぐる':'冬の夜');
  const hud=document.getElementById('hud'); const dark=night>.5; hud.style.color=dark?'#fffaf0':'#1d2433'; document.getElementById('count').style.color=hud.style.color;
  hud.style.opacity=1-ss(15.6,16.2,t); document.getElementById('count').style.opacity=hud.style.opacity;
  const alive=16-(t>7.6?1:0); countb.textContent=alive+'';
  // ログ
  const seen=EV.filter(e=>e[0]<=t); const last=seen.slice(-4);
  tickRows.forEach((d,k)=>{const e=last[k]; if(!e){d.style.opacity=0;return;} d.style.opacity=(1-ss(11.4,12,t)); d.innerHTML=`<b>${e[1]}</b>${e[2]}`; d.className=(k===last.length-1&&t-e[0]<.6)?'new':'';});
  title.style.opacity=ss(16.2,17.0,t); title.style.transform=`translateY(${(1-ss(16,17,t))*24}px)`;
  flash.style.opacity=Math.max(ss(19.4,20,t),1-ss(0,.45,t));
}
window.render=render;

// ---------- 再生 ----------
const q=new URLSearchParams(location.search); const fixed=q.has('t')?parseFloat(q.get('t')):null;
let playing=fixed===null, t0=performance.now(), base=fixed||0;
const scrub=document.getElementById('scrub'),tt=document.getElementById('tt'),pp=document.getElementById('pp');
pp.onclick=()=>{playing=!playing;if(playing){t0=performance.now();}pp.textContent=playing?'一時停止':'再生';};
scrub.oninput=()=>{base=parseFloat(scrub.value);t0=performance.now();if(!playing)render(base);};
function loop(now){if(playing){const t=(base+(now-t0)/1000)%DUR;render(t);scrub.value=t;tt.textContent=t.toFixed(2)+'s';}requestAnimationFrame(loop);}
document.fonts.ready.then(()=>{render(base);window.READY=true;requestAnimationFrame(loop);});
</script>
