<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16まいの、わが家の絵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FFF4D9; --ink: #3B3A40; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: 1920px; height: 1080px; transform-origin: center; box-shadow: 0 10px 40px rgba(120, 90, 30, .18); border-radius: 6px; }
  #ui { position: fixed; left: 16px; bottom: 12px; font: 13px 'Zen Maru Gothic', sans-serif; color: #8a7a55; display: flex; gap: 10px; align-items: center; }
  #ui button { font: inherit; border: 1px solid #d8c79a; background: #fffaf0; color: #6b5b35; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #ui input { width: 220px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ui"><button id="pp">一時停止</button><input id="sc" type="range" min="0" max="16" step="0.01" value="0"><span id="tt">0.0 秒</span></div>
<script src="kid.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DUR = 16;
window.DUR = DUR;
function fit() {
  const s = Math.min(innerWidth / 1920, (innerHeight - 40) / 1080);
  cv.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

// グリッド（抽象化された16の敷地）
const CW = 380, CH = 214, GAP = 20;
const GX = (1920 - (CW * 4 + GAP * 3)) / 2, GY = 150;
const cell = lot => { const i = lot - 1, c = i % 4, r = Math.floor(i / 4); return { x: GX + c * (CW + GAP), y: GY + r * (CH + GAP) }; };
const byLot = {}; WORLDS.forEach(w => byLot[w.lot] = w);
const MINE = 7;

// カメラの状態
const c7 = cell(MINE);
const CAM_OPEN = { cx: c7.x + CW / 2, cy: c7.y + CH / 2 + 10, z: 4.6 };
const CAM_LETTER = { cx: c7.x + CW / 2 + 112, cy: c7.y + CH / 2 + 4, z: 3.03 };
const CAM_GRID = { cx: 960, cy: 606, z: 0.9 };
function camAt(t) {
  const mix = (a, b, k) => ({ cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), k)) });
  if (t < 3.2) return CAM_OPEN;
  if (t < 4.5) return mix(CAM_OPEN, CAM_GRID, easeIO(seg(t, 3.2, 4.5)));
  if (t < 9.0) return CAM_GRID;
  if (t < 10.2) return mix(CAM_GRID, CAM_LETTER, easeIO(seg(t, 9.0, 10.2)));
  if (t < 13.4) return CAM_LETTER;
  if (t < 14.6) return mix(CAM_LETTER, CAM_GRID, easeIO(seg(t, 13.4, 14.6)));
  return CAM_GRID;
}

function paperBg(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#FFF4D9'; ctx.fillRect(0, 0, 1920, 1080);
  // 机の上の方眼（うすく）
  ctx.strokeStyle = 'rgba(214, 186, 120, .16)'; ctx.lineWidth = 1;
  for (let x = 0; x <= 1920; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke(); }
  for (let y = 0; y <= 1080; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }
}

function cardFrame(w, x, y, a, rot, bs) {
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x + CW / 2, y + CH / 2); ctx.rotate(rot); ctx.translate(-CW / 2, -CH / 2);
  ctx.shadowColor = 'rgba(120, 90, 30, .22)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, CW, CH);
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

function drawCard(w, t, bs, st) {
  const { x, y } = cell(w.lot);
  const rot = (hash(w.lot, 3, 5) - .5) * .035;
  const a = st.alpha, sc = st.scale || 1;
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x + CW / 2, y + CH / 2); ctx.rotate(rot); ctx.scale(sc, sc); ctx.translate(-CW / 2, -CH / 2);
  ctx.shadowColor = 'rgba(120, 90, 30, .22)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, CW, CH);
  ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.rect(0, 0, CW, CH); ctx.clip();
  const seed = w.lot * 1000 + bs;
  const spec = Object.assign({}, w.spec);
  // 03：描いた家が消しゴムで消える
  let houseAlpha = 1;
  if (w.lot === 3) {
    const e = seg(t, 5.0, 6.2);
    if (e < 1) { spec.fate = undefined; houseAlpha = 1 - e; }
  }
  if (w.lot === 16) spec.fate = t > 5.4 ? 'vacant' : undefined;
  if (w.lot === 16 && t <= 5.4) spec.lit = true;
  kidHouse(ctx, spec, 0, 0, 1, seed, st.p, { houseAlpha, cold: w.lot === 15 ? seg(t, 5.6, 6.6) : 0, w: 2.6 });
  if (w.lot === 3) {
    const e = seg(t, 5.0, 6.2);
    if (e > 0 && e < 1) {
      // 消しゴムのこすり跡
      ctx.save(); ctx.globalAlpha = .9 * Math.sin(e * Math.PI);
      for (let i = 0; i < 8; i++) crayon(ctx, [[130 + i * 4, 70 + i * 12], [290 - i * 3, 64 + i * 13]], '#FFFFFF', 16, seed + 300 + i, e * 1.4);
      ctx.restore();
    }
    if (e >= .7) { const s2 = Object.assign({}, w.spec); emptyLot(ctx, s2, 182, seed, seg(t, 5.8, 6.6), 2.6); }
  }
  // 区画の番号
  kidText(ctx, String(w.lot).padStart(2, '0'), 14, 30, 24, w.mine ? C.red : C.ink, { weight: 600, alpha: st.p > .05 ? 1 : 0 });
  // 11：打ち合わせの正の字
  if (w.tally) {
    const n = Math.floor(lerp(0, w.tally, seg(t, 5.2, 7.0)));
    for (let i = 0; i < n; i++) {
      const g = Math.floor(i / 5), k = i % 5;
      const bx = 252 + g * 30, by = 18;
      if (k < 4) crayon(ctx, [[bx + k * 5, by], [bx + k * 5 + 1, by + 22]], C.red, 2.4, seed + 400 + i);
      else crayon(ctx, [[bx - 3, by + 18], [bx + 20, by + 4]], C.red, 2.4, seed + 400 + i);
    }
    if (n > 0) kidText(ctx, 'うちあわせ', 252, 58, 14, C.red, { alpha: seg(t, 5.2, 5.6) });
  }
  ctx.restore();

  // テープに数字（エンジンが出した値をそのまま出す想定）
  const tp = st.tape;
  if (tp > 0) {
    ctx.save();
    ctx.globalAlpha = a * easeOut(tp);
    const tx = x + CW - 84, ty = y + CH - 26;
    tape(ctx, tx, ty, 150, 42, -0.04 + rot, 'rgba(255, 255, 255, .9)');
    tape(ctx, tx, ty, 150, 42, -0.04 + rot, w.mine ? 'rgba(232,85,58,.30)' : 'rgba(247,200,30,.45)');
    const neg = /^[−+]/.test(w.num) && w.num[0] === '−' || w.lot === 15 || w.lot === 16;
    numText(ctx, w.num, tx + 4, ty + 9, w.num.length > 5 ? 22 : 27, neg ? C.blue : (w.mine ? C.red : C.ink), { align: 'center' });
    if (w.sub) kidText(ctx, w.sub, tx - 66, ty - 25, 14, '#6b5b35', { alpha: 1 });
    ctx.restore();
  }
}

// こどもが丸をつける（くわしく見られる4つの世界）
function circleCard(lot, p, col, seed) {
  if (p <= 0) return;
  const { x, y } = cell(lot);
  const pts = ellipsePts(x + CW / 2, y + CH / 2, CW / 2 + 10, CH / 2 + 12, -2.2, -2.2 + Math.PI * 2.15, 60)
    .map(([px, py], i) => [px + (hash(seed, i, 1) - .5) * 5, py + (hash(seed, i, 2) - .5) * 5]);
  crayon(ctx, pts, col, 5, seed, p);
}

function star(cx, cy, r, col, seed, p) {
  const pts = [];
  for (let i = 0; i <= 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  scribble(ctx, pts, col, seed, 4, .9, p);
  crayon(ctx, pts, '#B8331E', 2.4, seed + 1, p);
}

// 07のなか：家族の後ろ姿とうさぎ（はじめと手紙の場面）
function family07(t, bs, p, alive) {
  const { x, y } = cell(MINE);
  const rot = (hash(MINE, 3, 5) - .5) * .035;
  ctx.save();
  ctx.translate(x + CW / 2, y + CH / 2); ctx.rotate(rot); ctx.translate(-CW / 2, -CH / 2);
  const gy = 206, sd = 5000 + bs;
  personBack(ctx, 40, gy, 74, C.blue, C.brown, sd + 1, seg(p, .55, .8));
  personBack(ctx, 76, gy, 68, C.orange, C.ink, sd + 20, seg(p, .6, .85));
  personBack(ctx, 104, gy, 44, C.yellow, C.brown, sd + 40, seg(p, .68, .9), alive ? -Math.abs(Math.sin(t * 5)) * 3 : 0);
  personBack(ctx, 126, gy, 36, C.pink, C.ink, sd + 60, seg(p, .72, .95));
  if (p > .85 || alive) {
    const hop = alive ? Math.abs(Math.sin(t * 4.2)) * 12 : 0;
    const rx = alive ? 124 + ((t * 18) % 44) : 146;
    rabbit(ctx, rx, 182, 18, sd + 80 + Math.floor(t * 8), hop);
  }
  ctx.restore();
}

function letter(t, bs) {
  // 画面座標の手紙
  const a = easeOut(seg(t, 10.0, 10.6)) * (1 - seg(t, 13.1, 13.5));
  if (a <= 0) return;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = a;
  ctx.translate(1560, 540 + (1 - a) * 30); ctx.rotate(.035); ctx.scale(.9, .9);
  ctx.shadowColor = 'rgba(120,90,30,.25)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = '#FFFDF6'; ctx.fillRect(-330, -390, 660, 780);
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(134, 204, 242, .55)'; ctx.lineWidth = 2;
  for (let i = 0; i < 11; i++) { ctx.beginPath(); ctx.moveTo(-290, -280 + i * 62); ctx.lineTo(290, -280 + i * 62); ctx.stroke(); }
  tape(ctx, 0, -392, 180, 46, -.05, 'rgba(242,141,178,.45)');
  kidText(ctx, '1ねんごの わたしたちへ', -280, -300, 40, C.red, { weight: 600 });
  const lines = [
    ['まどの そばは、2がつも あったかい。', C.ink],
    ['カーポートは、まだ ない。', C.ink],
    ['あさは まどの しもを 5ふん けずる。', C.ink],
    ['うさぎは にわを 3しゅう した。', C.ink]
  ];
  lines.forEach(([s, col], i) => {
    const k = seg(t, 10.5 + i * .55, 10.9 + i * .55);
    if (k <= 0) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(-290, -270 + i * 62, 580 * k, 62); ctx.clip();
    kidText(ctx, s, -280, -228 + i * 62, 33, col);
    ctx.restore();
  });
  // とったもの／てばなしたもの
  const k2 = seg(t, 12.6, 13.0);
  if (k2 > 0) {
    ctx.globalAlpha = a * k2;
    kidText(ctx, 'とったもの', -280, 74, 26, C.green);
    kidText(ctx, '◎ ぞうさくの キッチン', -270, 116, 26, C.ink);
    kidText(ctx, '◎ あったかい まど', -270, 156, 26, C.ink);
    kidText(ctx, 'いまは がまん', 40, 74, 26, C.blue);
    kidText(ctx, '△ カーポート', 50, 116, 26, C.ink);
    kidText(ctx, '△ ライトアップ', 50, 156, 26, C.ink);
    numText(ctx, '2月の朝 20℃ ／ 返済 月13.0万円（簡易計算）', -280, 300, 22, '#7a6a45');
  }
  ctx.restore();
}

function caption(t, s, t0, t1, y = 1010, size = 40, col = C.ink) {
  const a = seg(t, t0, t0 + .4) * (1 - seg(t, t1 - .4, t1));
  if (a <= 0) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = a;
  ctx.font = `600 ${size}px 'Klee One', sans-serif`;
  const tw = ctx.measureText(s).width;
  ctx.fillStyle = 'rgba(255, 251, 241, .92)';
  ctx.beginPath(); ctx.roundRect(960 - tw / 2 - 30, y - size - 14, tw + 60, size + 34, 14); ctx.fill();
  ctx.fillStyle = col; ctx.textAlign = 'center';
  ctx.fillText(s, 960, y);
  ctx.restore();
}

function title(t, bs) {
  const k = seg(t, 14.4, 15.2);
  if (k <= 0) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1 - seg(t, 15.6, 16);
  ctx.fillStyle = 'rgba(255, 244, 217, .9)';
  ctx.fillRect(0, 0, 1920, 124);
  ctx.beginPath(); ctx.rect(0, 0, 1920 * easeOut(k), 140); ctx.clip();
  kidText(ctx, '16軒目の、わが家', 960, 78, 64, C.red, { align: 'center', weight: 600 });
  ctx.restore();
  const k2 = seg(t, 14.9, 15.3);
  if (k2 > 0) {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = k2 * (1 - seg(t, 15.6, 16));
    kidText(ctx, '同じふたりの、選ばなかった15の未来といっしょに。', 960, 114, 24, '#6b5b35', { align: 'center' });
    ctx.restore();
  }
}

function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  const bs = Math.floor(t * 8) * 17; // クレヨンのゆらぎ（毎秒8回）
  paperBg(t);
  const cam = camAt(t);
  ctx.setTransform(cam.z, 0, 0, cam.z, 960 - cam.cx * cam.z, 540 - cam.cy * cam.z);

  // 07以外のカード
  for (let lot = 1; lot <= 16; lot++) {
    if (lot === MINE) continue;
    const w = byLot[lot];
    const order = [6, 3, 11, 8, 2, 10, 15, 1, 5, 12, 9, 14, 4, 13, 16].indexOf(lot);
    const t0 = 3.35 + order * .07;
    const focus = seg(t, 9.2, 9.9) * (1 - seg(t, 13.3, 14.0));
    const a = easeOut(seg(t, t0, t0 + .35));
    const sc = lerp(1.12, 1, easeBack(seg(t, t0, t0 + .45)));
    const p = seg(t, t0 + .1, t0 + 1.0);
    const tapeT = seg(t, 4.8 + order * .06, 5.2 + order * .06);
    drawCard(w, t, bs, { alpha: a, scale: sc, p, tape: tapeT });
  }
  // 手紙の場面では、ほかの15枚をうすくする
  const focus = seg(t, 9.2, 9.9) * (1 - seg(t, 13.3, 14.0));
  if (focus > 0) { ctx.save(); ctx.fillStyle = `rgba(255,244,217,${.82 * focus})`; ctx.fillRect(-200, -200, 2400, 1500); ctx.restore(); }
  // 07（はじめから描かれる）
  const p7 = seg(t, .15, 2.8);
  drawCard(byLot[MINE], t, bs, { alpha: 1, p: p7, tape: seg(t, 4.8, 5.2) * (1 - seg(t, 9.0, 9.6) + seg(t, 13.4, 14.0)) });
  const alive = t > 9.8 && t < 13.6;
  family07(t, bs, t < 4.6 ? seg(t, .15, 2.8) : 1, alive);

  // 丸と星
  if (t < 9.2) {
    const fade = 1;
    circleCard(3, seg(t, 6.3, 6.9) * fade, C.red, 900 + bs);
    circleCard(11, seg(t, 6.9, 7.5) * fade, C.red, 920 + bs);
    circleCard(15, seg(t, 7.5, 8.1) * fade, C.blue, 940 + bs);
    circleCard(MINE, seg(t, 8.1, 8.7) * fade, C.orange, 960 + bs);
  } else if (t > 14.0) {
    [3, 11, 15].forEach((l, i) => circleCard(l, 1, l === 15 ? C.blue : C.red, 900 + i * 20 + bs));
    circleCard(MINE, 1, C.orange, 960 + bs);
  }
  const s7 = cell(MINE);
  if (t > 8.4 && t < 9.4 || t > 14.2) star(s7.x + CW - 22, s7.y + 12, 26, C.yellow, 980 + bs, seg(t, t > 14 ? 14.2 : 8.4, t > 14 ? 14.6 : 8.8));

  // 文字
  caption(t, 'ここに、うちを たてるんだって。', .8, 3.2, 1040, 44);
  caption(t, '同じ ふたり。16とおりの、1ねんご。', 6.0, 9.0, 1046, 38);
  letter(t, bs);
  title(t, bs);
  // ループのつなぎ
  const f = seg(t, 15.55, 16);
  if (f > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,244,217,${f})`; ctx.fillRect(0, 0, 1920, 1080); }
  window.READY = true;
}
window.render = render;

// 再生（?t=秒 で静止）
const q = new URLSearchParams(location.search);
let playing = !q.has('t'), t0 = performance.now(), off = q.has('t') ? parseFloat(q.get('t')) : 0;
const sc = document.getElementById('sc'), tt = document.getElementById('tt'), pp = document.getElementById('pp');
pp.onclick = () => { if (playing) { off = cur(); playing = false; pp.textContent = '再生'; } else { t0 = performance.now(); playing = true; pp.textContent = '一時停止'; } };
sc.oninput = () => { off = parseFloat(sc.value); t0 = performance.now(); if (!playing) render(off); };
const cur = () => playing ? (off + (performance.now() - t0) / 1000) % DUR : off;
function loop() { const t = cur(); render(t); sc.value = t; tt.textContent = t.toFixed(1) + ' 秒'; requestAnimationFrame(loop); }
document.fonts.ready.then(() => { if (q.has('t')) { render(off); window.READY = true; } else loop(); });
setTimeout(() => { if (!window.READY) { render(off); } }, 1500);
</script>
</body>
</html>
