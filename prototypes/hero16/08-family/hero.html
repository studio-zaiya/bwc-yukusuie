<style>
  :root { --bg: #FFF4D9; --ink: #3B3A40; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: 1920px; height: 1080px; transform-origin: center; box-shadow: 0 10px 40px rgba(120, 90, 30, .18); border-radius: 6px; }
  #ui { position: fixed; left: 16px; bottom: 12px; font: 13px 'Zen Maru Gothic', sans-serif; color: #8a7a55; display: flex; gap: 10px; align-items: center; }
  #ui button { font: inherit; border: 1px solid #d8c79a; background: #fffaf0; color: #6b5b35; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  #ui input { width: 220px; }

<body>
<div id="wrap"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ui"><button id="pp">一時停止</button><input id="sc" type="range" min="0" max="16" step="0.01" value="0"><span id="tt">0.0 秒</span></div>
<script>
// クレヨン描画の共通部品（すべて自作）
const KW = 1920, KH = 1080;
const PAPER = '#FFFBF1';
const C = {
  red:'#E8553A', orange:'#F59A23', yellow:'#F7C81E', green:'#4FAE63', leaf:'#7CC46B',
  blue:'#3D7DD8', sky:'#86CCF2', brown:'#8A5A3B', pink:'#F28DB2', gray:'#8E959E',
  ink:'#3B3A40', cream:'#FFF1C9', brick:'#C9593F', wood:'#C98A4B', galv:'#9AA6B2',
  mint:'#9ED9C3', white:'#FFFFFF', purple:'#9B7BD4'
};

function hash(a, b, c) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeBack = k => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };

function resample(pts, step) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    const d = Math.hypot(x1 - x0, y1 - y0), n = Math.max(1, Math.ceil(d / step));
    for (let k = 1; k <= n; k++) out.push([x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n]);
  }
  return out;
}

// クレヨンの線。p は描き進み（0〜1）、seed で揺れが決まる
function crayon(ctx, pts, col, w, seed, p = 1, alpha = 1) {
  if (p <= 0 || pts.length < 2) return;
  const rs = resample(pts, Math.max(2.5, w * 1.1));
  const m = Math.max(2, Math.ceil(rs.length * clamp(p)));
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = col;
  for (let pass = 0; pass < 3; pass++) {
    ctx.globalAlpha = (0.38 + pass * 0.16) * alpha;
    ctx.lineWidth = w * (0.55 + pass * 0.22);
    ctx.beginPath();
    for (let i = 0; i < m; i++) {
      const jx = (hash(seed, i, pass * 3 + 1) - .5) * w * .55;
      const jy = (hash(seed, i, pass * 3 + 2) - .5) * w * .55;
      const [x, y] = rs[i];
      i ? ctx.lineTo(x + jx, y + jy) : ctx.moveTo(x + jx, y + jy);
    }
    ctx.stroke();
  }
  // 紙の目（線の中に白い抜けをつくる）
  ctx.globalAlpha = .4 * alpha;
  ctx.strokeStyle = PAPER;
  ctx.lineWidth = w * .3;
  ctx.setLineDash([w * .35, w * .9]);
  ctx.beginPath();
  for (let i = 0; i < m; i++) { const [x, y] = rs[i]; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  ctx.restore();
}

// クレヨンの塗り（斜めのぐるぐる線）。poly で切り抜き、p で塗り進む
function scribble(ctx, poly, col, seed, sp = 7, alpha = .5, p = 1) {
  if (p <= 0) return;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of poly) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
  ctx.save();
  ctx.beginPath();
  poly.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
  ctx.closePath();
  ctx.clip();
  ctx.strokeStyle = col; ctx.lineCap = 'round';
  ctx.lineWidth = sp * 1.05;
  ctx.globalAlpha = alpha;
  const h = y1 - y0, span = (x1 - x0) + h * .7;
  const lim = x0 - h * .7 + span * clamp(p);
  ctx.beginPath();
  let k = 0;
  for (let x = x0 - h * .7; x < lim; x += sp, k++) {
    const j1 = (hash(seed, k, 7) - .5) * sp * .8, j2 = (hash(seed, k, 9) - .5) * sp * .8;
    ctx.moveTo(x + j1, y1 + 2);
    ctx.lineTo(x + h * .7 + j2, y0 - 2);
  }
  ctx.stroke();
  ctx.restore();
}

const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y + .01]];
function ellipsePts(cx, cy, rx, ry, a0 = 0, a1 = Math.PI * 2, n = 40) {
  const o = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  return o;
}

function kidText(ctx, s, x, y, size, col, opts = {}) {
  ctx.save();
  ctx.font = `${opts.weight || 600} ${size}px 'Klee One', 'Zen Maru Gothic', sans-serif`;
  ctx.fillStyle = col;
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = opts.base || 'alphabetic';
  ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
  if (opts.rot) { ctx.translate(x, y); ctx.rotate(opts.rot); ctx.fillText(s, 0, 0); }
  else ctx.fillText(s, x, y);
  ctx.restore();
}
function numText(ctx, s, x, y, size, col, opts = {}) {
  ctx.save();
  ctx.font = `${opts.weight || 800} ${size}px 'Zen Maru Gothic', sans-serif`;
  ctx.fillStyle = col;
  ctx.textAlign = opts.align || 'left';
  ctx.textBaseline = opts.base || 'alphabetic';
  ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
  ctx.fillText(s, x, y);
  ctx.restore();
}

// マスキングテープ
function tape(ctx, x, y, w, h, rot, col = 'rgba(247,200,30,.55)') {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-w / 2, -h / 2);
  for (let i = 0; i <= 6; i++) ctx.lineTo(-w / 2 + w * i / 6, -h / 2 + (i % 2 ? 1.5 : -1.5));
  ctx.lineTo(w / 2, h / 2);
  for (let i = 6; i >= 0; i--) ctx.lineTo(-w / 2 + w * i / 6, h / 2 + (i % 2 ? -1.5 : 1.5));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// 後ろ姿の人（顔は描かない）
function personBack(ctx, x, gy, hgt, body, hair, seed, p = 1, bob = 0) {
  const hr = hgt * .2, top = gy - hgt + bob;
  const bodyPoly = [[x - hgt * .2, gy], [x - hgt * .14, top + hr * 2.1], [x + hgt * .14, top + hr * 2.1], [x + hgt * .2, gy]];
  scribble(ctx, bodyPoly, body, seed + 1, Math.max(3, hgt * .07), .75, seg(p, .2, 1));
  crayon(ctx, [...bodyPoly, bodyPoly[0]], C.ink, Math.max(1.6, hgt * .03), seed + 2, seg(p, 0, .6));
  scribble(ctx, ellipsePts(x, top + hr, hr, hr, 0, 6.3, 24), hair, seed + 3, Math.max(3, hgt * .06), .9, seg(p, .3, 1));
  crayon(ctx, ellipsePts(x, top + hr, hr, hr, 0, 6.3, 24), C.ink, Math.max(1.6, hgt * .03), seed + 4, seg(p, .1, .7));
}

function rabbit(ctx, x, gy, s, seed, hop = 0) {
  const y = gy - hop;
  const bodyP = ellipsePts(x, y - s * .45, s * .6, s * .42, 0, 6.3, 22);
  scribble(ctx, bodyP, '#FFFFFF', seed, Math.max(2, s * .12), 1);
  crayon(ctx, bodyP, C.gray, Math.max(1.4, s * .07), seed + 1);
  const head = ellipsePts(x + s * .5, y - s * .78, s * .3, s * .27, 0, 6.3, 18);
  scribble(ctx, head, '#FFFFFF', seed + 2, Math.max(2, s * .1), 1);
  crayon(ctx, head, C.gray, Math.max(1.4, s * .07), seed + 3);
  crayon(ctx, [[x + s * .42, y - s * 1.0], [x + s * .36, y - s * 1.5], [x + s * .5, y - s * 1.05]], C.gray, Math.max(1.4, s * .07), seed + 4);
  crayon(ctx, [[x + s * .6, y - s * 1.0], [x + s * .7, y - s * 1.48], [x + s * .7, y - s * 1.02]], C.gray, Math.max(1.4, s * .07), seed + 5);
  crayon(ctx, [[x + s * .62, y - s * 1.2], [x + s * .66, y - s * 1.36]], C.pink, Math.max(1.4, s * .06), seed + 6);
}

// こどもの絵の家（カード座標：幅380×高さ214、地面 y=gy）
// spec: roof 'gable'|'box'|'eave', wall, roofc, floors, carport, shed, lit, rabbit, tree, cold, fate
function kidHouse(ctx, spec, ox, oy, k, seed, p = 1, opt = {}) {
  ctx.save();
  ctx.translate(ox, oy); ctx.scale(k, k);
  const w = opt.w || 2.6;
  const gy = 182, hx = spec.hx || 205;
  const ww = spec.floors === 1 ? 170 : 124, wh = spec.floors === 1 ? 58 : 98;
  const L = hx - ww / 2, T = gy - wh;
  const grey = spec.fate === 'vacant';
  const ink = grey ? C.gray : C.ink;
  // 太陽と空
  if (!opt.noSun) {
    const sp = seg(p, 0, .15);
    scribble(ctx, ellipsePts(52, 46, 22, 22, 0, 6.3, 24), C.yellow, seed + 10, 5, .9, sp);
    for (let r = 0; r < 8; r++) {
      const a = r / 8 * Math.PI * 2 + .2;
      crayon(ctx, [[52 + Math.cos(a) * 30, 46 + Math.sin(a) * 30], [52 + Math.cos(a) * 40, 46 + Math.sin(a) * 40]], C.orange, w, seed + 20 + r, seg(p, .05, .2));
    }
    crayon(ctx, [[290, 40], [302, 30], [318, 34], [330, 28], [344, 38], [336, 48], [298, 50], [290, 40]], C.sky, w, seed + 30, seg(p, .1, .25));
  }
  // 地面
  crayon(ctx, [[8, gy + 2], [120, gy - 1], [260, gy + 2], [372, gy]], C.green, w * 1.2, seed + 1, seg(p, 0, .15));
  scribble(ctx, [[6, gy], [374, gy], [374, 210], [6, 210]], C.leaf, seed + 2, 7, .32, seg(p, .05, .2));

  if (spec.fate === 'empty' || spec.fate === 'pause') {
    if (!opt.skipEmpty) emptyLot(ctx, spec, gy, seed, seg(p, .15, 1), w);
    ctx.restore();
    return;
  }
  const ha = opt.houseAlpha == null ? 1 : opt.houseAlpha;
  ctx.globalAlpha = ha;
  // 壁
  const wallPoly = rectPts(L, T, ww, wh);
  scribble(ctx, wallPoly, grey ? '#C8CCD2' : spec.wall, seed + 3, 6, .62, seg(p, .2, .45));
  crayon(ctx, wallPoly, ink, w, seed + 4, seg(p, .15, .4));
  if (spec.wallTex === 'brick') {
    for (let r = 0; r < 5; r++) crayon(ctx, [[L + 4, T + 18 + r * 16], [L + ww - 4, T + 18 + r * 16]], 'rgba(120,40,30,.6)', w * .5, seed + 60 + r, seg(p, .35, .5));
  } else if (spec.wallTex === 'wood') {
    for (let r = 0; r < 7; r++) crayon(ctx, [[L + 10 + r * ww / 7, T + 4], [L + 10 + r * ww / 7, gy - 4]], 'rgba(110,60,25,.45)', w * .5, seed + 70 + r, seg(p, .35, .5));
  } else if (spec.wallTex === 'galv') {
    for (let r = 0; r < 10; r++) crayon(ctx, [[L + 6 + r * ww / 10, T + 3], [L + 6 + r * ww / 10, gy - 3]], 'rgba(70,80,95,.4)', w * .4, seed + 80 + r, seg(p, .35, .5));
  }
  // 屋根
  const rp = seg(p, .45, .65);
  if (spec.roof === 'gable') {
    const roofPoly = [[L - 12, T + 2], [hx, T - 52], [L + ww + 12, T + 2], [L - 12, T + 2]];
    scribble(ctx, roofPoly, grey ? '#A7ADB5' : spec.roofc, seed + 5, 6, .75, rp);
    crayon(ctx, roofPoly, ink, w, seed + 6, rp);
  } else {
    const par = [[L - 4, T - 9], [L + ww + 4, T - 9], [L + ww + 4, T + 1], [L - 4, T + 1], [L - 4, T - 9]];
    scribble(ctx, par, grey ? '#A7ADB5' : spec.roofc, seed + 5, 5, .8, rp);
    crayon(ctx, par, ink, w, seed + 6, rp);
    if (spec.roof === 'eave') {
      const ey = gy - 52;
      crayon(ctx, [[L + 8, ey], [L + ww + 26, ey - 6]], ink, w * 1.3, seed + 7, seg(p, .55, .7));
      scribble(ctx, [[L + 8, ey - 3], [L + ww + 26, ey - 9], [L + ww + 26, ey - 2], [L + 8, ey + 4]], spec.roofc, seed + 8, 4, .8, seg(p, .55, .7));
    }
  }
  // 窓とドア
  const wp = seg(p, .62, .8);
  const winFill = grey ? '#6C727B' : (spec.lit ? C.yellow : C.sky);
  const wins = [];
  if (spec.floors === 1) {
    wins.push(rectPts(L + 14, gy - 42, 54, 30), rectPts(L + 104, gy - 42, 30, 22));
  } else {
    wins.push(rectPts(L + 14, T + 14, 28, 22), rectPts(L + ww - 44, T + 14, 28, 22));
    wins.push(rectPts(L + 12, gy - 40, 62, 30));
  }
  for (let i = 0; i < wins.length; i++) {
    scribble(ctx, wins[i], winFill, seed + 40 + i, 5, .85, wp);
    crayon(ctx, wins[i], ink, w * .9, seed + 45 + i, wp);
  }
  const door = rectPts(L + ww - 34, gy - 44, 22, 44);
  scribble(ctx, door, grey ? '#7C828B' : C.brown, seed + 50, 5, .8, wp);
  crayon(ctx, door, ink, w * .9, seed + 51, wp);
  // つめたい窓（青いぐるぐる）
  if (spec.cold && opt.cold > 0) {
    for (let i = 0; i < 3; i++) {
      const cx = L + 20 + i * 20, cy = gy - 52 - i * 6;
      crayon(ctx, ellipsePts(cx, cy, 7, 5, 0, Math.PI * 3.2, 26).map(([x, y], j) => [x + j * .5, y]), C.blue, w * .9, seed + 90 + i, opt.cold);
    }
  }
  ctx.globalAlpha = 1;
  // 外まわり
  const ep = seg(p, .8, 1);
  const right = L + ww + 10;
  if (spec.carport > 0) {
    const cw = spec.carport === 2 ? 92 : 50;
    crayon(ctx, [[right + 4, gy], [right + 4, gy - 48], [right + cw, gy - 50], [right + cw, gy]], ink, w, seed + 100, ep);
    for (let c = 0; c < spec.carport; c++) car(ctx, right + 10 + c * 42, gy, spec.carColors ? spec.carColors[c] : C.red, seed + 110 + c, ep, w);
  } else if (spec.gravel) {
    for (let i = 0; i < 14; i++) crayon(ctx, ellipsePts(right + 8 + (i % 7) * 9, gy - 3 - Math.floor(i / 7) * 5, 2.4, 1.6, 0, 6.3, 6), C.gray, w * .5, seed + 120 + i, ep);
    if (spec.carColors) car(ctx, right + 14, gy, spec.carColors[0], seed + 129, ep, w);
  }
  if (spec.shed) {
    const sx = L - 42;
    const sh = rectPts(sx, gy - 28, 28, 28);
    scribble(ctx, sh, C.galv, seed + 130, 4, .7, ep);
    crayon(ctx, sh, ink, w * .9, seed + 131, ep);
  }
  if (spec.tree) {
    const tx = spec.shed ? L - 70 : L - 34;
    crayon(ctx, [[tx, gy], [tx, gy - 30]], C.brown, w * 1.4, seed + 140, ep);
    scribble(ctx, ellipsePts(tx, gy - 44, 18, 18, 0, 6.3, 20), C.green, seed + 141, 5, .8, ep);
    crayon(ctx, ellipsePts(tx, gy - 44, 18, 18, 0, 6.3, 20), '#2F7D45', w * .8, seed + 142, ep);
  }
  if (spec.fence) {
    for (let i = 0; i < 6; i++) crayon(ctx, [[L - 60 + i * 9, gy], [L - 60 + i * 9, gy - 14]], C.wood, w * .7, seed + 150 + i, ep);
    crayon(ctx, [[L - 62, gy - 9], [L - 12, gy - 9]], C.wood, w * .7, seed + 157, ep);
  }
  ctx.restore();
}

function car(ctx, x, gy, col, seed, p, w) {
  const body = [[x, gy - 7], [x + 4, gy - 18], [x + 12, gy - 26], [x + 28, gy - 26], [x + 34, gy - 18], [x + 38, gy - 7], [x, gy - 7]];
  scribble(ctx, body, col, seed, 4, .8, p);
  crayon(ctx, body, C.ink, w * .8, seed + 1, p);
  crayon(ctx, ellipsePts(x + 9, gy - 5, 4, 4, 0, 6.3, 10), C.ink, w, seed + 2, p);
  crayon(ctx, ellipsePts(x + 29, gy - 5, 4, 4, 0, 6.3, 10), C.ink, w, seed + 3, p);
}

function emptyLot(ctx, spec, gy, seed, p, w) {
  // 看板
  const sx = 190;
  crayon(ctx, [[sx, gy], [sx, gy - 60]], C.brown, w * 1.3, seed + 200, seg(p, 0, .4));
  const board = rectPts(sx - 52, gy - 102, 104, 44);
  scribble(ctx, board, '#FFFFFF', seed + 201, 5, 1, seg(p, .2, .6));
  crayon(ctx, board, C.ink, w, seed + 202, seg(p, .2, .6));
  kidText(ctx, spec.sign || 'あきち', sx, gy - 72, 24, C.ink, { align: 'center', alpha: seg(p, .5, .8) });
  // 雑草
  for (let i = 0; i < 9; i++) {
    const x = 40 + i * 37 + hash(seed, i, 3) * 10;
    crayon(ctx, [[x, gy], [x - 4, gy - 12], [x + 2, gy - 3], [x + 6, gy - 14], [x + 6, gy]], C.green, w * .8, seed + 210 + i, seg(p, .5, 1));
  }
}

// 16の世界（同じふたりの、16とおりの1年後）
// path: 4つの分かれ道の答え（L/R）、graft は2択の外の答え
const FORKS = [
  { name: '会社えらび', L: '大手のハウスメーカー', R: '地元の工務店' },
  { name: '間取りで残すもの', L: '外構（かずの希望）', R: '造作キッチン（ゆうの希望）' },
  { name: '契約', L: '借入を増やして外構を戻す', R: '予算のまま' },
  { name: '仕様', L: '箱型の屋根', R: '勾配屋根' }
];
const WORLDS = [
  { lot: 1, path: 'LLLL', title: '入居の日に、ぜんぶそろった', line: '外構もライトアップも最初から。借入は300万円ふえた。', num: '+300万', sub: '借入', spec: { roof: 'box', wall: '#FFFFFF', roofc: C.ink, floors: 2, carport: 2, shed: true, lit: true, tree: true, carColors: [C.red, C.blue] } },
  { lot: 2, path: 'LLLR', title: '軒の下で雨やどり', line: '勾配屋根に外構もそろえた。毎月の返済がいちばん重い世界。', num: '月14.6万', sub: '返済', spec: { roof: 'gable', wall: C.cream, roofc: C.brick, floors: 2, carport: 2, lit: true, tree: true, carColors: [C.blue, C.yellow] } },
  { lot: 3, path: 'RLLL', detail: true, title: '上棟の2か月後、職人が来なくなった', line: '全部入る家を、着工金を多めに入れて契約。工務店が事業を止めた。', num: '−800万', sub: '戻らない代金', spec: { fate: 'empty', sign: 'あきち', roof: 'gable', wall: C.pink, roofc: C.red, floors: 2, carport: 2, shed: true, lit: true, tree: true },

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DUR = 16;
window.DUR = DUR;
function fit() {
  const s = Math.min(innerWidth / 1920, (innerHeight - 40) / 1080);
  cv.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

// グリッド（抽象化された16の敷地）
const CW = 380, CH = 214, GAP = 20;
const GX = (1920 - (CW * 4 + GAP * 3)) / 2, GY = 150;
const cell = lot => { const i = lot - 1, c = i % 4, r = Math.floor(i / 4); return { x: GX + c * (CW + GAP), y: GY + r * (CH + GAP) }; };
const byLot = {}; WORLDS.forEach(w => byLot[w.lot] = w);
const MINE = 7;

// カメラの状態
const c7 = cell(MINE);
const CAM_OPEN = { cx: c7.x + CW / 2, cy: c7.y + CH / 2 + 10, z: 4.6 };
const CAM_LETTER = { cx: c7.x + CW / 2 + 112, cy: c7.y + CH / 2 + 4, z: 3.03 };
const CAM_GRID = { cx: 960, cy: 606, z: 0.9 };
function camAt(t) {
  const mix = (a, b, k) => ({ cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), k)) });
  if (t < 3.2) return CAM_OPEN;
  if (t < 4.5) return mix(CAM_OPEN, CAM_GRID, easeIO(seg(t, 3.2, 4.5)));
  if (t < 9.0) return CAM_GRID;
  if (t < 10.2) return mix(CAM_GRID, CAM_LETTER, easeIO(seg(t, 9.0, 10.2)));
  if (t < 13.4) return CAM_LETTER;
  if (t < 14.6) return mix(CAM_LETTER, CAM_GRID, easeIO(seg(t, 13.4, 14.6)));
  return CAM_GRID;
}

function paperBg(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#FFF4D9'; ctx.fillRect(0, 0, 1920, 1080);
  // 机の上の方眼（うすく）
  ctx.strokeStyle = 'rgba(214, 186, 120, .16)'; ctx.lineWidth = 1;
  for (let x = 0; x <= 1920; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke(); }
  for (let y = 0; y <= 1080; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }
}

function cardFrame(w, x, y, a, rot, bs) {
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x + CW / 2, y + CH / 2); ctx.rotate(rot); ctx.translate(-CW / 2, -CH / 2);
  ctx.shadowColor = 'rgba(120, 90, 30, .22)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, CW, CH);
  ctx.shadowColor = 'transparent';
  ctx.restore();
}

function drawCard(w, t, bs, st) {
  const { x, y } = cell(w.lot);
  const rot = (hash(w.lot, 3, 5) - .5) * .035;
  const a = st.alpha, sc = st.scale || 1;
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x + CW / 2, y + CH / 2); ctx.rotate(rot); ctx.scale(sc, sc); ctx.translate(-CW / 2, -CH / 2);
  ctx.shadowColor = 'rgba(120, 90, 30, .22)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 5;
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, CW, CH);
  ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.rect(0, 0, CW, CH); ctx.clip();
  const seed = w.lot * 1000 + bs;
  const spec = Object.assign({}, w.spec);
  // 03：描いた家が消しゴムで消える
  let houseAlpha = 1;
  if (w.lot === 3) {
    const e = seg(t, 5.0, 6.2);
    if (e < 1) { spec.fate = undefined; houseAlpha = 1 - e; }
  }
  if (w.lot === 16) spec.fate = t > 5.4 ? 'vacant' : undefined;
  if (w.lot === 16 && t <= 5.4) spec.lit = true;
  kidHouse(ctx, spec, 0, 0, 1, seed, st.p, { houseAlpha, cold: w.lot === 15 ? seg(t, 5.6, 6.6) : 0, w: 2.6 });
  if (w.lot === 3) {
    const e = seg(t, 5.0, 6.2);
    if (e > 0 && e < 1) {
      // 消しゴムのこすり跡
      ctx.save(); ctx.globalAlpha = .9 * Math.sin(e * Math.PI);
      for (let i = 0; i < 8; i++) crayon(ctx, [[130 + i * 4, 70 + i * 12], [290 - i * 3, 64 + i * 13]], '#FFFFFF', 16, seed + 300 + i, e * 1.4);
      ctx.restore();
    }
    if (e >= .7) { const s2 = Object.assign({}, w.spec); emptyLot(ctx, s2, 182, seed, seg(t, 5.8, 6.6), 2.6); }
  }
  // 区画の番号
  kidText(ctx, String(w.lot).padStart(2, '0'), 14, 30, 24, w.mine ? C.red : C.ink, { weight: 600, alpha: st.p > .05 ? 1 : 0 });
  // 11：打ち合わせの正の字
  if (w.tally) {
    const n = Math.floor(lerp(0, w.tally, seg(t, 5.2, 7.0)));
    for (let i = 0; i < n; i++) {
      const g = Math.floor(i / 5), k = i % 5;
      const bx = 252 + g * 30, by = 18;
      if (k < 4) crayon(ctx, [[bx + k * 5, by], [bx + k * 5 + 1, by + 22]], C.red, 2.4, seed + 400 + i);
      else crayon(ctx, [[bx - 3, by + 18], [bx + 20, by + 4]], C.red, 2.4, seed + 400 + i);
    }
    if (n > 0) kidText(ctx, 'うちあわせ', 252, 58, 14, C.red, { alpha: seg(t, 5.2, 5.6) });
  }
  ctx.restore();

  // テープに数字（エンジンが出した値をそのまま出す想定）
  const tp = st.tape;
  if (tp > 0) {
    ctx.save();
    ctx.globalAlpha = a * easeOut(tp);
    const tx = x + CW - 84, ty = y + CH - 26;
    tape(ctx, tx, ty, 150, 42, -0.04 + rot, 'rgba(255, 255, 255, .9)');
    tape(ctx, tx, ty, 150, 42, -0.04 + rot, w.mine ? 'rgba(232,85,58,.30)' : 'rgba(247,200,30,.45)');
    const neg = /^[−+]/.test(w.num) && w.num[0] === '−' || w.lot === 15 || w.lot === 16;
    numText(ctx, w.num, tx + 4, ty + 9, w.num.length > 5 ? 22 : 27, neg ? C.blue : (w.mine ? C.red : C.ink), { align: 'center' });
    if (w.sub) kidText(ctx, w.sub, tx - 66, ty - 25, 14, '#6b5b35', { alpha: 1 });
    ctx.restore();
  }
}

// こどもが丸をつける（くわしく見られる4つの世界）
function circleCard(lot, p, col, seed) {
  if (p <= 0) return;
  const { x, y } = cell(lot);
  const pts = ellipsePts(x + CW / 2, y + CH / 2, CW / 2 + 10, CH / 2 + 12, -2.2, -2.2 + Math.PI * 2.15, 60)
    .map(([px, py], i) => [px + (hash(seed, i, 1) - .5) * 5, py + (hash(seed, i, 2) - .5) * 5]);
  crayon(ctx, pts, col, 5, seed, p);
}

function star(cx, cy, r, col, seed, p) {
  const pts = [];
  for (let i = 0; i <= 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  scribble(ctx, pts, col, seed, 4, .9, p);
  crayon(ctx, pts, '#B8331E', 2.4, seed + 1, p);
}

// 07のなか：家族の後ろ姿とうさぎ（はじめと手紙の場面）
function family07(t, bs, p, alive) {
  const { x, y } = cell(MINE);
  const rot = (hash(MINE, 3, 5) - .5) * .035;
  ctx.save();
  ctx.translate(x + CW / 2, y + CH / 2); ctx.rotate(rot); ctx.translate(-CW / 2, -CH / 2);
  const gy = 206, sd = 5000 + bs;
  personBack(ctx, 40, gy, 74, C.blue, C.brown, sd + 1, seg(p, .55, .8));
  personBack(ctx, 76, gy, 68, C.orange, C.ink, sd + 20, seg(p, .6, .85));
  personBack(ctx, 104, gy, 44, C.yellow, C.brown, sd + 40, seg(p, .68, .9), alive ? -Math.abs(Math.sin(t * 5)) * 3 : 0);
  personBack(ctx, 126, gy, 36, C.pink, C.ink, sd + 60, seg(p, .72, .95));
  if (p > .85 || alive) {
    const hop = alive ? Math.abs(Math.sin(t * 4.2)) * 12 : 0;
    const rx = alive ? 124 + ((t * 18) % 44) : 146;
    rabbit(ctx, rx, 182, 18, sd + 80 + Math.floor(t * 8), hop);
  }
  ctx.restore();
}

function letter(t, bs) {
  // 画面座標の手紙
  const a = easeOut(seg(t, 10.0, 10.6)) * (1 - seg(t, 13.1, 13.5));
  if (a <= 0) return;
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = a;
  ctx.translate(1560, 540 + (1 - a) * 30); ctx.rotate(.035); ctx.scale(.9, .9);
  ctx.shadowColor = 'rgba(120,90,30,.25)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = '#FFFDF6'; ctx.fillRect(-330, -390, 660, 780);
  ctx.shadowColor = 'transparent';
  ctx.strokeStyle = 'rgba(134, 204, 242, .55)'; ctx.lineWidth = 2;
  for (let i = 0; i < 11; i++) { ctx.beginPath(); ctx.moveTo(-290, -280 + i * 62); ctx.lineTo(290, -280 + i * 62); ctx.stroke(); }
  tape(ctx, 0, -392, 180, 46, -.05, 'rgba(242,141,178,.45)');
  kidText(ctx, '1ねんごの わたしたちへ', -280, -300, 40, C.red, { weight: 600 });
  const lines = [
    ['まどの そばは、2がつも あったかい。', C.ink],
    ['カーポートは、まだ ない。', C.ink],
    ['あさは まどの しもを 5ふん けずる。', C.ink],
    ['うさぎは にわを 3しゅう した。', C.ink]
  ];
  lines.forEach(([s, col], i) => {
    const k = seg(t, 10.5 + i * .55, 10.9 + i * .55);
    if (k <= 0) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(-290, -270 + i * 62, 580 * k, 62); ctx.clip();
    kidText(ctx, s, -280, -228 + i * 62, 33, col);
    ctx.restore();
  });
  // とったもの／てばなしたもの
  const k2 = seg(t, 12.6, 13.0);
  if (k2 > 0) {
    ctx.globalAlpha = a * k2;
    kidText(ctx, 'とったもの', -280, 74, 26, C.green);
    kidText(ctx, '◎ ぞうさくの キッチン', -270, 116, 26, C.ink);
    kidText(ctx, '◎ あったかい まど', -270, 156, 26, C.ink);
    kidText(ctx, 'いまは がまん', 40, 74, 26, C.blue);
    kidText(ctx, '△ カーポート', 50, 116, 26, C.ink);
    kidText(ctx, '△ ライトアップ', 50, 156, 26, C.ink);
    numText(ctx, '2月の朝 20℃ ／ 返済 月13.0万円（簡易計算）', -280, 300, 22, '#7a6a45');
  }
  ctx.restore();
}

function caption(t, s, t0, t1, y = 1010, size = 40, col = C.ink) {
  const a = seg(t, t0, t0 + .4) * (1 - seg(t, t1 - .4, t1));
  if (a <= 0) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = a;
  ctx.font = `600 ${size}px 'Klee One', sans-serif`;
  const tw = ctx.measureText(s).width;
  ctx.fillStyle = 'rgba(255, 251, 241, .92)';
  ctx.beginPath(); ctx.roundRect(960 - tw / 2 - 30, y - size - 14, tw + 60, size + 34, 14); ctx.fill();
  ctx.fillStyle = col; ctx.textAlign = 'center';
  ctx.fillText(s, 960, y);
  ctx.restore();
}

function title(t, bs) {
  const k = seg(t, 14.4, 15.2);
  if (k <= 0) return;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1 - seg(t, 15.6, 16);
  ctx.fillStyle = 'rgba(255, 244, 217, .9)';
  ctx.fillRect(0, 0, 1920, 124);
  ctx.beginPath(); ctx.rect(0, 0, 1920 * easeOut(k), 140); ctx.clip();
  kidText(ctx, '16軒目の、わが家', 960, 78, 64, C.red, { align: 'center', weight: 600 });
  ctx.restore();
  const k2 = seg(t, 14.9, 15.3);
  if (k2 > 0) {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = k2 * (1 - seg(t, 15.6, 16));
    kidText(ctx, '同じふたりの、選ばなかった15の未来といっしょに。', 960, 114, 24, '#6b5b35', { align: 'center' });
    ctx.restore();
  }
}

function render(t) {
  t = ((t % DUR) + DUR) % DUR;
  const bs = Math.floor(t * 8) * 17; // クレヨンのゆらぎ（毎秒8回）
  paperBg(t);
  const cam = camAt(t);
  ctx.setTransform(cam.z, 0, 0, cam.z, 960 - cam.cx * cam.z, 540 - cam.cy * cam.z);

  // 07以外のカード
  for (let lot = 1; lot <= 16; lot++) {
    if (lot === MINE) continue;
    const w = byLot[lot];
    const order = [6, 3, 11, 8, 2, 10, 15, 1, 5, 12, 9, 14, 4, 13, 16].indexOf(lot);
    const t0 = 3.35 + order * .07;
    const focus = seg(t, 9.2, 9.9) * (1 - seg(t, 13.3, 14.0));
    const a = easeOut(seg(t, t0, t0 + .35));
    const sc = lerp(1.12, 1, easeBack(seg(t, t0, t0 + .45)));
    const p = seg(t, t0 + .1, t0 + 1.0);
    const tapeT = seg(t, 4.8 + order * .06, 5.2 + order * .06);
    drawCard(w, t, bs, { alpha: a, scale: sc, p, tape: tapeT });
  }
  // 手紙の場面では、ほかの15枚をうすくする
  const focus = seg(t, 9.2, 9.9) * (1 - seg(t, 13.3, 14.0));
  if (focus > 0) { ctx.save(); ctx.fillStyle = `rgba(255,244,217,${.82 * focus})`; ctx.fillRect(-200, -200, 2400, 1500); ctx.restore(); }
  // 07（はじめから描かれる）
  const p7 = seg(t, .15, 2.8);
  drawCard(byLot[MINE], t, bs, { alpha: 1, p: p7, tape: seg(t, 4.8, 5.2) * (1 - seg(t, 9.0, 9.6) + seg(t, 13.4, 14.0)) });
  const alive = t > 9.8 && t < 13.6;
  family07(t, bs, t < 4.6 ? seg(t, .15, 2.8) : 1, alive);

  // 丸と星
  if (t < 9.2) {
    const fade = 1;
    circleCard(3, seg(t, 6.3, 6.9) * fade, C.red, 900 + bs);
    circleCard(11, seg(t, 6.9, 7.5) * fade, C.red, 920 + bs);
    circleCard(15, seg(t, 7.5, 8.1) * fade, C.blue, 940 + bs);
    circleCard(MINE, seg(t, 8.1, 8.7) * fade, C.orange, 960 + bs);
  } else if (t > 14.0) {
    [3, 11, 15].forEach((l, i) => circleCard(l, 1, l === 15 ? C.blue : C.red, 900 + i * 20 + bs));
    circleCard(MINE, 1, C.orange, 960 + bs);
  }
  const s7 = cell(MINE);
  if (t > 8.4 && t < 9.4 || t > 14.2) star(s7.x + CW - 22, s7.y + 12, 26, C.yellow, 980 + bs, seg(t, t > 14 ? 14.2 : 8.4, t > 14 ? 14.6 : 8.8));

  // 文字
  caption(t, 'ここに、うちを たてるんだって。', .8, 3.2, 1040, 44);
  caption(t, '同じ ふたり。16とおりの、1ねんご。', 6.0, 9.0, 1046, 38);
  letter(t, bs);
  title(t, bs);
  // ループのつなぎ
  const f = seg(t, 15.55, 16);
  if (f > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,244,217,${f})`; ctx.fillRect(0, 0, 1920, 1080); }
  window.READY = true;
}
window.render = render;

// 再生（?t=秒 で静止）
const q = new URLSearchParams(location.search);
let playing = !q.has('t'), t0 = performance.now(), off = q.has('t') ? parseFloat(q.get('t')) : 0;
const sc = document.getElementById('sc'), tt = document.getElementById('tt'), pp = document.getElementById('pp');
pp.onclick = () => { if (playing) { off = cur(); playing = false; pp.textContent = '再生'; } else { t0 = performance.now(); playing = true; pp.textContent = '一時停止'; } };
sc.oninput = () => { off = parseFloat(sc.value); t0 = performance.now(); if (!playing) render(off); };
const cur = () => playing ? (off + (performance.now() - t0) / 1000) % DUR : off;
function loop() { const t = cur(); render(t); sc.value = t; tt.textContent = t.toFixed(1) + ' 秒'; requestAnimationFrame(loop); }
document.fonts.ready.then(() => { if (q.has('t')) { render(off); window.READY = true; } else loop(); });
setTimeout(() => { if (!window.READY) { render(off); } }, 1500);
</script>
</body>
</html>
