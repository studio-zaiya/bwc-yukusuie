<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>竣工の1枚（W5）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
html,body{margin:0;height:100%;background:#ECE7DD;font-family:"Hiragino Sans","Zen Kaku Gothic New",sans-serif;color:#2b2620}
#wrap{position:fixed;inset:0 0 56px 0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;box-shadow:0 10px 40px rgba(60,40,20,.15)}
canvas{display:block;width:1920px;height:1080px}
#bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#FBF8F2;border-top:1px solid #DED6C8;font-size:14px}
#bar button{font:inherit;font-weight:700;border:1px solid #DED6C8;background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
#bar button[aria-pressed="true"]{background:#2b2620;color:#fff}
#bar input[type=range]{flex:1}
#time{font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div></div>
<div id="bar">
  <button id="play" type="button">一時停止</button>
  <input id="seek" type="range" min="0" max="8" step="0.01" value="0" aria-label="再生位置">
  <span id="time">0.0 / 8.0 秒</span>
  <button id="sA" type="button" aria-pressed="true">状態A</button>
  <button id="sB" type="button" aria-pressed="false">状態B</button>
</div>
<script>
const W=1920,H=1080,DUR=8;window.DUR=DUR;
const C=document.getElementById('c'),X=C.getContext('2d');
const qs=new URLSearchParams(location.search);
// 世界の状態ごとに、物理ベースで描いた下地（photo）と、それを描き直した絵（wash・ink）がある
const STATES={
 A:{label:'白い塗り壁の箱型　南だけの庇　木の縦張り　カーポート1台',season:'春',date:'竣工　4月'},
 B:{label:'ガルバリウムの外壁　片流れ屋根　カーポート2台',season:'秋',date:'竣工　10月'},
};
let cur=qs.get('state')==='B'?'B':'A';
addEventListener('DOMContentLoaded',()=>{document.getElementById('sA').setAttribute('aria-pressed',cur==='A');document.getElementById('sB').setAttribute('aria-pressed',cur==='B')});
const IM={};let loaded=0;
function load(k,src){const im=new Image();im.onload=()=>{loaded++};im.src=src;IM[k]=im}
for(const s of ['A','B'])for(const l of ['photo','wash','ink'])load(s+l,`${l}_${s}.png`);

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const out=x=>1-Math.pow(1-clamp(x),3);
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// 筆の運び（決まった種から作るので、毎回同じ）
const STROKES=(()=>{const r=rng(21),a=[];
  for(let i=0;i<190;i++){
    const y=60+r()*960, x=-80+((i%19)/19)*2080+r()*90;
    const ang=-0.18+r()*0.36+(r()<.25?1.4:0), len=260+r()*520, w=70+r()*120;
    // 中心の建物から外へ塗り広げる順番
    const dc=Math.hypot((x-1000)/1920,(y-560)/1080);
    a.push({x,y,ang,len,w,t0:2.3+dc*2.6+r()*0.55,wob:r()*6});}
  return a})();
const mask=document.createElement('canvas');mask.width=W;mask.height=H;const MX=mask.getContext('2d');
const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const TX=tmp.getContext('2d');

function cover(im){ // 960x540 の画像を舞台いっぱいに（ゆっくり寄る）
  return im;
}
function drawImg(ctx,im,a,zoom){if(!im||!im.complete)return;ctx.save();ctx.globalAlpha=a;
  const z=zoom,w=W*z,h=H*z;ctx.drawImage(im,(W-w)/2,(H-h)/2,w,h);ctx.restore()}

function render(t){
  const s=STATES[cur],ph=IM[cur+'photo'],wa=IM[cur+'wash'],ink=IM[cur+'ink'];
  const zoom=1.06-0.06*ease(t/DUR);
  // 紙
  X.fillStyle='#FBF8F1';X.fillRect(0,0,W,H);
  // 1) 物理ベースの下地（写真のような光と影）
  const phA=out(t/0.9)*(1-0.85*ease((t-2.6)/2.6));
  drawImg(X,ph,phA,zoom);
  // 2) 線描：左から右へ、ペン先が走るように現れる
  const lp=ease((t-1.0)/1.7);
  if(lp>0){TX.clearRect(0,0,W,H);drawImg(TX,ink,1,zoom);
    TX.globalCompositeOperation='destination-in';const g=TX.createLinearGradient(0,0,W,0);
    const e=lp*1.15;g.addColorStop(clamp(e-0.12),'rgba(0,0,0,1)');g.addColorStop(clamp(e),'rgba(0,0,0,0)');
    TX.fillStyle=g;TX.fillRect(0,0,W,H);TX.globalCompositeOperation='source-over';X.drawImage(tmp,0,0)}
  // 3) 水彩：筆の運びで塗り替わっていく
  MX.clearRect(0,0,W,H);MX.lineCap='round';MX.lineJoin='round';
  for(const k of STROKES){const p=out((t-k.t0)/0.55);if(p<=0)continue;
    MX.save();MX.translate(k.x,k.y);MX.rotate(k.ang);MX.strokeStyle='#000';MX.lineWidth=k.w*(0.7+0.3*p);
    MX.globalAlpha=0.85;MX.beginPath();const N=12;
    for(let i=0;i<=N*p;i++){const u=i/N,xx=u*k.len,yy=Math.sin(u*3+k.wob)*k.w*0.18;i?MX.lineTo(xx,yy):MX.moveTo(xx,yy)}
    MX.stroke();MX.restore()}
  // 最後はすべて塗りつぶす（白い紙の余白は絵の側に含まれている）
  const all=ease((t-5.4)/0.9);if(all>0){MX.globalAlpha=all;MX.fillStyle='#000';MX.fillRect(0,0,W,H);MX.globalAlpha=1}
  TX.clearRect(0,0,W,H);drawImg(TX,wa,1,zoom);TX.globalCompositeOperation='destination-in';TX.drawImage(mask,0,0);TX.globalCompositeOperation='source-over';
  X.drawImage(tmp,0,0);
  // 4) 線を絵の上にもう一度（絵が仕上がるほど濃く）
  if(t>2.2)drawImg(X,ink,0.55+0.45*ease((t-4.5)/1.5),zoom);
  // 5) 文字：竣工の札
  const ta=out((t-5.9)/0.7);
  if(ta>0){X.save();X.globalAlpha=ta;X.fillStyle='#2b2620';
    X.font='700 64px "Hiragino Mincho ProN","Zen Old Mincho",serif';X.textAlign='left';
    X.fillText('16回目の、マイホームへ。',120,930);
    X.font='500 30px "Hiragino Mincho ProN","Zen Old Mincho",serif';X.fillStyle='#5b5146';
    X.fillText(`${s.date}　世界07　${s.label}`,124,985);
    X.restore()}
}
window.render=render;

const seek=document.getElementById('seek'),tl=document.getElementById('time'),pb=document.getElementById('play');
let playing=!qs.has('t'),t=parseFloat(qs.get('t')||'0'),last=null;
function sync(){seek.value=t;tl.textContent=`${t.toFixed(1)} / ${DUR.toFixed(1)} 秒`;pb.textContent=playing?'一時停止':'再生'}
function loop(now){if(playing){if(last!=null)t+=(now-last)/1000;if(t>=DUR+1.5)t=0}last=now;try{render(Math.min(t,DUR))}catch(e){console.error(e)}sync();requestAnimationFrame(loop)}
pb.onclick=()=>{playing=!playing};seek.oninput=()=>{t=+seek.value;playing=false};
function setS(k){cur=k;document.getElementById('sA').setAttribute('aria-pressed',k==='A');document.getElementById('sB').setAttribute('aria-pressed',k==='B');t=0;playing=true}
document.getElementById('sA').onclick=()=>setS('A');document.getElementById('sB').onclick=()=>setS('B');
function fit(){const s=Math.min(innerWidth/W,(innerHeight-56)/H);document.getElementById('stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
let started=false;function start(){if(started)return;started=true;window.READY=true;requestAnimationFrame(loop)}
(document.fonts?document.fonts.ready:Promise.resolve()).then(start,start);setTimeout(start,1500);
</script>
</body>
</html>
