<style>

<body>
<div id="wrap"><div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div class="ov">
    <div id="veil"></div>
    <div class="logo" id="l1">ゆくすいえ</div>
    <div class="logo" id="l2">YUKUSUIE: 16 unbuilt futures</div>
    <div class="logo" id="l3">もしもの家づくりを、16の世界で、同時に。</div>
  </div>

</div></div>
<div id="bar">
  <button id="play" type="button">一時停止</button>
  <input id="seek" type="range" min="0" max="28" step="0.01" value="0" aria-label="再生位置">

</div>
<script type="module">
import * as THREE from 'three';
const W=1920,H=1080,DUR=28;window.DUR=DUR;
const COL={paper:0xFFFAF0,sky:0xCFEBFA,ground:0xF3E7CF,grass:0x9BD27A,ink:0x1E2B36,kazu:0xE8701F,yuu:0x1C8DCC,gold:0xF2C230,road:0xEDE3CF,soil:0xD9CDB4};
// ---------- 時間の道具 ----------
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eo=x=>1-Math.pow(1-cl(x),3);
const lerp=(a,b,u)=>a+(b-a)*u;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- 舞台 ----------
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(W,H,false);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
{ // 空のグラデーション
  const c=document.createElement('canvas');c.width=4;c.height=256;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#9FD3F2');gr.addColorStop(.55,'#CFEBFA');gr.addColorStop(1,'#FFF6E4');
  g.fillStyle=gr;g.fillRect(0,0,4,256);const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;scene.background=tx;
}
scene.fog=new THREE.Fog(0xEAF4F6,120,260);
const cam=new THREE.PerspectiveCamera(30,W/H,.5,600);
scene.add(new THREE.HemisphereLight(0xEAF6FF,0xE8D9B8,1.15));
const sun=new THREE.DirectionalLight(0xFFF3DC,2.1);sun.position.set(-40,70,50);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:220});sun.shadow.bias=-.0006;sun.shadow.radius=4;
scene.add(sun);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o));
// 地面
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),M(COL.road));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// ---------- 16区画 ----------
const LOT=11,GAP=3.2,N=4;
const lots=[];
for(let r=0;r<N;r++)for(let c=0;c<N;c++){
  const i=r*N+c,x=(c-1.5)*(LOT+GAP),z=(r-1.5)*(LOT+GAP);
  const pad=new THREE.Mesh(new THREE.BoxGeometry(LOT,.12,LOT),M(COL.grass,{roughness:1}));pad.position.set(x,.06,z);pad.receiveShadow=true;scene.add(pad);
  lots.push({i,x,z,pad});
}
// 区画のふちの点景（木）
const treeG=new THREE.Group();scene.add(treeG);
{const R=rng(5);for(const L of lots){for(let k=0;k<2;k++){const tx=L.x+(R()<.5?-1:1)*(LOT/2-1.2),tz=L.z+(R()-.5)*(LOT-3);
  const tr=new THREE.Mesh(new THREE.CylinderGeometry(.14,.18,1.4,6),M(0x8A6A4A));tr.position.set(tx,.8,tz);tr.castShadow=true;treeG.add(tr);
  const s=.9+R()*.6,cr=new THREE.Mesh(new THREE.IcosahedronGeometry(s,0),M([0x7FC06A,0x93CF6E,0x6DB35C][k%3],{flatShading:true}));cr.position.set(tx,1.6+s*.7,tz);cr.castShadow=true;treeG.add(cr);}}}
// 周りの木（外周）
{const R=rng(9);for(let k=0;k<46;k++){const a=k/46*Math.PI*2,rr=40+R()*14,tx=Math.cos(a)*rr,tz=Math.sin(a)*rr;
  const s=1.4+R()*1.4,cr=new THREE.Mesh(new THREE.IcosahedronGeometry(s,0),M([0x86C46C,0xA2D47A,0x74B862][k%3],{flatShading:true}));cr.position.set(tx,s*1.1,tz);cr.castShadow=true;treeG.add(cr);}}

const o3=new THREE.Object3D();
// ---------- 家の型と仕上げ ----------
// 仕上げ：塗り壁／木目／ガルバリウム／レンガ調／サイディング
const FIN=[
 {wall:0xF7F3EA,roof:0x4A5560},{wall:0xC9945F,roof:0x3E4650},{wall:0x8E98A2,roof:0x5B6670},{wall:0xC4704E,roof:0x5A4A44},
 {wall:0xE9DCC3,roof:0x6E5A4A},{wall:0xF3EFE6,roof:0xB0623E},{wall:0x7C8B78,roof:0x3F4A3E},{wall:0xD8B48A,roof:0x2F3A44}];
// 型：gable(切妻・総二階) flat(陸屋根・パラペット) shed(片流れ) hira(平屋寄り) box_eave(箱型＋南の庇)
const FORMS=['gable','flat','shed','hira','gable','shed','box_eave','flat','hira','gable','flat','shed','gable','hira','shed','flat'];
const FINS=[0,2,4,1,5,3,0,7,4,6,1,2,3,5,7,0];
const STOP=2; // 03の世界：基礎のあと、はらっぱに戻る
const SELF=6; // 07の世界：わたしたちの家
function prism(w,d,h,shed){ // 屋根（X方向に棟、Zが南北）
  const s=new THREE.Shape();if(shed){s.moveTo(-d/2,0);s.lineTo(d/2,0);s.lineTo(-d/2,h);s.lineTo(-d/2,0)}else{s.moveTo(-d/2,0);s.lineTo(d/2,0);s.lineTo(0,h);s.lineTo(-d/2,0)}
  const g=new THREE.ExtrudeGeometry(s,{depth:w,bevelEnabled:false});g.rotateY(Math.PI/2);g.translate(-w/2,0,0);return g}
function makeHouse(L){
  const form=FORMS[L.i],fin=FIN[FINS[L.i]];
  const g=new THREE.Group();g.position.set(L.x,.12,L.z);scene.add(g);
  let w=7,d=6,h=5.6;if(form==='hira'){w=8.6;d=6.4;h=3.1}if(form==='flat'){w=7.6;d=6;h=5.8}if(form==='box_eave'){w=7.8;d=6.2;h=5.8}
  const ox=-.6,oz=-.4; // 南(＋Z)に庭を残す
  // 地縄（細い破線）
  const pts=[[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2],[-w/2,-d/2]];const dash=[];
  for(let k=0;k<4;k++){const [a,b]=[pts[k],pts[k+1]];const len=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.floor(len/.55);
    for(let s=0;s<n;s+=2){const u0=s/n,u1=Math.min(1,(s+1)/n);dash.push({x:ox+lerp(a[0],b[0],(u0+u1)/2),z:oz+lerp(a[1],b[1],(u0+u1)/2),l:len*(u0+u1)/2*0+len*(u1-u0),r:-Math.atan2(b[1]-a[1],b[0]-a[0])})}}
  const jin=new THREE.InstancedMesh(new THREE.BoxGeometry(1,.05,.07),M(COL.ink),dash.length);
  dash.forEach((d,j)=>{o3.position.set(d.x,.1,d.z);o3.rotation.set(0,d.r,0);o3.scale.set(d.l,1,1);o3.updateMatrix();jin.setMatrixAt(j,o3.matrix)});g.add(jin);
  // 基礎
  const fnd=new THREE.Mesh(new THREE.BoxGeometry(w+.2,.45,d+.2),M(0xC9C6BE));fnd.position.set(ox,.22,oz);fnd.castShadow=fnd.receiveShadow=true;g.add(fnd);
  // 骨組み（柱と梁）
  const frm=new THREE.Group();frm.position.set(ox,.45,oz);g.add(frm);const wood=M(0xD9B98A);
  const cols=form==='hira'?5:4,rows=3;
  for(let a=0;a<cols;a++)for(let b=0;b<rows;b++){if(a>0&&a<cols-1&&b===1)continue;const p=new THREE.Mesh(new THREE.BoxGeometry(.18,h,.18),wood);p.position.set(-w/2+a*w/(cols-1),h/2,-d/2+b*d/(rows-1));p.castShadow=true;frm.add(p)}
  const lev=form==='hira'?[h]:[h/2,h];for(const y of lev){for(const zz of [-d/2,d/2]){const b=new THREE.Mesh(new THREE.BoxGeometry(w,.16,.16),wood);b.position.set(0,y,zz);frm.add(b)}for(const xx of [-w/2,w/2]){const b=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,d),wood);b.position.set(xx,y,0);frm.add(b)}}
  // 壁（白い下地→仕上げ）
  const wallM=M(0xFFFFFF),body=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallM);body.position.set(ox,.45+h/2,oz);body.castShadow=body.receiveShadow=true;g.add(body);
  // 防水シートの継ぎ目（白い下地の時だけ見える細い線）
  const seam=new THREE.Group();g.add(seam);const sm=M(0xDDE3E8,{transparent:true,opacity:1});
  for(let k=1;k<4;k++){const s=new THREE.Mesh(new THREE.BoxGeometry(w+.02,.04,d+.02),sm);s.position.set(ox,.45+h*k/4,oz);seam.add(s)}
  // 屋根
  const roofM=M(0xFFFFFF);let roof;
  if(form==='flat'||form==='box_eave'){ // 陸屋根：薄い屋根版＋立ち上がり。中央には何も置かない
    roof=new THREE.Group();const slab=new THREE.Mesh(new THREE.BoxGeometry(w+.1,.22,d+.1),roofM);roof.add(slab);
    for(const [sx,sz,lx,lz] of [[0,-d/2,w+.1,.18],[0,d/2,w+.1,.18],[-w/2,0,.18,d+.1],[w/2,0,.18,d+.1]]){const pr=new THREE.Mesh(new THREE.BoxGeometry(lx,.45,lz),roofM);pr.position.set(sx,.2,sz);roof.add(pr)}
    roof.position.set(ox,.45+h+.11,oz);
    if(form==='box_eave'){const eave=new THREE.Mesh(new THREE.BoxGeometry(w*.9,.14,1.6),roofM);eave.position.set(0,-h*.45,d/2+.8);roof.add(eave)}
  }else{
    const rh=form==='shed'?1.8:2.1,ov=.35;roof=new THREE.Mesh(prism(w+ov*2,d+ov*2,rh,form==='shed'),roofM);roof.position.set(ox,.45+h,oz);
  }
  roof.traverse(o=>{if(o.isMesh){o.castShadow=true}});if(roof.isMesh)roof.castShadow=true;g.add(roof);
  // 窓（南面）
  const win=new THREE.Group();g.add(win);const glass=M(0x5E7A90,{roughness:.25,metalness:.1});
  const wy=form==='hira'?[.45+h*.5]:[.45+h*.27,.45+h*.72];
  for(const y of wy){const nW=form==='hira'?3:2;for(let k=0;k<nW;k++){const big=(y===wy[0]&&k===0);const ww=big?w*.42:w*.2;const m=new THREE.Mesh(new THREE.BoxGeometry(ww,big?h*.3:h*.18,.08),glass);m.position.set(ox-w/2+w*(k+.5)/nW,y,oz+d/2+.05);win.add(m)}}
  // 玄関ドア（東面）
  const door=new THREE.Mesh(new THREE.BoxGeometry(.08,2,1),M(0x6A4E36));door.position.set(ox+w/2+.05,.45+1,oz+d*.15);win.add(door);
  // はらっぱ（03）
  let field=null;if(L.i===STOP){field=new THREE.Group();g.add(field);const R=rng(33);
    for(let k=0;k<26;k++){const f=new THREE.Mesh(new THREE.SphereGeometry(.18,6,4),M(k%3?0xF6D25A:0xFFFFFF));f.position.set((R()-.5)*(LOT-1.5),.2,(R()-.5)*(LOT-1.5));field.add(f)}}
  return {L,form,fin,g,jin,fnd,frm,body,wallM,seam,sm,roof,roofM,win,field,h};
}
const houses=lots.map(makeHouse);
// 各区画の工事の開始時刻（線が届いた順）
const LAND=lots.map(L=>3.2+((L.x+25)/50)*2.2+(L.z+25)/50*.9);

const white=new THREE.Color(0xFFFFFF),tmp=new THREE.Color();
function setHouse(Hs,t){
  const i=Hs.L.i,t0=LAND[i]+1.2; // 地縄が張り終わった時刻
  const sF=t0+1.3+i*.06, sR=sF+1.8, sS=sR+1.9, sP=sS+1.9; // 基礎・骨組み・下地・仕上げ
  const self=i===SELF,stop=i===STOP;
  const k=self?-.6:0; // 07は少しだけ早く仕上がる
  const jinA=cl((t-LAND[i])/1.0), fP=eo((t-(sF+k))/1.0), rP=eo((t-(sR+k))/1.4), sP2=eo((t-(sS+k))/1.3), pP=eio((t-(sP+k))/1.6);
  Hs.jin.visible=jinA>0&&fP<1; Hs.jin.count=Math.ceil(Hs.jin.instanceMatrix.count*jinA);
  if(stop){ // 基礎まで。その後、はらっぱに戻る
    const back=eo((t-(sR+1.2))/2.2);
    Hs.fnd.visible=fP>0&&back<1;Hs.fnd.scale.set(1,Math.max(.001,fP*(1-back)),1);
    Hs.frm.visible=Hs.body.visible=Hs.seam.visible=Hs.roof.visible=Hs.win.visible=false;
    Hs.field.visible=back>0;Hs.field.children.forEach((f,j)=>f.scale.setScalar(Math.max(.001,eo((t-(sR+1.2)-j*.05)/.6))));
    return;
  }
  Hs.fnd.visible=fP>0;Hs.fnd.scale.set(1,Math.max(.001,fP),1);
  Hs.frm.visible=rP>0&&pP<.4;Hs.frm.scale.set(1,Math.max(.001,rP),1);
  Hs.body.visible=sP2>0;Hs.body.scale.set(1,Math.max(.001,sP2),1);Hs.body.position.y=.45+Hs.h*sP2/2;
  Hs.seam.visible=sP2>.98&&pP<1;Hs.sm.opacity=1-pP;Hs.sm.transparent=true;
  Hs.roof.visible=sP2>.98;Hs.roof.scale.setScalar(Math.max(.001,eo((t-(sS+k+1.0))/.6)));
  Hs.wallM.color.copy(white).lerp(tmp.setHex(Hs.fin.wall),pP);
  Hs.roofM.color.copy(white).lerp(tmp.setHex(Hs.fin.roof),pP);
  Hs.win.visible=pP>.35;
}

// ---------- 線（前振りから受け取る16本） ----------
function tube(curve,color,r=.09,seg=220){const geo=new THREE.TubeGeometry(curve,seg,r,6,false);const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color,transparent:true,opacity:1}));m.userData.total=geo.index.count;geo.setDrawRange(0,0);scene.add(m);return m}
function setDraw(m,p){const n=Math.floor(m.userData.total*cl(p)/6)*6;m.geometry.setDrawRange(0,n);m.visible=n>0}
const inLines=lots.map((L,k)=>{
  const fy=10+((k%8)/7)*14, start=new THREE.Vector3(-120,fy+6,-10+(k-7.5)*2.2);
  const end=new THREE.Vector3(L.x-.6-3.5,.25,L.z-.4-3);
  const c=new THREE.CubicBezierCurve3(start,new THREE.Vector3(-70,fy,start.z*.6),new THREE.Vector3(end.x-14,8,end.z),end);
  return tube(c,k%2?COL.yuu:COL.kazu,.11,160);
});

// ---------- 空の世界樹 ----------
const ROOT=new THREE.Vector3(0,44,-40);
const ORDER=lots.map(L=>L.i).sort((p,q)=>(lots[p].x-lots[q].x)||(lots[p].z-lots[q].z)); // 画面の左から右へ
const leafTop=[];ORDER.forEach((li,slot)=>{leafTop[li]=new THREE.Vector3(-34+slot*(68/15),20,-12)});
const rise=lots.map((L,k)=>{const a=new THREE.Vector3(L.x-.6,7.2,L.z-.4),b=leafTop[k];return tube(new THREE.QuadraticBezierCurve3(a,new THREE.Vector3(a.x,(a.y+b.y)/2,a.z),b),k%2?COL.yuu:COL.kazu,.07,60)});
// 二分木：葉16→8→4→2→根
let level=ORDER.map(li=>leafTop[li].clone()),branches=[];const nodesByLevel=[level];
for(let lv=0;lv<4;lv++){const up=[];for(let j=0;j<level.length;j+=2){const a=level[j],b=level[j+1];const m=a.clone().add(b).multiplyScalar(.5);m.x*=.86;m.z=lerp(-12,ROOT.z,(lv+1)/4);m.y=lerp(20,ROOT.y,(lv+1)/4);up.push(m);
    for(const [ch,col] of [[a,COL.kazu],[b,COL.yuu]]){const mid=m.clone().lerp(ch,.5);mid.y=m.y-(m.y-ch.y)*.15;branches.push({lv,mesh:tube(new THREE.QuadraticBezierCurve3(m,mid,ch),col,.16-lv*.02,48)})}}
  level=up;nodesByLevel.push(up)}
// 第3の答え：金の破線が外へ伸びる17本目
const gN=nodesByLevel[2][1].clone(),gEnd=new THREE.Vector3(36,30,-4),gMid=new THREE.Vector3(26,40,-14);
const gCurve=new THREE.QuadraticBezierCurve3(gN,gMid,gEnd);const gold=[];
for(let s=0;s<14;s++){if(s%2)continue;const u0=s/14,u1=(s+1)/14;const pts=[];for(let q=0;q<=6;q++)pts.push(gCurve.getPoint(lerp(u0,u1,q/6)));gold.push({u:u0,mesh:tube(new THREE.CatmullRomCurve3(pts),COL.gold,.16,12)})}
const dia=new THREE.Mesh(new THREE.OctahedronGeometry(1.1,0),new THREE.MeshBasicMaterial({color:COL.gold}));dia.position.copy(gEnd);scene.add(dia);
const nodeMarks=[];nodesByLevel.slice(1).forEach((lv,li)=>lv.forEach(p=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.5-li*.05,12,8),new THREE.MeshBasicMaterial({color:COL.ink}));m.position.copy(p);scene.add(m);nodeMarks.push({li,m})}));

// ---------- 花びらと若葉 ----------
const PN=420,petG=new THREE.PlaneGeometry(.8,.55);
const pet=new THREE.InstancedMesh(petG,new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,transparent:true}),PN);scene.add(pet);
const PR=rng(77),PD=[...Array(PN)].map((_,k)=>({x:(PR()-.5)*110,z:(PR()-.5)*90-10,y0:PR()*60,sp:1.6+PR()*1.6,ph:PR()*6.28,c:k%3===0?0x8CCB66:(k%3===1?0xF4A9C0:0xFBC9D8)}));
PD.forEach((d,k)=>pet.setColorAt(k,new THREE.Color(d.c)));
function setPetals(t){const a=cl((t-16.5)/1.5);pet.visible=a>0;pet.material.opacity=a;
  PD.forEach((d,k)=>{const tt=t*d.sp;let y=(d.y0-tt)%60;if(y<0)y+=60;o3.position.set(d.x+Math.sin(tt*.7+d.ph)*2.4,y+2,d.z+Math.cos(tt*.5+d.ph)*1.6);o3.rotation.set(tt*1.3+d.ph,tt*.9,tt*.6);o3.updateMatrix();pet.setMatrixAt(k,o3.matrix)});pet.instanceMatrix.needsUpdate=true}

// ---------- カメラ（1カットに1つの動き） ----------
const CUTS=[
 {t0:0,t1:7.2,p0:[-34,74,96],p1:[-6,50,70],l0:[-14,2,0],l1:[0,0,2]},     // 1 線が降りてくる：ゆっくり下降
 {t0:7.2,t1:15.4,p0:[-30,34,58],p1:[18,30,54],l0:[-4,3,0],l1:[4,3,0]},   // 2 16軒が建つ：横に流れる
 {t0:15.4,t1:21.0,p0:[0,0,0],p1:[0,0,0],l0:[0,0,0],l1:[0,0,0],self:true}, // 3 1軒に寄る
 {t0:21.0,t1:28.0,p0:[0,26,72],p1:[0,14,100],l0:[0,6,0],l1:[0,21,-12]},  // 4 引いて、空の世界樹へ
];
{const L=lots[SELF],cx=L.x-.6,cz=L.z-.4;Object.assign(CUTS[2],{p0:[cx+18,28,cz+34],p1:[cx+9,14,cz+19],l0:[cx,3,cz],l1:[cx,3.6,cz]})}
const v=(a)=>new THREE.Vector3(...a);
function setCam(t){const c=CUTS.find(c=>t>=c.t0&&t<c.t1)||CUTS[CUTS.length-1];const u=eio((t-c.t0)/(c.t1-c.t0));
  cam.position.copy(v(c.p0).lerp(v(c.p1),u));cam.lookAt(v(c.l0).lerp(v(c.l1),u));
  // カットのつなぎ：0.25秒だけ紙の色に抜ける
  let f=0;for(const k of [7.2,15.4,21.0]){const d=Math.abs(t-k);if(d<.25)f=Math.max(f,1-d/.25)}document.getElementById('fade').style.opacity=f*.9}

// ---------- render(t) ----------
const $=id=>document.getElementById(id);
function render(t){
  t=cl(t,0,DUR-1e-4);
  setCam(t);
  // 1：前振りの16本が降りてきて、区画に着く
  inLines.forEach((m,k)=>{setDraw(m,eo((t-.1-k*.06)/(LAND[k]-.1)));m.material.opacity=1-.75*eo((t-(LAND[k]+1.4))/1.2);if(t>15.4)m.visible=false});
  houses.forEach(Hs=>setHouse(Hs,t));
  setPetals(t);
  // 4：家から線がのぼり、空で世界樹になる
  const tr=21.4;rise.forEach((m,k)=>{setDraw(m,eio((t-tr-k*.03)/1.2));m.material.opacity=.85});
  if(t<tr){rise.forEach(m=>m.visible=false)}
  branches.forEach(b=>{setDraw(b.mesh,eio((t-(tr+1.2+b.lv*.55))/.8))});
  nodeMarks.forEach(n=>{const s=eo((t-(tr+1.9+n.li*.55))/.4);n.m.visible=s>0;n.m.scale.setScalar(Math.max(.001,s))});
  gold.forEach(g=>{const s=eo((t-(tr+3.6+g.u*1.4))/.25);g.mesh.visible=s>0;setDraw(g.mesh,s)});
  {const s=eo((t-(tr+5.0))/.4);dia.visible=s>0;dia.scale.setScalar(Math.max(.001,s));dia.rotation.y=t*1.2}
  // 文字は最後の1枚だけ
  const a1=eo((t-23.2)/.9),a2=eo((t-24.0)/.8),a3=eo((t-24.8)/.8);
  $('veil').style.opacity=a1;$('l1').style.opacity=a1;$('l1').style.transform=`translateY(${(1-a1)*18}px)`;
  $('l2').style.opacity=a2;$('l3').style.opacity=a3;
  renderer.render(scene,cam);
}
window.render=render;

// ---------- 再生まわり ----------
function fit(){const s=Math.min(innerWidth/W,(innerHeight-56)/H);$('stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
const qs=new URLSearchParams(location.search);
let playing=!qs.has('t'),t=parseFloat(qs.get('t')||'0'),last=null;
const seek=$('seek'),tl=$('time'),pb=$('play');
function sync(){seek.value=t;tl.textContent=`${t.toFixed(1)} / ${DUR.toFixed(1)} 秒`;pb.textContent=playing?'一時停止':'再生'}
let drawn=-1;function loop(now){if(playing){if(last!=null){t+=(now-last)/1000;if(t>=DUR)t=0}last=now}else last=null;if(playing||t!==drawn){try{render(t)}catch(e){console.error(e)}drawn=t}sync();requestAnimationFrame(loop)}
pb.onclick=()=>{playing=!playing};seek.oninput=()=>{t=+seek.value;playing=false};
window.seekTo=v=>{t=v;playing=false};
let started=false;function start(){if(started)return;started=true;window.READY=true;requestAnimationFrame(loop)}
(document.fonts?document.fonts.ready:Promise.resolve()).then(start,start);setTimeout(start,1500);
</script>
