<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゆくすいえ　通し試作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFAF0;--sky:#CFEBFA;--ground:#F3E7CF;--grass:#9BD27A;--ink:#1E2B36;--ink2:#6B6358;--lamp:#FFD98A;
  --kazu:#E8701F;--kazuT:#B3541A;--yuu:#1C8DCC;--yuuT:#14699A;--gold:#F2C230;--goldT:#8C6A00;--stat:#2E5A88;--feel:#5A4A3C;
  --f:"Hiragino Sans","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Zen Maru Gothic",sans-serif;
  --fr:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#E9E2D3;overflow:hidden}
body{font-family:var(--f);color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:center;background:var(--paper);overflow:hidden}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block;animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 共通の枠：左に分譲地、右に操作パネル */
.left{position:absolute;left:0;top:0;width:1100px;height:1080px;background:linear-gradient(var(--sky),#EAF6FC 46%,var(--ground) 46.1%)}
.left svg.est{position:absolute;left:30px;top:120px;width:1040px;height:860px}
.right{position:absolute;left:1100px;top:0;width:820px;height:1080px;padding:56px 64px;background:var(--paper);border-left:2px solid rgba(30,43,54,.08)}
.hud{position:absolute;left:40px;top:34px;display:flex;gap:14px;align-items:center;font-size:22px;z-index:5}
.chip{background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:6px 18px;font-weight:700}
.chip.soft{border-color:rgba(30,43,54,.25);font-weight:400;color:var(--ink2)}
h2{font-family:var(--fr);font-weight:900;font-size:44px;letter-spacing:.02em;margin-bottom:22px}
h3{font-size:24px;font-weight:700;margin:18px 0 10px}
p.lead{font-size:24px;line-height:1.7;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:10px;font:700 26px var(--f);padding:16px 34px;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:default}
.nav{position:absolute;right:64px;bottom:48px;display:flex;gap:14px}
.dots{position:absolute;left:1164px;bottom:66px;display:flex;gap:8px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(30,43,54,.18)}.dots i.on{background:var(--ink)}
.k{color:var(--kazuT)}.y{color:var(--yuuT)}.g{color:var(--goldT)}
.sq::before{content:"■";color:var(--kazu);margin-right:6px}.ci::before{content:"●";color:var(--yuu);margin-right:6px}.di::before{content:"◆";color:var(--gold);margin-right:6px;-webkit-text-stroke:.6px var(--goldT)}
.card{background:#fff;border:1.5px solid rgba(30,43,54,.2);border-radius:16px;padding:22px 26px;box-shadow:0 3px 0 rgba(30,43,54,.06)}
.say{font-size:24px;line-height:1.6;margin:10px 0}
.input{display:flex;gap:10px;margin-top:16px}
.input input{flex:1;font:24px var(--f);padding:14px 18px;border:2px solid var(--ink);border-radius:12px;background:#fff}
.mono{font-family:"SFMono-Regular",Menlo,Consolas,monospace}
.coShape{display:inline-grid;place-items:center;width:44px;height:44px;background:var(--ink);color:var(--paper);font-weight:900;font-size:22px}
.coShape.square{border-radius:4px}.coShape.circle{border-radius:50%}.coShape.triangle{clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:12px}.coShape.hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
/* 注記 */
.note{font-size:18px;line-height:1.7;color:var(--ink2)}
/* 付箋 */
.sticky{position:absolute;width:210px;min-height:96px;padding:12px 14px;font-size:20px;line-height:1.45;border-radius:4px;box-shadow:0 4px 0 rgba(30,43,54,.1);transform:rotate(var(--r,0deg));animation:pop .4s ease both}
.sticky.k{background:#FDE3CC;color:var(--ink);border-top:6px solid var(--kazu)}.sticky.y{background:#D6ECF8;color:var(--ink);border-top:6px solid var(--yuu)}
.sticky .who{font-size:15px;font-weight:700;display:block;margin-bottom:4px}
@keyframes pop{from{opacity:0;transform:translateY(16px) rotate(var(--r,0deg))}to{opacity:1;transform:rotate(var(--r,0deg))}}
/* 表 */
table.led{width:100%;border-collapse:collapse;font-size:19px}
table.led th,table.led td{padding:7px 8px;border-bottom:1px solid rgba(30,43,54,.12);text-align:right}
table.led th:first-child,table.led td:first-child{text-align:left}
table.led td.off{color:#B5AEA3}
table.led tr.sum td{font-weight:700;border-top:2px solid var(--ink)}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{font:700 20px var(--f);padding:10px 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--paper);cursor:pointer}.tabs button.on{background:var(--ink);color:var(--paper)}
/* 取引の手順 */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 18px}.steps div{font-size:18px;text-align:center;padding:10px 4px;border-radius:10px;border:1.5px solid rgba(30,43,54,.2);color:var(--ink2)}.steps div.on{border-color:var(--ink);color:var(--ink);font-weight:700;background:#fff}
.tool{font-size:16px;line-height:1.55;background:#1E2B36;color:#E9EEF2;border-radius:12px;padding:14px 16px;height:250px;overflow:hidden}
.tool .c{color:#FFD98A}.tool .r{color:#9FD3F0}.tool .m{color:#B9C3CB}
/* 世界樹 */
.treeWrap svg{width:100%;height:auto;display:block}
.tEst svg.est{position:static;width:100%;height:100%}
/* 16の担当者 */
.agents{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.agents div{font-size:15px;line-height:1.4;padding:10px 10px;border-radius:10px;background:#fff;border:1.5px solid rgba(30,43,54,.14);min-height:76px;opacity:.35;transition:opacity .3s}.agents div.on{opacity:1}.agents b{display:block;font-size:13px;color:var(--ink2)}
/* SNS */
.sns{position:absolute;left:1132px;top:40px;width:560px;background:#fff;border-radius:16px;border:1.5px solid rgba(30,43,54,.18);padding:14px 18px;box-shadow:0 8px 24px rgba(30,43,54,.12);font-size:20px;line-height:1.5;animation:drop .6s ease both;z-index:6}
.sns small{color:var(--ink2);font-size:15px}
@keyframes drop{from{opacity:0;transform:translateY(-20px)}to{opacity:1}}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice .card{min-height:230px;cursor:pointer}.choice .card:hover{border-color:var(--ink)}
.choice h4{font-size:26px;margin-bottom:10px;font-family:var(--fr);font-weight:900}.choice li{font-size:20px;line-height:1.6;margin-left:1.1em}
.verdict{font-family:var(--fr);font-weight:900;font-size:40px;margin:6px 0 8px}
.bar{height:16px;border-radius:8px;background:rgba(30,43,54,.1);overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
</style>
</head>
<body>
<div id="stage"></div>
<script src="engine.js"></script>
<script src="iso.js"></script>
<script>
'use strict';
const Y = window.YKS, I = window.ISO;
const $ = (s, el = document) => el.querySelector(s);
const stage = $('#stage');
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.setProperty('--k', k); }
addEventListener('resize', fit); fit();
const Q = new URLSearchParams(location.search);
const man = n => n.toLocaleString('ja-JP') + '万円';
const yen = v => Math.round(v * 10000).toLocaleString('ja-JP') + '円';

// ===== 状態 =====
const H = Y.HOUSEHOLDS.t2;
const LOG = Y.createLog();
const CHOSEN = [0, 1, 1, 0]; // C／キッチン／◆（選んだ道）／箱型
const THIRD = { D3: { label: '借入を少し増やして、南の大きな窓だけトリプルガラスに', patch: { borrowAdd: 60, spec: { window: 'triple' } } } };
const OPTS = { household: H, seed: 7, chosen: CHOSEN, thirdAt: THIRD };
const WORLDS = Y.allWorlds(OPTS);
const YOU = Y.worldNo(CHOSEN); // 07
const W = n => WORLDS[n - 1];
const WHO = ['y', 'k', 'g', 'k']; // その決断に寄った人（ゆう／かず／ふたり）
const DETAIL = { 7: 'あなたの世界', 15: '会社違いの世界', 5: '予算・仕様違いの世界', 13: '大きな出来事の世界' };

function worldView(stageOf = () => 4, opt = {}) {
  return WORLDS.map(w => ({ no: w.no, stage: stageOf(w), roof: w.spec.roof, fin: I.FINISH[(w.no * 5) % 8], lamp: opt.lamp, third: !!w.third && w.no === YOU, gravel: w.spec.exterior !== 'full' && stageOf(w) >= 4, mark: opt.mark ? opt.mark(w) : '' }));
}

// ===== 世界樹 =====
function treeSVG(depth = 4, opt = {}) {
  const Wd = 660, Ht = opt.h || 420, x0 = 30, dx = (Wd - 80) / 4;
  const leafY = i => 20 + i * ((Ht - 40) / 15);
  const nodeY = (lvl, idx) => { const span = 16 >> lvl; let s = 0; for (let k = 0; k < span; k++) s += leafY(idx * span + k); return s / span; };
  let s = '';
  for (let lvl = 0; lvl < 4; lvl++) {
    for (let idx = 0; idx < (1 << lvl); idx++) {
      for (let b = 0; b < 2; b++) {
        const child = idx * 2 + b;
        const onPath = CHOSEN.slice(0, lvl).every((c, k) => c === (idx >> (lvl - 1 - k) & 1)) && CHOSEN[lvl] === b;
        const vis = lvl < depth;
        const xA = x0 + lvl * dx, yA = nodeY(lvl, idx), xB = x0 + (lvl + 1) * dx, yB = nodeY(lvl + 1, child);
        const who = WHO[lvl];
        const col = onPath ? ({ k: '#E8701F', y: '#1C8DCC', g: '#C99A00' })[who] : 'rgba(30,43,54,.28)';
        const dash = onPath && who === 'g' ? 'stroke-dasharray="10 6"' : '';
        if (vis) s += `<path d="M${xA},${yA} C${xA + dx * .5},${yA} ${xB - dx * .5},${yB} ${xB},${yB}" fill="none" stroke="${col}" stroke-width="${onPath ? 5 : 2}" ${dash} stroke-linecap="round"/>`;
      }
      const onPathNode = CHOSEN.slice(0, lvl).every((c, k) => c === (idx >> (lvl - 1 - k) & 1));
      const x = x0 + lvl * dx, y = nodeY(lvl, idx);
      if (lvl < depth) {
        if (onPathNode) {
          const who = WHO[lvl];
          if (who === 'k') s += `<rect x="${x - 9}" y="${y - 9}" width="18" height="18" fill="#E8701F" stroke="#1E2B36" stroke-width="1.5"/>`;
          else if (who === 'y') s += `<circle cx="${x}" cy="${y}" r="10" fill="#1C8DCC" stroke="#1E2B36" stroke-width="1.5"/>`;
          else s += `<polygon points="${x},${y - 13} ${x + 11},${y} ${x},${y + 13} ${x - 11},${y}" fill="#F2C230" stroke="#8C6A00" stroke-width="1.8"/>`;
        } else s += `<circle cx="${x}" cy="${y}" r="4" fill="rgba(30,43,54,.35)"/>`;
      }
    }
  }
  if (depth >= 4) for (let i = 0; i < 16; i++) {
    const you = i + 1 === YOU, hi = opt.hi && opt.hi.includes(i + 1);
    s += `<g transform="translate(${x0 + 4 * dx + 18},${leafY(i)})"><rect x="0" y="-11" width="40" height="22" rx="5" fill="${you ? '#1E2B36' : hi ? '#fff' : '#FFFAF0'}" stroke="${hi || you ? '#1E2B36' : 'rgba(30,43,54,.3)'}" stroke-width="1.4"/><text x="20" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="${you ? '#FFFAF0' : '#1E2B36'}">${String(i + 1).padStart(2, '0')}</text></g>`;
  }
  return `<svg viewBox="0 0 ${Wd} ${Ht}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

// ===== 画面 =====
const SCREENS = [];
const def = (id, title, render, onEnter) => SCREENS.push({ id, title, render, onEnter });

// B1・B13　起動画面
def('B1', '起動画面', () => `
  <div style="position:absolute;inset:0;background:linear-gradient(var(--sky),#F4FAFD 55%,var(--ground) 55.1%)"></div>
  <div class="tEst" style="position:absolute;left:860px;top:170px;width:1060px;height:900px">${I.estate(worldView(w => w.no % 5 === 0 ? 3 : 4))}</div>
  <div style="position:absolute;left:120px;top:250px;width:760px">
    <div style="font-family:var(--fr);font-weight:900;font-size:128px;letter-spacing:.04em;line-height:1;white-space:nowrap">ゆくすいえ</div>
    <div style="font-size:34px;letter-spacing:.14em;margin-top:22px;font-weight:700">YUKUSUIE: <span style="font-weight:400">16 unbuilt futures</span></div>
    <div style="font-family:var(--fr);font-weight:700;font-size:46px;margin-top:64px">16回目の、マイホームへ。</div>
    <div style="display:flex;gap:18px;margin-top:64px">
      <button class="btn" data-go="+1">はじめる</button>
      <button class="btn ghost" disabled title="1回遊ぶと開きます">16の世界を、AIにまかせて見る</button>
    </div>
    <p class="note" style="margin-top:44px;width:720px">本作の制度・手続き・金額・期間などの設定は、体験のために簡略化しています。実際の家づくりでは、地域・金融機関・住宅会社によって異なります。登場する住宅会社・人物・団体はすべて架空です。</p>
  </div>`);

// B2　世帯と家計
def('B2', '世帯と家計', () => {
  const lim = Y.loanLimit(H), mo = Y.payment(4700, Y.RATE.variable);
  const fam = Object.values(Y.HOUSEHOLDS).map((h, i) => `
    <div class="card" style="${h.id === 't2' ? 'border:3px solid var(--ink)' : 'opacity:.55'}">
      <div style="font-size:18px;color:var(--ink2)">家族 ${i + 1}</div>
      <div class="say" style="font-size:24px;min-height:110px">${h.story}</div>
    </div>`).join('');
  return `
  <div class="left" style="background:var(--paper)">
    <div style="position:absolute;left:90px;top:120px;width:920px">
      <h2>どの家族で、建てますか。</h2>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">${fam}</div>
      <h3 style="margin-top:44px">ふたり</h3>
      <div style="display:flex;gap:26px;font-size:28px"><span class="sq">かず</span><span class="ci">ゆう</span><span style="color:var(--ink2)">子ども ふたり（5歳・2歳）</span></div>
    </div>
  </div>
  <div class="right">
    <h2 style="font-size:36px">わが家のお財布</h2>
    <table class="led" style="font-size:24px">
      <tr><td>世帯年収（税込）</td><td>${man(H.income)}</td></tr>
      <tr><td>毎月の手取り（ボーナスを除く）</td><td>${Y.monthlyTakeHome(H)}万円</td></tr>
      <tr><td>家に入れられる預金</td><td>${man(H.saveHouse)}</td></tr>
      <tr><td>手元に残す預金</td><td>${man(H.saveKeep)}</td></tr>
    </table>
    <div class="card" style="margin-top:30px">
      <div style="font-size:20px;color:var(--ink2)">借りられそうな額（審査の目安）</div>
      <div style="font-family:var(--fr);font-weight:900;font-size:56px">約${lim.toLocaleString()}万円</div>
      <div style="font-size:21px;color:var(--ink2);margin-top:6px">4,700万円を変動 年${Y.RATE.variable * 100}%・35年で借りると、月々 約${(Math.round(mo * 10) / 10)}万円</div>
    </div>
    <p class="note" style="margin-top:20px">金利・審査の基準はゲーム内の仮定です。</p>
    <div class="nav"><button class="btn" data-go="+1">この家族で始める</button></div>
  </div>`;
});

// B3　区画の当選
def('B3', '区画の当選', () => `
  <div class="left"><div class="hud"><span class="chip">0日目</span><span class="chip soft">土地の契約期限まで 60日</span></div>
    ${I.estate(worldView(() => 0), { selected: YOU, you: YOU })}</div>
  <div class="right">
    <div style="font-size:22px;color:var(--ink2)">分譲地の事務局から</div>
    <h2 style="margin-top:8px">第二希望の区画が、当たりました。</h2>
    <div class="card" style="margin-top:12px">
      <table class="led" style="font-size:23px">
        <tr><td>広さ</td><td>約${Y.SITE.tsubo}坪（${Y.SITE.area}㎡）</td></tr>
        <tr><td>価格</td><td>${man(Y.SITE.price)}</td></tr>
        <tr><td>用途地域</td><td>第一種住居地域</td></tr>
        <tr><td>建蔽率／容積率</td><td>60%／150%</td></tr>
        <tr><td>土地の契約期限</td><td>60日後</td></tr>
      </table>
    </div>
    <p class="lead" style="margin-top:26px">ほかの15の世界でも、同じ日に、同じ区画が当たりました。</p>
    <div class="nav"><button class="btn" data-go="+1">家の話をはじめる</button></div>
  </div>`);

// A3　要望を話す → 付箋 → ぶつかり
const WISH = [
  ['k', 'かず', 'かっこいい外観。ミニマルに。'], ['y', 'ゆう', '木を使った、ナチュラルな家がいい'],
  ['k', 'かず', '1階に寝室。大きめのウォークインクローゼット'], ['y', 'ゆう', '庭は広め。畑と、うさぎの囲い'],
  ['k', 'かず', '広いシューズクローク'], ['y', 'ゆう', '明るいリビング。南に大きな窓'],
  ['k', 'かず', '造作のキッチン'], ['y', 'ゆう', 'カーポート2台と物置'],
];
const CLASH = [[0, 1, '外観'], [2, 3, '1階の広さと庭']];
def('A3', '要望を話す', () => `
  <div class="left" style="background:#F6EFE2">
    <div class="hud"><span class="chip">3日目</span><span class="chip soft">ふたりの要望</span></div>
    <div id="board" style="position:absolute;left:40px;top:110px;width:1020px;height:900px"></div>
    <svg id="clash" style="position:absolute;left:40px;top:110px;width:1020px;height:900px;pointer-events:none"></svg>
  </div>
  <div class="right">
    <h2 style="font-size:38px">ふたりの、こうしたい。</h2>
    <p class="lead">思いつくまま、話してください。Claudeが付箋にして、ぶつかるところを見つけます。</p>
    <div class="input"><input id="wishIn" placeholder="例：玄関は広めがいい" value="${WISH[0][2]}"><button class="btn" id="wishGo">話す</button></div>
    <div class="card" style="margin-top:26px">
      <div style="font-size:20px;color:var(--ink2)">敷地に入るか（エンジンの計算）</div>
      <div id="cov" style="font-size:24px;margin-top:8px;line-height:1.6">—</div>
      <div class="bar" style="margin-top:10px"><i id="covBar" style="width:0"></i></div>
    </div>
    <div id="clashList" style="margin-top:20px;font-size:22px;line-height:1.7"></div>
    <div class="nav"><button class="btn" data-go="+1">住宅会社に会いに行く</button></div>
  </div>`, (el) => {
  let n = 0; const board = $('#board', el), svg = $('#clash', el);
  const pos = i => [70 + (i % 2) * 520 + (i % 3) * 20, 30 + Math.floor(i / 2) * 210];
  function add() {
    if (n >= WISH.length) return;
    const [c, who, txt] = WISH[n]; const [x, y] = pos(n);
    board.insertAdjacentHTML('beforeend', `<div class="sticky ${c}" style="left:${x}px;top:${y}px;--r:${(n % 3 - 1) * 1.6}deg"><span class="who ${c === 'k' ? 'sq' : 'ci'}">${who}</span>${txt}</div>`);
    n++;
    LOG.push('wish', { who, text: txt });
    // ぶつかりの検出（試作：あらかじめ用意した2組。本番はClaudeが対立軸の辞書から選ぶ）
    CLASH.forEach(([a, b, lab]) => {
      if (n === b + 1) {
        const [x1, y1] = pos(a), [x2, y2] = pos(b);
        svg.insertAdjacentHTML('beforeend', `<path d="M${x1 + 210},${y1 + 50} L${x2},${y2 + 50}" stroke="#C99A00" stroke-width="3" stroke-dasharray="8 6" fill="none"/><g transform="translate(${(x1 + 210 + x2) / 2},${(y1 + y2) / 2 + 50})"><polygon points="0,-12 11,0 0,12 -11,0" fill="#F2C230" stroke="#8C6A00" stroke-width="1.5"/></g>`);
        $('#clashList', el).insertAdjacentHTML('beforeend', `<div class="di">${lab}：<span class="k">かず</span>と<span class="y">ゆう</span>の思いが、ぶつかりそう</div>`);
      }
    });
    if (n >= 4) {

// A5の続き　自由回答の取引（Claudeがエンジンを道具として呼び、検算してから答える）
def('A5b', '自由回答を確かめる', () => `
  <div class="left"><div class="hud"><span class="chip">96日目</span><span class="chip soft">ローン特約の期限まで 17日</span></div>
    <div class="treeWrap" style="position:absolute;left:220px;top:150px;width:660px" id="tree3">${treeSVG(2)}</div>
    <div id="b2"></div>
  </div>
  <div class="right">
    <div style="font-size:22px;color:var(--ink2)">あなたの答え</div>
    <div class="say di" style="font-size:26px">「借入を少し増やして、南の大きな窓だけトリプルガラスにしたい」</div>
    <div class="steps" id="steps"><div>読み替え</div><div>仮計算</div><div>条件</div><div>承認</div><div>確定</div></div>
    <div class="tool mono" id="tool"></div>
    <div id="vd" style="margin-top:18px"></div>
    <div class="nav"><button class="btn ghost" id="ok" style="display:none">この条件で進める</button><button class="btn" data-go="+1">16の世界へ</button></div>
  </div>`, (el) => {
  const st = { spec: { ...Y.baseSpec(H), kitchen: true, exterior: 'min' }, company: 'C', principal: W(5).principal, household: H, loanDeadlineLeft: 17 };
  const prop = { borrowAdd: 60, spec: { window: 'triple' } };
  const sim = Y.simulate(st, prop);
  const lines = [
    ['m', '// Claude（上位）：入力を「変更の提案」に読み替える'],
    ['c', 'propose({ 借入: "+60万円", 窓: "南の大開口をトリプルガラスに" })'],
    ['m', '// 理由も記録する（決断の記憶）'],
    ['c', 'remember({ 理由: "冬の朝の寒さが気になった", 優先: "暮らしの心地よさ" })'],
    ['m', '// Claude → エンジン：数字はエンジンに聞く'],
    ['c', `engine.quote(company: "C", window: "triple")`], ['r', `→ 差額 +${sim.diff}万円`],
    ['c', `engine.loanCheck(借入: ${sim.principal.toLocaleString()}万円)`], ['r', `→ 返済負担率 ${sim.loan.ratio}%　審査の上限内`],
    ['c', 'engine.schedule(再審査)'], ['r', `→ +${sim.days}日　特約の期限まで残り${17 - sim.days}日`],
    ['m', '// 検算：借入の増額 60万円 ≧ 差額 ' + sim.diff + '万円　→ 合う'],
    ['c', `verdict = "${sim.verdict}"`],
  ];
  const tool = $('#tool', el); let i = 0;
  const stepAt = [0, 4, 9, 12, 13];
  const tick = () => {
    if (i < lines.length) {
      const [c, t] = lines[i]; tool.insertAdjacentHTML('beforeend', `<div class="${c}">${t}</div>`); tool.scrollTop = 1e6;
      el.querySelectorAll('#steps div').forEach((d, k) => d.classList.toggle('on', i >= stepAt[k] && (k === 4 ? false : i < (stepAt[k + 1] ?? 99))));
      i++; tick.t = setTimeout(tick, Q.get('done') ? 0 : 420);
    } else {
      el.querySelectorAll('#steps div').forEach((d, k) => d.classList.toggle('on', k === 3));
      $('#vd', el).innerHTML = `<div class="verdict">${sim.verdict}で、できます。</div><div style="font-size:22px;line-height:1.7">${sim.conditions.map(c => '・' + c).join('<br>')}</div>`;
      $('#ok', el).style.display = '';
    }
  };
  $('#ok', el).onclick = () => {
    el.querySelectorAll('#steps div').forEach((d, k) => d.classList.toggle('on', k === 4));
    $('#tree3', el).innerHTML = treeSVG(3); $('#ok', el).style.display = 'none';
    LOG.push('decision', { id: 'D3', third: true, text: THIRD.D3.label, reason: '冬の朝の寒さが気になった' });
  };
  tick();
  if (Q.get('done')) setTimeout(() => $('#ok', el).onclick(), 600);
});

    <div id="est6">${I.estate(worldView(() => 4), { you: YOU })}</div>
  </div>
  <div class="right">
    <h2 style="font-size:38px">16の、わが家。</h2>
    <div id="card6"></div>

  </div>`, (el) => {
  function card(no) {
    const w = W(no), co = Y.COMPANIES[w.company];
    const tag = DETAIL[no] ? `<span class="chip" style="font-size:18px">${DETAIL[no]}</span>` : '';
    $('#card6', el).innerHTML = `
      <div class="card">
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><span style="font-family:var(--fr);font-weight:900;font-size:40px">${String(no).padStart(2, '0')}</span><span class="coShape ${co.shape}" style="width:34px;height:34px;font-size:16px;${co.shape === 'triangle' ? 'padding-top:9px' : ''}">${w.company}</span>${tag}</div>
        <div style="font-size:21px;line-height:1.7">${Y.DECISIONS.map((d, i) => { const b = w.bits[i]; const isThird = w.third === d.id; return `<div class="${isThird ? 'di' : ''}">${d.q}　<b>${isThird ? THIRD.D3.label : (b ? d.b.label : d.a.label)}</b></div>`; }).join('')}</div>
        <table class="led" style="margin-top:12px;font-size:21px">
          <tr><td>土地と建物の総額</td><td>${man(w.total)}</td></tr>
          <tr><td>冬の朝の暖かさ</td><td>${w.warmth.label}</td></tr>
          <tr><td>家計のゆとり</td><td>${w.slack.label}</td></tr>
          <tr><td>着工から引き渡しまで</td><td>${w.days - 120}日</td></tr>
        </table>
        <div style="font-size:20px;line-height:1.7;margin-top:10px;color:var(--ink2)">${w.events.length ? w.events.map(e => '・' + e).join('<br>') : '・大きな出来事はなく、1年が過ぎた'}</div>
      </div>`;
    $('#est6', el).innerHTML = I.estate(worldView(() => 4), { you: YOU, selected: no });
    bind();
  }
  function bind() { el.querySelectorAll('.lot').forEach(g => { g.style.cursor = 'pointer'; g.onclick = () => card(+g.dataset.no); }); }
  $('#rewind', el).onclick = () => card(5);
  card(+(Q.get('lot') || YOU));
});

  { no: 13, co: 'A', who: '工事の担当', t: '契約のあとで担当が替わり、打ち合わせの記録の一部が、うまく引き継がれていませんでした。' },

      <div style="display:flex;height:46px;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;width:${q.real / max * 100}%">
        ${q.lines.map(l => `<div title="${l.label}" style="width:${l.v / q.real * 100}%;background:${l.shown ? '#1E2B36' : '#E4DED3'};border-right:1px solid #fff"></div>`).join('')}
      </div>
      <div style="font-size:20px;text-align:right">表紙 ${q.cover.toLocaleString()}<br><b>総額 ${q.real.toLocaleString()}</b></div>

});

    <div class="nav"><button class="btn" data-go="0">最初へ</button></div>
  </div>`);

// ===== 進行 =====
SCREENS.forEach((s, i) => { const d = document.createElement('section'); d.className = 'scr'; d.id = 's' + i; stage.appendChild(d); });
let cur = -1;
function go(n) {
  n = Math.max(0, Math.min(SCREENS.length - 1, n));
  if (cur >= 0) $('#s' + cur).classList.remove('on');
  cur = n; const sc = SCREENS[n], el = $('#s' + n);
  el.innerHTML = sc.render() + `<div class="dots">${SCREENS.map((_, i) => `<i class="${i === n ? 'on' : ''}"></i>`).join('')}</div>`;
  el.classList.add('on');
  el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const v = b.dataset.go; go(v[0] === '+' ? cur + (+v.slice(1)) : +v); });
  if (sc.onEnter) sc.onEnter(el);
  LOG.push('screen', { id: sc.id });
  history.replaceState(null, '', '?s=' + n);
}
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') go(cur + 1); if (e.key === 'ArrowLeft') go(cur - 1); });
window.YUKU = { go, SCREENS, WORLDS, LOG };
const s0 = Q.get('s'); go(s0 ? +s0 : 0);
if (Q.get('done')) history.replaceState(null, '', location.search);
</script>
